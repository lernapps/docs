u003cp>\u003cem>Each cell is what one role gives, or could give, to another. Current flows happen today; potential ones need the platform to enable them.\u003c/em>\u003c/p>\n\u003cp>Money flows only to commercial teacher platforms. Feedback and reputation, which drive quality, are all potential: they are exactly what creators lack today, from adults as well as from students. Gratitude can flow in all directions, to a different degree in each. Teacher platforms gain little: for commercial ones, free apps are competition, so exchanges with them are likely limited to non-profit platforms. AI assistants receive nothing from the peer roles; what they need, instructions and scaffolding, comes from the platform itself.\u003c/p>\n"},{"kind":"prose","text":"*Each cell is what one role gives, or could give, to another. Current flows happen today; potential ones need the platform to enable them.*","line":10,"renderedHtml":""},{"kind":"prose","text":"","line":11,"renderedHtml":""},{"kind":"prose","text":"Money flows only to commercial teacher platforms. Feedback and reputation, which drive quality, are all potential: they are exactly what creators lack today, from adults as well as from students. Gratitude can flow in all directions, to a different degree in each. Teacher platforms gain little: for commercial ones, free apps are competition, so exchanges with them are likely limited to non-profit platforms. AI assistants receive nothing from the peer roles; what they need, instructions and scaffolding, comes from the platform itself.","line":12,"renderedHtml":""},{"kind":"prose","text":"","line":13,"renderedHtml":""},{"kind":"heading","level":2,"text":"Apps for their class or child","line":14},{"kind":"prose","text":"","line":15,"renderedHtml":"\u003cp>Creators give adults apps for their class or child. Today this stays within their own circle.\u003c/p>\n"},{"kind":"prose","text":"Creators give adults apps for their class or child. Today this stays within their own circle.","line":16,"renderedHtml":""},{"kind":"prose","text":"","line":17,"renderedHtml":""},{"kind":"block","blockType":"motivation","attributes":{"id":"m-creators-adopters","from":"e-creators","to":"e-adopters","gives":"Apps for their class or child","status":"current","kind":"goods"},"startLine":19,"endLine":26,"inPdt42Fence":true},{"kind":"prose","text":"","line":28,"renderedHtml":""},{"kind":"heading","level":2,"text":"Attention: they put the app into use","line":29},{"kind":"prose","text":"","line":30,"renderedHtml":"\u003cp>Adults give creators attention by putting their app into use, again only locally today. Attention for contributed apps is the scarce resource (E6).\u003c/p>\n"},{"kind":"prose","text":"Adults give creators attention by putting their app into use, again only locally today. Attention for contributed apps is the scarce resource (E6).","line":31,"renderedHtml":""},{"kind":"prose","text":"","line":32,"renderedHtml":""},{"kind":"block","blockType":"motivation","attributes":{"id":"m-adopters-creators-attention","from":"e-adopters","to":"e-creators","gives":"Attention: they put the app into use","status":"current","kind":"attention"},"startLine":34,"endLine":41,"inPdt42Fence":true},{"kind":"prose","text":"","line":43,"renderedHtml":""},{"kind":"heading","level":2,"text":"Feedback from classroom use","line":44},{"kind":"prose","text":"","line":45,"renderedHtml":"\u003cp>Feedback from classroom use hardly reaches creators today; its lack is one of their pressures (D2).\u003c/p>\n"},{"kind":"prose","text":"Feedback from classroom use hardly reaches creators today; its lack is one of their pressures (D2).","line":46,"renderedHtml":""},{"kind":"prose","text":"","line":47,"renderedHtml":""},{"kind":"block","blockType":"motivation","attributes":{"id":"m-adopters-creators-feedback","from":"e-adopters","to":"e-creators","gives":"Feedback from classroom use","status":"potential","kind":"feedback"},"startLine":49,"endLine":56,"inPdt42Fence":true},{"kind":"prose","text":"","line":58,"renderedHtml":""},{"kind":"heading","level":2,"text":"Recognition by recommending the app","line":59},{"kind":"prose","text":"","line":60,"renderedHtml":"\u003cp>Recommending an app would give its creator recognition, which creators seek (D2).\u003c/p>\n"},{"kind":"prose","text":"Recommending an app would give its creator recognition, which creators seek (D2).","line":61,"renderedHtml":""},{"kind":"prose","text":"","line":62,"renderedHtml":""},{"kind":"block","blockType":"motivation","attributes":{"id":"m-adopters-creators-reputation","from":"e-adopters","to":"e-creators","gives":"Recognition by recommending the app","status":"potential","kind":"reputation"},"startLine":64,"endLine":71,"inPdt42Fence":true},{"kind":"prose","text":"","line":73,"renderedHtml":""},{"kind":"heading","level":2,"text":"Apps to understand the subject","line":74},{"kind":"prose","text":"","line":75,"renderedHtml":"\u003cp>The apps are built for students, to help them understand the subject.\u003c/p>\n"},{"kind":"prose","text":"The apps are built for students, to help them understand the subject.","line":76,"renderedHtml":""},{"kind":"prose","text":"","line":77,"renderedHtml":""},{"kind":"block","blockType":"motivation","attributes":{"id":"m-creators-students","from":"e-creators","to":"e-students","gives":"Apps to understand the subject","status":"current","kind":"goods"},"startLine":79,"endLine":86,"inPdt42Fence":true},{"kind":"prose","text":"","line":88,"renderedHtml":""},{"kind":"heading","level":2,"text":"Attention: they return to the app on their own","line":89},{"kind":"prose","text":"","line":90,"renderedHtml":"\u003cp>Students who know an app may return to it on their own.\u003c/p>\n"},{"kind":"prose","text":"Students who know an app may return to it on their own.","line":91,"renderedHtml":""},{"kind":"prose","text":"","line":92,"renderedHtml":""},{"kind":"block","blockType":"motivation","attributes":{"id":"m-students-creators","from":"e-students","to":"e-creators","gives":"Attention: they return to the app on their own","status":"current","kind":"attention"},"startLine":94,"endLine":101,"inPdt42Fence":true},{"kind":"prose","text":"","line":103,"renderedHtml":""},{"kind":"heading","level":2,"text":"Gratitude","line":104},{"kind":"prose","text":"","line":105,"renderedHtml":"\u003cp>Gratitude can potentially flow in all directions, to a different degree in each. It is a form of recognition, so it is recorded as reputation. The cells below cover the three core roles; between the partners it is weaker and left out. How strong each direction is remains open.\u003c/p>\n"},{"kind":"prose","text":"Gratitude can potentially flow in all directions, to a different degree in each. It is a form of recognition, so it is recorded as reputation. The cells below cover the three core roles; between the partners it is weaker and left out. How strong each direction is remains open.","line":106,"renderedHtml":""},{"kind":"prose","text":"","line":107,"renderedHtml":""},{"kind":"heading","level":3,"text":"Gratitude for an app that helped","line":108},{"kind":"prose","text":"","line":109,"renderedHtml":"\u003cp>Students who were helped by an app could show some gratitude to its creator. This recognition comes from the people the app was built for.\u003c/p>\n"},{"kind":"prose","text":"Students who were helped by an app could show some gratitude to its creator. This recognition comes from the people the app was built for.","line":110,"renderedHtml":""},{"kind":"prose","text":"","line":111,"renderedHtml":""},{"kind":"block","blockType":"motivation","attributes":{"id":"m-students-creators-gratitude","from":"e-students","to":"e-creators","gives":"Gratitude for an app that helped","status":"potential","kind":"reputation"},"startLine":113,"endLine":120,"inPdt42Fence":true},{"kind":"prose","text":"","line":122,"renderedHtml":""},{"kind":"heading","level":3,"text":"Gratitude for bringing the app to them","line":123},{"kind":"prose","text":"","line":124,"renderedHtml":"\u003cp>Students could be grateful to the adult who showed them an app that helped.\u003c/p>\n"},{"kind":"prose","text":"Students could be grateful to the adult who showed them an app that helped.","line":125,"renderedHtml":""},{"kind":"prose","text":"","line":126,"renderedHtml":""},{"kind":"block","blockType":"motivation","attributes":{"id":"m-students-adopters-gratitude","from":"e-students","to":"e-adopters","gives":"Gratitude for bringing the app to them","status":"potential","kind":"reputation"},"startLine":128,"endLine":135,"inPdt42Fence":true},{"kind":"prose","text":"","line":137,"renderedHtml":""},{"kind":"heading","level":3,"text":"Gratitude for an app that worked in class","line":138},{"kind":"prose","text":"","line":139,"renderedHtml":"\u003cp>Adults could thank a creator for an app that worked in their class, beyond recommending it.\u003c/p>\n"},{"kind":"prose","text":"Adults could thank a creator for an app that worked in their class, beyond recommending it.","line":140,"renderedHtml":""},{"kind":"prose","text":"","line":141,"renderedHtml":""},{"kind":"block","blockType":"motivation","attributes":{"id":"m-adopters-creators-gratitude","from":"e-adopters","to":"e-creators","gives":"Gratitude for an app that worked in class","status":"potential","kind":"reputation"},"startLine":143,"endLine":150,"inPdt42Fence":true},{"kind":"prose","text":"","line":152,"renderedHtml":""},{"kind":"heading","level":3,"text":"Gratitude for putting the app into use","line":153},{"kind":"prose","text":"","line":154,"renderedHtml":"\u003cp>Creators could be grateful to adults who put their app into use and give feedback.\u003c/p>\n"},{"kind":"prose","text":"Creators could be grateful to adults who put their app into use and give feedback.","line":155,"renderedHtml":""},{"kind":"prose","text":"","line":156,"renderedHtml":""},{"kind":"block","blockType":"motivation","attributes":{"id":"m-creators-adopters-gratitude","from":"e-creators","to":"e-adopters","gives":"Gratitude for putting the app into use","status":"potential","kind":"reputation"},"startLine":158,"endLine":165,"inPdt42Fence":true},{"kind":"prose","text":"","line":167,"renderedHtml":""},{"kind":"heading","level":3,"text":"Gratitude for using the app","line":168},{"kind":"prose","text":"","line":169,"renderedHtml":"\u003cp>Creators could be grateful to students who use their app and come back to it.\u003c/p>\n"},{"kind":"prose","text":"Creators could be grateful to students who use their app and come back to it.","line":170,"renderedHtml":""},{"kind":"prose","text":"","line":171,"renderedHtml":""},{"kind":"block","blockType":"motivation","attributes":{"id":"m-creators-students-gratitude","from":"e-creators","to":"e-students","gives":"Gratitude for using the app","status":"potential","kind":"reputation"},"startLine":173,"endLine":180,"inPdt42Fence":true},{"kind":"prose","text":"","line":182,"renderedHtml":""},{"kind":"heading","level":3,"text":"Gratitude for working on their own","line":183},{"kind":"prose","text":"","line":184,"renderedHtml":"\u003cp>Teachers and parents could be grateful to students who work on their own with an app.\u003c/p>\n"},{"kind":"prose","text":"Teachers and parents could be grateful to students who work on their own with an app.","line":185,"renderedHtml":""},{"kind":"prose","text":"","line":186,"renderedHtml":""},{"kind":"block","blockType":"motivation","attributes":{"id":"m-adopters-students-gratitude","from":"e-adopters","to":"e-students","gives":"Gratitude for working on their own","status":"potential","kind":"reputation"},"startLine":188,"endLine":195,"inPdt42Fence":true},{"kind":"prose","text":"","line":197,"renderedHtml":""},{"kind":"heading","level":2,"text":"Access to the app by link, QR code or projector","line":198},{"kind":"prose","text":"","line":199,"renderedHtml":"\u003cp>Students usually get to know an app through an adult, who uses every available channel.\u003c/p>\n"},{"kind":"prose","text":"Students usually get to know an app through an adult, who uses every available channel.","line":200,"renderedHtml":""},{"kind":"prose","text":"","line":201,"renderedHtml":""},{"kind":"block","blockType":"motivation","attributes":{"id":"m-adopters-students","from":"e-adopters","to":"e-students","gives":"Access to the app by link, QR code or projector","status":"current","kind":"access"},"startLine":203,"endLine":210,"inPdt42Fence":true},{"kind":"prose","text":"","line":212,"renderedHtml":""},{"kind":"heading","level":2,"text":"Free time while they work on their own","line":213},{"kind":"prose","text":"","line":214,"renderedHtml":"\u003cp>While students work with an app on their own, teachers gain free time, for individual support or preparation.\u003c/p>\n"},{"kind":"prose","text":"While students work with an app on their own, teachers gain free time, for individual support or preparation.","line":215,"renderedHtml":""},{"kind":"prose","text":"","line":216,"renderedHtml":""},{"kind":"block","blockType":"motivation","attributes":{"id":"m-students-adopters","from":"e-students","to":"e-adopters","gives":"Free time while they work on their own","status":"current","kind":"other"},"startLine":218,"endLine":225,"inPdt42Fence":true},{"kind":"prose","text":"","line":227,"renderedHtml":""},{"kind":"heading","level":2,"text":"They build the app","line":228},{"kind":"prose","text":"","line":229,"renderedHtml":"\u003cp>Creators build their apps with AI assistants.\u003c/p>\n"},{"kind":"prose","text":"Creators build their apps with AI assistants.","line":230,"renderedHtml":""},{"kind":"prose","text":"","line":231,"renderedHtml":""},{"kind":"block","blockType":"motivation","attributes":{"id":"m-ai-creators","from":"e-ai-assistants","to":"e-creators","gives":"They build the app","status":"current","kind":"services"},"startLine":233,"endLine":240,"inPdt42Fence":true},{"kind":"prose","text":"","line":242,"renderedHtml":""},{"kind":"heading","level":2,"text":"An offering of teaching materials","line":243},{"kind":"prose","text":"","line":244,"renderedHtml":"\u003cp>Teacher platforms are one place where adults find digital teaching offerings.\u003c/p>\n"},{"kind":"prose","text":"Teacher platforms are one place where adults find digital teaching offerings.","line":245,"renderedHtml":""},{"kind":"prose","text":"","line":246,"renderedHtml":""},{"kind":"block","blockType":"motivation","attributes":{"id":"m-platforms-adopters","from":"e-teacher-platforms","to":"e-adopters","gives":"An offering of teaching materials","status":"current","kind":"services"},"startLine":248,"endLine":255,"inPdt42Fence":true},{"kind":"prose","text":"","line":257,"renderedHtml":""},{"kind":"heading","level":2,"text":"Money for commercial platforms","line":258},{"kind":"prose","text":"","line":259,"renderedHtml":"\u003cp>Adults pay commercial teacher platforms. This is the only flow of money in the matrix.\u003c/p>\n"},{"kind":"prose","text":"Adults pay commercial teacher platforms. This is the only flow of money in the matrix.","line":260,"renderedHtml":""},{"kind":"prose","text":"","line":261,"renderedHtml":""},{"kind":"block","blockType":"motivation","attributes":{"id":"m-adopters-platforms","from":"e-adopters","to":"e-teacher-platforms","gives":"Money for commercial platforms","status":"current","kind":"money"},"startLine":263,"endLine":270,"inPdt42Fence":true},{"kind":"prose","text":"","line":272,"renderedHtml":""},{"kind":"heading","level":2,"text":"Reach among teachers","line":273},{"kind":"prose","text":"","line":274,"renderedHtml":"\u003cp>If teacher platforms show contributed apps (scenario E12), they give creators reach among teachers. As free apps compete with commercial offerings, this is likely only from non-profit platforms.\u003c/p>\n"},{"kind":"prose","text":"If teacher platforms show contributed apps (scenario E12), they give creators reach among teachers. As free apps compete with commercial offerings, this is likely only from non-profit platforms.","line":275,"renderedHtml":""},{"kind":"prose","text":"","line":276,"renderedHtml":""},{"kind":"block","blockType":"motivation","attributes":{"id":"m-platforms-creators","from":"e-teacher-platforms","to":"e-creators","gives":"Reach among teachers (likely only from non-profits)","status":"potential","kind":"attention"},"startLine":278,"endLine":285,"inPdt42Fence":true},{"kind":"prose","text":"","line":287,"renderedHtml":""},{"kind":"heading","level":2,"text":"Offerings they don't have to produce themselves","line":288},{"kind":"prose","text":"","line":289,"renderedHtml":"\u003cp>In return, creators give teacher platforms offerings without producing them themselves. The gain is small: for commercial platforms, free apps are rather unwelcome competition, so probably only non-profit platforms appreciate them.\u003c/p>\n"},{"kind":"prose","text":"In return, creators give teacher platforms offerings without producing them themselves. The gain is small: for commercial platforms, free apps are rather unwelcome competition, so probably only non-profit platforms appreciate them.","line":290,"renderedHtml":""},{"kind":"prose","text":"","line":291,"renderedHtml":""},{"kind":"block","blockType":"motivation","attributes":{"id":"m-creators-platforms","from":"e-creators","to":"e-teacher-platforms","gives":"Offerings they don't have to produce themselves (mainly welcome to non-profits)","status":"potential","kind":"goods"},"startLine":293,"endLine":300,"inPdt42Fence":true},{"kind":"prose","text":"","line":302,"renderedHtml":""},{"kind":"heading","level":2,"text":"Reach through recommendations","line":303},{"kind":"prose","text":"","line":304,"renderedHtml":"\u003cp>Apps travel by recommendation on social media.\u003c/p>\n"},{"kind":"prose","text":"Apps travel by recommendation on social media.","line":305,"renderedHtml":""},{"kind":"prose","text":"","line":306,"renderedHtml":""},{"kind":"block","blockType":"motivation","attributes":{"id":"m-media-creators","from":"e-social-media","to":"e-creators","gives":"Reach through recommendations","status":"current","kind":"attention"},"startLine":308,"endLine":315,"inPdt42Fence":true},{"kind":"prose","text":"","line":317,"renderedHtml":""},{"kind":"heading","level":2,"text":"Content that gets shared","line":318},{"kind":"prose","text":"","line":319,"renderedHtml":"\u003cp>Creators share their apps on social media.\u003c/p>\n"},{"kind":"prose","text":"Creators share their apps on social media.","line":320,"renderedHtml":""},{"kind":"prose","text":"","line":321,"renderedHtml":""},{"kind":"block","blockType":"motivation","attributes":{"id":"m-creators-media","from":"e-creators","to":"e-social-media","gives":"Content that gets shared","status":"current","kind":"attention"},"startLine":323,"endLine":330,"inPdt42Fence":true},{"kind":"prose","text":"","line":332,"renderedHtml":""},{"kind":"heading","level":2,"text":"Apps to build on instead of starting from scratch","line":333},{"kind":"prose","text":"","line":334,"renderedHtml":"\u003cp>Creators could build on each other&#39;s apps instead of starting from scratch (D2).\u003c/p>\n"},{"kind":"prose","text":"Creators could build on each other's apps instead of starting from scratch (D2).","line":335,"renderedHtml":""},{"kind":"prose","text":"","line":336,"renderedHtml":""},{"kind":"block","blockType":"motivation","attributes":{"id":"m-creators-creators","from":"e-creators","to":"e-creators","gives":"Apps to build on instead of starting from scratch","status":"potential","kind":"knowledge"},"startLine":338,"endLine":345,"inPdt42Fence":true},{"kind":"prose","text":"","line":347,"renderedHtml":""},{"kind":"heading","level":2,"text":"Recommendations to colleagues","line":348},{"kind":"prose","text":"","line":349,"renderedHtml":"\u003cp>Adults could recommend apps to colleagues; an assumption still to be validated.\u003c/p>\n"},{"kind":"prose","text":"Adults could recommend apps to colleagues; an assumption still to be validated.","line":350,"renderedHtml":""},{"kind":"prose","text":"","line":351,"renderedHtml":""},{"kind":"block","blockType":"motivation","attributes":{"id":"m-adopters-adopters","from":"e-adopters","to":"e-adopters","gives":"Recommendations to colleagues","status":"potential","kind":"attention"},"startLine":353,"endLine":360,"inPdt42Fence":true},{"kind":"prose","text":"","line":362,"renderedHtml":""},{"kind":"heading","level":2,"text":"Recommendations to classmates","line":363},{"kind":"prose","text":"","line":364,"renderedHtml":"\u003cp>Students could recommend apps to classmates; an assumption still to be validated.\u003c/p>\n"},{"kind":"prose","text":"Students could recommend apps to classmates; an assumption still to be validated.","line":365,"renderedHtml":""},{"kind":"prose","text":"","line":366,"renderedHtml":""},{"kind":"block","blockType":"motivation","attributes":{"id":"m-students-students","from":"e-students","to":"e-students","gives":"Recommendations to classmates","status":"potential","kind":"attention"},"startLine":368,"endLine":375,"inPdt42Fence":true},{"kind":"prose","text":"","line":377,"renderedHtml":""}]},{"filePath":"2-design/d4-relationships.pdt42.md","title":"Choose the core relationships","steps":["D4"],"nodes":[{"kind":"heading","level":1,"text":"Choose the core relationships","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":"\u003cp>\u003cem>The core system of this iteration is the triangle of the three core roles: app creators, adopting adults and students. Most value flows between creators and adults and between adults and students (D3). The core entity is the adopting adults: without them, no app reaches a classroom and no attention reaches a creator.\u003c/em>\u003c/p>\n\u003cp>Creators are not the core entity because they build software without the platform anyway, as personal software for their own class or child. That others use their app too is a nice-to-have for them. Adults, in contrast, depend on finding apps they can use without doubt; this is where the platform makes the difference.\u003c/p>\n\u003cp>\u003cstrong>Insight: supply does not come by itself.\u003c/strong> If use by others is only a nice-to-have for creators, their motivation to bring their apps onto the platform is weak. At the same time, most engaged creators are receptive to praise and use: once their apps are used, the flow of reputation motivates them strongly. So reach is no reason to start, but a strong reason to stay. PP2 stays right (attention is scarce and has to reach creators and their apps, E6). The platform therefore has to make listing an app almost effortless, or offer creators a benefit that does not depend on reach, such as better guidance when building; and once an app is used, it has to make that use and the praise for it visible to its creator (D3: feedback, recognition, gratitude). This shapes the learning engine (D6), the liquidity plan (G4), and is a riskiest assumption to test with the MVP (D8).\u003c/p>\n\u003cp>The brief (E7) named creators and adults as the core relationship and students as an ancillary role. The triangle widens this: students also look for apps on their own and return to them, and gratitude flows between all three roles. Every role in the triangle has a portrait (D2).\u003c/p>\n"},{"kind":"prose","text":"*The core system of this iteration is the triangle of the three core roles: app creators, adopting adults and students. Most value flows between creators and adults and between adults and students (D3). The core entity is the adopting adults: without them, no app reaches a classroom and no attention reaches a creator.*","line":3,"renderedHtml":""},{"kind":"prose","text":"","line":4,"renderedHtml":""},{"kind":"prose","text":"Creators are not the core entity because they build software without the platform anyway, as personal software for their own class or child. That others use their app too is a nice-to-have for them. Adults, in contrast, depend on finding apps they can use without doubt; this is where the platform makes the difference.","line":5,"renderedHtml":""},{"kind":"prose","text":"","line":6,"renderedHtml":""},{"kind":"prose","text":"**Insight: supply does not come by itself.** If use by others is only a nice-to-have for creators, their motivation to bring their apps onto the platform is weak. At the same time, most engaged creators are receptive to praise and use: once their apps are used, the flow of reputation motivates them strongly. So reach is no reason to start, but a strong reason to stay. PP2 stays right (attention is scarce and has to reach creators and their apps, E6). The platform therefore has to make listing an app almost effortless, or offer creators a benefit that does not depend on reach, such as better guidance when building; and once an app is used, it has to make that use and the praise for it visible to its creator (D3: feedback, recognition, gratitude). This shapes the learning engine (D6), the liquidity plan (G4), and is a riskiest assumption to test with the MVP (D8).","line":7,"renderedHtml":""},{"kind":"prose","text":"","line":8,"renderedHtml":""},{"kind":"prose","text":"The brief (E7) named creators and adults as the core relationship and students as an ancillary role. The triangle widens this: students also look for apps on their own and return to them, and gratitude flows between all three roles. Every role in the triangle has a portrait (D2).","line":9,"renderedHtml":""},{"kind":"prose","text":"","line":10,"renderedHtml":""},{"kind":"heading","level":2,"text":"Creators and adults","line":11},{"kind":"prose","text":"","line":12,"renderedHtml":"\u003cp>The relationship the brief started from. Creators give adults apps; adults give creators attention and could give feedback, recognition and gratitude. These last three are all potential today, and they are what creators lack.\u003c/p>\n"},{"kind":"prose","text":"The relationship the brief started from. Creators give adults apps; adults give creators attention and could give feedback, recognition and gratitude. These last three are all potential today, and they are what creators lack.","line":13,"renderedHtml":""},{"kind":"prose","text":"","line":14,"renderedHtml":""},{"kind":"block","blockType":"relationship","attributes":{"id":"r-creators-adults","title":"Creators and adults","between":"e-creators, e-adopters","core":"yes"},"startLine":16,"endLine":21,"inPdt42Fence":true},{"kind":"prose","text":"","line":23,"renderedHtml":""},{"kind":"heading","level":2,"text":"Adults and students","line":24},{"kind":"prose","text":"","line":25,"renderedHtml":"\u003cp>Adults bring apps to students by link, QR code or projector; students give teachers free time by working on their own. This is how most students get to know an app.\u003c/p>\n"},{"kind":"prose","text":"Adults bring apps to students by link, QR code or projector; students give teachers free time by working on their own. This is how most students get to know an app.","line":26,"renderedHtml":""},{"kind":"prose","text":"","line":27,"renderedHtml":""},{"kind":"block","blockType":"relationship","attributes":{"id":"r-adults-students","title":"Adults and students","between":"e-adopters, e-students","core":"yes"},"startLine":29,"endLine":34,"inPdt42Fence":true},{"kind":"prose","text":"","line":36,"renderedHtml":""},{"kind":"heading","level":2,"text":"Creators and students","line":37},{"kind":"prose","text":"","line":38,"renderedHtml":"\u003cp>The apps are built for students, and students return to them on their own. Gratitude could flow in both directions.\u003c/p>\n"},{"kind":"prose","text":"The apps are built for students, and students return to them on their own. Gratitude could flow in both directions.","line":39,"renderedHtml":""},{"kind":"prose","text":"","line":40,"renderedHtml":""},{"kind":"block","blockType":"relationship","attributes":{"id":"r-creators-students","title":"Creators and students","between":"e-creators, e-students","core":"yes"},"startLine":42,"endLine":47,"inPdt42Fence":true},{"kind":"prose","text":"","line":49,"renderedHtml":""}]},{"filePath":"2-design/d5-transactions.pdt42.md","title":"Identify the elementary transactions and channels","steps":["D5"],"nodes":[{"kind":"heading","level":1,"text":"Identify the elementary transactions and channels","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":"\u003cp>\u003cem>One Transactions Board per core relationship (D4). Each transaction is a repeatable action with a specific value unit; \u003ccode>happening: yes\u003c/code> marks what already occurs today, without lernapps.net. The channels are what the platform would build to lower the cost of each transaction.\u003c/em>\u003c/p>\n\u003cp>Three transactions have no platform channel on purpose: learning with an app and working on it happen inside the app itself, and students thank adults directly in class. The platform does not need to stand between them.\u003c/p>\n"},{"kind":"prose","text":"*One Transactions Board per core relationship (D4). Each transaction is a repeatable action with a specific value unit; `happening: yes` marks what already occurs today, without lernapps.net. The channels are what the platform would build to lower the cost of each transaction.*","line":3,"renderedHtml":""},{"kind":"prose","text":"","line":4,"renderedHtml":""},{"kind":"prose","text":"Three transactions have no platform channel on purpose: learning with an app and working on it happen inside the app itself, and students thank adults directly in class. The platform does not need to stand between them.","line":5,"renderedHtml":""},{"kind":"prose","text":"","line":6,"renderedHtml":""},{"kind":"heading","level":2,"text":"Transactions Board: Creators and adults","line":7},{"kind":"prose","text":"","line":8,"renderedHtml":""},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-board-creators-adults","canvas":"transactions-board","of":"r-creators-adults"},"startLine":10,"endLine":14,"inPdt42Fence":true},{"kind":"prose","text":"","line":16,"renderedHtml":""},{"kind":"heading","level":3,"text":"List an app","line":17},{"kind":"prose","text":"","line":18,"renderedHtml":"\u003cp>A creator makes an app available to others. It happens today, but on each creator&#39;s own website, GitHub or social media, and in no comparable form.\u003c/p>\n"},{"kind":"prose","text":"A creator makes an app available to others. It happens today, but on each creator's own website, GitHub or social media, and in no comparable form.","line":19,"renderedHtml":""},{"kind":"prose","text":"","line":20,"renderedHtml":""},{"kind":"block","blockType":"transaction","attributes":{"id":"t-list-app","title":"List an app","relationship":"r-creators-adults","from":"e-creators","to":"e-adopters","direction":"one-way","value-unit":"An app listing: what it teaches, for whom, a link","happening":"yes","channel":"ch-listing","kind":"goods","motivation":"m-creators-adopters","job":"j-make-available"},"startLine":22,"endLine":35,"inPdt42Fence":true},{"kind":"prose","text":"","line":37,"renderedHtml":""},{"kind":"heading","level":3,"text":"Find an app for a topic and grade","line":38},{"kind":"prose","text":"","line":39,"renderedHtml":"\u003cp>An adult finds an app that fits their class. Today this depends on word of mouth, teacher platforms or luck.\u003c/p>\n"},{"kind":"prose","text":"An adult finds an app that fits their class. Today this depends on word of mouth, teacher platforms or luck.","line":40,"renderedHtml":""},{"kind":"prose","text":"","line":41,"renderedHtml":""},{"kind":"block","blockType":"transaction","attributes":{"id":"t-find-app","title":"Find an app for a topic and grade","relationship":"r-creators-adults","from":"e-creators","to":"e-adopters","direction":"one-way","value-unit":"A matching app for one topic and one grade","happening":"yes","channel":"ch-app-overview","kind":"goods","motivation":"m-creators-adopters","job":"j-find-reuse"},"startLine":43,"endLine":56,"inPdt42Fence":true},{"kind":"prose","text":"","line":58,"renderedHtml":""},{"kind":"heading","level":3,"text":"Confirm an app may be used","line":59},{"kind":"prose","text":"","line":60,"renderedHtml":"\u003cp>An adult checks whether an app may be used in class. Today each teacher judges alone or asks a gatekeeper.\u003c/p>\n"},{"kind":"prose","text":"An adult checks whether an app may be used in class. Today each teacher judges alone or asks a gatekeeper.","line":61,"renderedHtml":""},{"kind":"prose","text":"","line":62,"renderedHtml":""},{"kind":"block","blockType":"transaction","attributes":{"id":"t-confirm-fitness","title":"Confirm an app may be used","relationship":"r-creators-adults","from":"e-creators","to":"e-adopters","direction":"one-way","value-unit":"A signal of fitness for use: frontend-only, no installation, no sign-up","happening":"no","channel":"ch-fitness-signal","kind":"knowledge","job":"j-confirm-use"},"startLine":64,"endLine":76,"inPdt42Fence":true},{"kind":"prose","text":"","line":78,"renderedHtml":""},{"kind":"heading","level":3,"text":"Use an app in class","line":79},{"kind":"prose","text":"","line":80,"renderedHtml":"\u003cp>An adult puts the app into use. This is the attention creators get today, but it stays invisible to them.\u003c/p>\n"},{"kind":"prose","text":"An adult puts the app into use. This is the attention creators get today, but it stays invisible to them.","line":81,"renderedHtml":""},{"kind":"prose","text":"","line":82,"renderedHtml":""},{"kind":"block","blockType":"transaction","attributes":{"id":"t-use-in-class","title":"Use an app in class","relationship":"r-creators-adults","from":"e-adopters","to":"e-creators","direction":"one-way","value-unit":"One use of the app in a class","happening":"yes","channel":"ch-feedback","kind":"attention","motivation":"m-adopters-creators-attention"},"startLine":84,"endLine":96,"inPdt42Fence":true},{"kind":"prose","text":"","line":98,"renderedHtml":""},{"kind":"heading","level":3,"text":"Give feedback from classroom use","line":99},{"kind":"prose","text":"","line":100,"renderedHtml":"\u003cp>An adult tells the creator how the app worked in class. This hardly happens today.\u003c/p>\n"},{"kind":"prose","text":"An adult tells the creator how the app worked in class. This hardly happens today.","line":101,"renderedHtml":""},{"kind":"prose","text":"","line":102,"renderedHtml":""},{"kind":"block","blockType":"transaction","attributes":{"id":"t-give-feedback","title":"Give feedback from classroom use","relationship":"r-creators-adults","from":"e-adopters","to":"e-creators","direction":"one-way","value-unit":"A short feedback note from one class","happening":"no","channel":"ch-feedback","kind":"feedback","motivation":"m-adopters-creators-feedback"},"startLine":104,"endLine":116,"inPdt42Fence":true},{"kind":"prose","text":"","line":118,"renderedHtml":""},{"kind":"heading","level":3,"text":"Recommend an app","line":119},{"kind":"prose","text":"","line":120,"renderedHtml":"\u003cp>An adult recommends an app, and the recommendation is credited to its creator.\u003c/p>\n"},{"kind":"prose","text":"An adult recommends an app, and the recommendation is credited to its creator.","line":121,"renderedHtml":""},{"kind":"prose","text":"","line":122,"renderedHtml":""},{"kind":"block","blockType":"transaction","attributes":{"id":"t-recommend-app","title":"Recommend an app","relationship":"r-creators-adults","from":"e-adopters","to":"e-creators","direction":"one-way","value-unit":"A recommendation credited to the creator","happening":"no","channel":"ch-feedback","kind":"reputation","motivation":"m-adopters-creators-reputation"},"startLine":124,"endLine":136,"inPdt42Fence":true},{"kind":"prose","text":"","line":138,"renderedHtml":""},{"kind":"heading","level":3,"text":"Thank the creator","line":139},{"kind":"prose","text":"","line":140,"renderedHtml":"\u003cp>An adult thanks the creator for an app that worked in class.\u003c/p>\n"},{"kind":"prose","text":"An adult thanks the creator for an app that worked in class.","line":141,"renderedHtml":""},{"kind":"prose","text":"","line":142,"renderedHtml":""},{"kind":"block","blockType":"transaction","attributes":{"id":"t-thank-creator-adult","title":"Thank the creator","relationship":"r-creators-adults","from":"e-adopters","to":"e-creators","direction":"one-way","value-unit":"A thank-you to the creator","happening":"no","channel":"ch-feedback","kind":"reputation","motivation":"m-adopters-creators-gratitude"},"startLine":144,"endLine":156,"inPdt42Fence":true},{"kind":"prose","text":"","line":158,"renderedHtml":""},{"kind":"heading","level":2,"text":"Transactions Board: Adults and students","line":159},{"kind":"prose","text":"","line":160,"renderedHtml":""},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-board-adults-students","canvas":"transactions-board","of":"r-adults-students"},"startLine":162,"endLine":166,"inPdt42Fence":true},{"kind":"prose","text":"","line":168,"renderedHtml":""},{"kind":"heading","level":3,"text":"Bring an app to students","line":169},{"kind":"prose","text":"","line":170,"renderedHtml":"\u003cp>An adult gets an app in front of students. Today adults use every available channel: links, QR codes, the projector, school tablets.\u003c/p>\n"},{"kind":"prose","text":"An adult gets an app in front of students. Today adults use every available channel: links, QR codes, the projector, school tablets.","line":171,"renderedHtml":""},{"kind":"prose","text":"","line":172,"renderedHtml":""},{"kind":"block","blockType":"transaction","attributes":{"id":"t-bring-app","title":"Bring an app to students","relationship":"r-adults-students","from":"e-adopters","to":"e-students","direction":"one-way","value-unit":"Access to one app or a collection","happening":"yes","channel":"ch-collections","kind":"access","motivation":"m-adopters-students","job":"j-bring-to-students"},"startLine":174,"endLine":187,"inPdt42Fence":true},{"kind":"prose","text":"","line":189,"renderedHtml":""},{"kind":"heading","level":3,"text":"Work on their own with an app","line":190},{"kind":"prose","text":"","line":191,"renderedHtml":"\u003cp>Students work with the app on their own, which gives the teacher free time.\u003c/p>\n"},{"kind":"prose","text":"Students work with the app on their own, which gives the teacher free time.","line":192,"renderedHtml":""},{"kind":"prose","text":"","line":193,"renderedHtml":""},{"kind":"ignore","ruleCode":"H108","reason":"Working on an app happens in the app; no platform channel on purpose","startLine":195,"endLine":195},{"kind":"block","blockType":"transaction","attributes":{"id":"t-work-alone","title":"Work on their own with an app","relationship":"r-adults-students","from":"e-students","to":"e-adopters","direction":"one-way","value-unit":"A stretch of lesson time the teacher can use otherwise","happening":"yes","kind":"other","motivation":"m-students-adopters"},"startLine":196,"endLine":207,"inPdt42Fence":true},{"kind":"prose","text":"","line":209,"renderedHtml":""},{"kind":"heading","level":3,"text":"Thank for bringing the app","line":210},{"kind":"prose","text":"","line":211,"renderedHtml":"\u003cp>Students thank the adult who showed them an app that helped.\u003c/p>\n"},{"kind":"prose","text":"Students thank the adult who showed them an app that helped.","line":212,"renderedHtml":""},{"kind":"prose","text":"","line":213,"renderedHtml":""},{"kind":"ignore","ruleCode":"H108","reason":"Students thank adults directly in class; no platform channel on purpose","startLine":215,"endLine":215},{"kind":"block","blockType":"transaction","attributes":{"id":"t-thank-adult","title":"Thank for bringing the app","relationship":"r-adults-students","from":"e-students","to":"e-adopters","direction":"one-way","value-unit":"A thank-you to the adult","happening":"no","kind":"reputation","motivation":"m-students-adopters-gratitude"},"startLine":216,"endLine":227,"inPdt42Fence":true},{"kind":"prose","text":"","line":229,"renderedHtml":""},{"kind":"heading","level":2,"text":"Transactions Board: Creators and students","line":230},{"kind":"prose","text":"","line":231,"renderedHtml":""},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-board-creators-students","canvas":"transactions-board","of":"r-creators-students"},"startLine":233,"endLine":237,"inPdt42Fence":true},{"kind":"prose","text":"","line":239,"renderedHtml":""},{"kind":"heading","level":3,"text":"Learn with an app","line":240},{"kind":"prose","text":"","line":241,"renderedHtml":"\u003cp>Students use the app to understand the subject.\u003c/p>\n"},{"kind":"prose","text":"Students use the app to understand the subject.","line":242,"renderedHtml":""},{"kind":"prose","text":"","line":243,"renderedHtml":""},{"kind":"ignore","ruleCode":"H108","reason":"Learning with an app happens in the app; no platform channel on purpose","startLine":245,"endLine":245},{"kind":"block","blockType":"transaction","attributes":{"id":"t-learn-with-app","title":"Learn with an app","relationship":"r-creators-students","from":"e-creators","to":"e-students","direction":"one-way","value-unit":"A learning session on one topic","happening":"yes","kind":"goods","motivation":"m-creators-students"},"startLine":246,"endLine":257,"inPdt42Fence":true},{"kind":"prose","text":"","line":259,"renderedHtml":""},{"kind":"heading","level":3,"text":"Return to an app","line":260},{"kind":"prose","text":"","line":261,"renderedHtml":"\u003cp>Students come back to an app on their own, for instance before the next test.\u003c/p>\n"},{"kind":"prose","text":"Students come back to an app on their own, for instance before the next test.","line":262,"renderedHtml":""},{"kind":"prose","text":"","line":263,"renderedHtml":""},{"kind":"block","blockType":"transaction","attributes":{"id":"t-return-to-app","title":"Return to an app","relationship":"r-creators-students","from":"e-students","to":"e-creators","direction":"one-way","value-unit":"A return visit before a test","happening":"yes","channel":"ch-app-overview","kind":"attention","motivation":"m-students-creators","job":"j-students-find"},"startLine":265,"endLine":278,"inPdt42Fence":true},{"kind":"prose","text":"","line":280,"renderedHtml":""},{"kind":"heading","level":3,"text":"Thank the creator","line":281},{"kind":"prose","text":"","line":282,"renderedHtml":"\u003cp>Students thank the creator for an app that helped them.\u003c/p>\n"},{"kind":"prose","text":"Students thank the creator for an app that helped them.","line":283,"renderedHtml":""},{"kind":"prose","text":"","line":284,"renderedHtml":""},{"kind":"block","blockType":"transaction","attributes":{"id":"t-thank-creator-student","title":"Thank the creator","relationship":"r-creators-students","from":"e-students","to":"e-creators","direction":"one-way","value-unit":"A thank-you to the creator","happening":"no","channel":"ch-feedback","kind":"reputation","motivation":"m-students-creators-gratitude"},"startLine":286,"endLine":298,"inPdt42Fence":true},{"kind":"prose","text":"","line":300,"renderedHtml":""},{"kind":"heading","level":2,"text":"Channels","line":301},{"kind":"prose","text":"","line":302,"renderedHtml":"\u003cp>The channels the platform would need, described by what they make easier, not by how they are built; the means are decided later (D8). Several transactions share one channel. None of them needs accounts for students.\u003c/p>\n"},{"kind":"prose","text":"The channels the platform would need, described by what they make easier, not by how they are built; the means are decided later (D8). Several transactions share one channel. None of them needs accounts for students.","line":303,"renderedHtml":""},{"kind":"prose","text":"","line":304,"renderedHtml":""},{"kind":"heading","level":3,"text":"Effortless listing","line":305},{"kind":"prose","text":"","line":306,"renderedHtml":"\u003cp>Creators describe their app in a few fields and the platform turns it into a listing. The first contribution has to cost almost nothing, because reach is only a nice-to-have for creators (D4).\u003c/p>\n"},{"kind":"prose","text":"Creators describe their app in a few fields and the platform turns it into a listing. The first contribution has to cost almost nothing, because reach is only a nice-to-have for creators (D4).","line":307,"renderedHtml":""},{"kind":"prose","text":"","line":308,"renderedHtml":""},{"kind":"block","blockType":"channel","attributes":{"id":"ch-listing","title":"Effortless listing","medium":"digital","components":"","improvement":"Contributing an app takes minutes, without an own website or post"},"lists":{"components":["A few fields: what the app teaches, for whom, where to find it","Automatic check and publication","Help from the creator's AI assistant"]},"startLine":310,"endLine":319,"inPdt42Fence":true},{"kind":"prose","text":"","line":321,"renderedHtml":""},{"kind":"heading","level":3,"text":"One place to find apps","line":322},{"kind":"prose","text":"","line":323,"renderedHtml":"\u003cp>Adults and students find apps in one place instead of by word of mouth. Referral links let people recommend the platform; who follows one takes an explicit first step (&quot;I&#39;ll have a look&quot;), which is counted openly per referral wave, never per person.\u003c/p>\n"},{"kind":"prose","text":"Adults and students find apps in one place instead of by word of mouth. Referral links let people recommend the platform; who follows one takes an explicit first step (\"I'll have a look\"), which is counted openly per referral wave, never per person.","line":324,"renderedHtml":""},{"kind":"prose","text":"","line":325,"renderedHtml":""},{"kind":"block","blockType":"channel","attributes":{"id":"ch-app-overview","title":"One place to find apps","medium":"digital","components":"","improvement":"Finding an app no longer depends on word of mouth or luck"},"lists":{"components":["Listings in one comparable format","Finding by topic and grade","Tailored to the visitor without accounts","Entry through referral links, with an explicit first step to have a look"]},"startLine":327,"endLine":337,"inPdt42Fence":true},{"kind":"prose","text":"","line":339,"renderedHtml":""},{"kind":"heading","level":3,"text":"Visible fitness for use","line":340},{"kind":"prose","text":"","line":341,"renderedHtml":"\u003cp>Every listing answers the question adults ask before using an app. Having no server is not enough for that: what an app sends to third parties is checked, not taken from what its entry declares (lernapps/docs#11).\u003c/p>\n"},{"kind":"prose","text":"Every listing answers the question adults ask before using an app. Having no server is not enough for that: what an app sends to third parties is checked, not taken from what its entry declares (lernapps/docs#11).","line":342,"renderedHtml":""},{"kind":"prose","text":"","line":343,"renderedHtml":""},{"kind":"block","blockType":"channel","attributes":{"id":"ch-fitness-signal","title":"Visible fitness for use","medium":"digital","components":"","improvement":"Adults no longer judge fitness for use alone or wait for a gatekeeper"},"lists":{"components":["Whether the app sends anything to third parties, checked rather than declared","Whether installation or sign-up is needed"]},"startLine":345,"endLine":353,"inPdt42Fence":true},{"kind":"prose","text":"","line":355,"renderedHtml":""},{"kind":"heading","level":3,"text":"Passing apps on to a class","line":356},{"kind":"prose","text":"","line":357,"renderedHtml":"\u003cp>Adults bring one app or several to their class in one step.\u003c/p>\n"},{"kind":"prose","text":"Adults bring one app or several to their class in one step.","line":358,"renderedHtml":""},{"kind":"prose","text":"","line":359,"renderedHtml":""},{"kind":"block","blockType":"channel","attributes":{"id":"ch-collections","title":"Passing apps on to a class","medium":"digital","components":"","improvement":"Several apps reach a class in one step"},"lists":{"components":["Several apps bundled for one class","Works on the devices a class already uses","No accounts for students"]},"startLine":361,"endLine":370,"inPdt42Fence":true},{"kind":"prose","text":"","line":372,"renderedHtml":""},{"kind":"heading","level":3,"text":"Returning use and praise to creators","line":373},{"kind":"prose","text":"","line":374,"renderedHtml":"\u003cp>Makes use, feedback, recommendations and thanks visible to the creator, so the reputation flow keeps them (D4). Thanks is the currency of the free platform: every user should understand that a thank-you is how they keep it alive, without the platform being pushy about it.\u003c/p>\n\u003cp>There is no hidden data collection. Single interactions are counted openly, to learn whether valuable use happens: only explicit clicks, only totals, no cookies or browser storage, no personal data kept, and explained right where the click happens. Thanks and feedback are anonymous and structured (no free text), and they never identify a student. The apps themselves collect nothing. Creators can include the same thanks in their app; where it cannot be reached, it quietly steps aside.\u003c/p>\n"},{"kind":"prose","text":"Makes use, feedback, recommendations and thanks visible to the creator, so the reputation flow keeps them (D4). Thanks is the currency of the free platform: every user should understand that a thank-you is how they keep it alive, without the platform being pushy about it.","line":375,"renderedHtml":""},{"kind":"prose","text":"","line":376,"renderedHtml":""},{"kind":"prose","text":"There is no hidden data collection. Single interactions are counted openly, to learn whether valuable use happens: only explicit clicks, only totals, no cookies or browser storage, no personal data kept, and explained right where the click happens. Thanks and feedback are anonymous and structured (no free text), and they never identify a student. The apps themselves collect nothing. Creators can include the same thanks in their app; where it cannot be reached, it quietly steps aside.","line":377,"renderedHtml":""},{"kind":"prose","text":"","line":378,"renderedHtml":""},{"kind":"block","blockType":"channel","attributes":{"id":"ch-feedback","title":"Returning use and praise to creators","medium":"digital","components":"","improvement":"Use and praise reach the creator instead of staying invisible, and every user knows that thanking keeps the free platform alive"},"lists":{"components":["Thanks and structured feedback with one click, after use","Optionally inside the app, if its creator includes it","Counted openly: only explicit clicks and totals, no accounts or free text","Steps aside quietly when it cannot be reached"]},"startLine":380,"endLine":390,"inPdt42Fence":true},{"kind":"prose","text":"","line":392,"renderedHtml":""}]},{"filePath":"2-design/d6-learning-engine.pdt42.md","title":"Design the learning engine","steps":["D6"],"nodes":[{"kind":"heading","level":1,"text":"Design the learning engine","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":""},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-learning-engine","canvas":"learning-engine"},"startLine":4,"endLine":7,"inPdt42Fence":true},{"kind":"prose","text":"","line":9,"renderedHtml":"\u003cp>\u003cem>One row per core role (D4): how it arrives, and the key challenges when onboarding, getting better and catching a new opportunity. The services answer these challenges; like the channels (D5), they say what the platform offers, not how it is built.\u003c/em>\u003c/p>\n\u003cp>The engine has to solve the supply insight from D4: creators start for themselves, so the first listing must cost almost nothing, and once their app is used, use and praise must reach them. It also opens paths from the consumption to the production side: adults and students who use apps can start adapting and building their own, with the same guidance.\u003c/p>\n"},{"kind":"prose","text":"*One row per core role (D4): how it arrives, and the key challenges when onboarding, getting better and catching a new opportunity. The services answer these challenges; like the channels (D5), they say what the platform offers, not how it is built.*","line":10,"renderedHtml":""},{"kind":"prose","text":"","line":11,"renderedHtml":""},{"kind":"prose","text":"The engine has to solve the supply insight from D4: creators start for themselves, so the first listing must cost almost nothing, and once their app is used, use and praise must reach them. It also opens paths from the consumption to the production side: adults and students who use apps can start adapting and building their own, with the same guidance.","line":12,"renderedHtml":""},{"kind":"prose","text":"","line":13,"renderedHtml":""},{"kind":"heading","level":2,"text":"Learning engine","line":14},{"kind":"prose","text":"","line":15,"renderedHtml":""},{"kind":"heading","level":3,"text":"App creators","line":16},{"kind":"prose","text":"","line":17,"renderedHtml":"\u003cp>Creators arrive with an app they built for their own class or child. Their hurdle is the first listing; after that, what keeps them is learning that and how their app is used. Experienced creators may want to bring their own best practices into the guidance, and so grow into co-owners of the platform.\u003c/p>\n"},{"kind":"prose","text":"Creators arrive with an app they built for their own class or child. Their hurdle is the first listing; after that, what keeps them is learning that and how their app is used. Experienced creators may want to bring their own best practices into the guidance, and so grow into co-owners of the platform.","line":18,"renderedHtml":""},{"kind":"prose","text":"","line":19,"renderedHtml":""},{"kind":"block","blockType":"learning-engine","attributes":{"id":"le-creators","entity":"e-creators","entry":"","onboarding":"","getting-better":"","new-opportunity":"","evolves-to":"e-platform-owner"},"lists":{"entry":["An app built for their own class or child","Guidance for building apps with their AI assistant"],"onboarding":["List the first app with almost no effort"],"getting-better":["Learn whether and how the app is used","Improve the app with feedback from classes"],"new-opportunity":["Let others build on the app and build on theirs","Bring their own best practices into the guidance and co-own the platform"]},"startLine":21,"endLine":36,"inPdt42Fence":true},{"kind":"prose","text":"","line":38,"renderedHtml":""},{"kind":"heading","level":3,"text":"Adopting adults","line":39},{"kind":"prose","text":"","line":40,"renderedHtml":"\u003cp>Adults arrive looking for an app for one topic and grade, or through a colleague&#39;s recommendation. Once they trust the platform, they can pass apps on, give back, and eventually adapt apps themselves.\u003c/p>\n"},{"kind":"prose","text":"Adults arrive looking for an app for one topic and grade, or through a colleague's recommendation. Once they trust the platform, they can pass apps on, give back, and eventually adapt apps themselves.","line":41,"renderedHtml":""},{"kind":"prose","text":"","line":42,"renderedHtml":""},{"kind":"block","blockType":"learning-engine","attributes":{"id":"le-adults","entity":"e-adopters","entry":"","onboarding":"","getting-better":"","new-opportunity":"","evolves-to":"e-creators"},"lists":{"entry":["Looking for an app for one topic and grade","A recommendation from a colleague"],"onboarding":["Find a fitting app and trust that it may be used"],"getting-better":["Assemble apps for their class","Give feedback, recommendations and thanks"],"new-opportunity":["Adapt an app or build their own"]},"startLine":44,"endLine":58,"inPdt42Fence":true},{"kind":"prose","text":"","line":60,"renderedHtml":""},{"kind":"heading","level":3,"text":"Students","line":61},{"kind":"prose","text":"","line":62,"renderedHtml":"\u003cp>Students arrive through an adult. They get better at using apps on their own, for instance before a test. Some can become creators themselves, building an app for a topic they struggled with.\u003c/p>\n"},{"kind":"prose","text":"Students arrive through an adult. They get better at using apps on their own, for instance before a test. Some can become creators themselves, building an app for a topic they struggled with.","line":63,"renderedHtml":""},{"kind":"prose","text":"","line":64,"renderedHtml":""},{"kind":"block","blockType":"learning-engine","attributes":{"id":"le-students","entity":"e-students","entry":"","onboarding":"","getting-better":"","new-opportunity":"","evolves-to":"e-creators"},"lists":{"entry":["An adult shows them an app"],"onboarding":["Start an app without installation or sign-up"],"getting-better":["Return to apps and find new ones for their topic before a test","Thank the creator"],"new-opportunity":["Build their own app"]},"startLine":66,"endLine":79,"inPdt42Fence":true},{"kind":"prose","text":"","line":81,"renderedHtml":""},{"kind":"heading","level":2,"text":"Services","line":82},{"kind":"prose","text":"","line":83,"renderedHtml":""},{"kind":"heading","level":3,"text":"Guidance for building apps","line":84},{"kind":"prose","text":"","line":85,"renderedHtml":"\u003cp>Helps creators build apps with their AI assistant that are easy to use and fit the platform. It is the benefit that does not depend on reach (D4), and the same guidance lets adults start building.\u003c/p>\n"},{"kind":"prose","text":"Helps creators build apps with their AI assistant that are easy to use and fit the platform. It is the benefit that does not depend on reach (D4), and the same guidance lets adults start building.","line":86,"renderedHtml":""},{"kind":"prose","text":"","line":87,"renderedHtml":""},{"kind":"block","blockType":"service","attributes":{"id":"s-building-guidance","title":"Guidance for building apps","for":"e-creators","stage":"onboarding","kind":"empowering"},"startLine":89,"endLine":95,"inPdt42Fence":true},{"kind":"prose","text":"","line":97,"renderedHtml":""},{"kind":"heading","level":3,"text":"Help to list an app","line":98},{"kind":"prose","text":"","line":99,"renderedHtml":"\u003cp>Takes the effort out of the first listing, the hurdle for creators (D4).\u003c/p>\n"},{"kind":"prose","text":"Takes the effort out of the first listing, the hurdle for creators (D4).","line":100,"renderedHtml":""},{"kind":"prose","text":"","line":101,"renderedHtml":""},{"kind":"block","blockType":"service","attributes":{"id":"s-listing-help","title":"Help to list an app","for":"e-creators","stage":"onboarding","kind":"empowering","supports":"t-list-app","channel":"ch-listing"},"startLine":103,"endLine":111,"inPdt42Fence":true},{"kind":"prose","text":"","line":113,"renderedHtml":""},{"kind":"heading","level":3,"text":"Insight into use and feedback","line":114},{"kind":"prose","text":"","line":115,"renderedHtml":"\u003cp>Shows creators that and how their app is used, with feedback and thanks. This is the reputation flow that keeps them (D4).\u003c/p>\n"},{"kind":"prose","text":"Shows creators that and how their app is used, with feedback and thanks. This is the reputation flow that keeps them (D4).","line":116,"renderedHtml":""},{"kind":"prose","text":"","line":117,"renderedHtml":""},{"kind":"block","blockType":"service","attributes":{"id":"s-use-insight","title":"Insight into use and feedback","for":"e-creators","stage":"getting-better","kind":"empowering","supports":"t-use-in-class, t-give-feedback, t-recommend-app","channel":"ch-feedback"},"startLine":119,"endLine":127,"inPdt42Fence":true},{"kind":"prose","text":"","line":129,"renderedHtml":""},{"kind":"heading","level":3,"text":"Building on existing apps","line":130},{"kind":"prose","text":"","line":131,"renderedHtml":"\u003cp>Lets creators start from an existing app instead of from scratch, and lets others build on theirs.\u003c/p>\n"},{"kind":"prose","text":"Lets creators start from an existing app instead of from scratch, and lets others build on theirs.","line":132,"renderedHtml":""},{"kind":"prose","text":"","line":133,"renderedHtml":""},{"kind":"block","blockType":"service","attributes":{"id":"s-build-on-apps","title":"Building on existing apps","for":"e-creators","stage":"new-opportunity","kind":"empowering"},"startLine":135,"endLine":141,"inPdt42Fence":true},{"kind":"prose","text":"","line":143,"renderedHtml":""},{"kind":"heading","level":3,"text":"Contributing best practices to the guidance","line":144},{"kind":"prose","text":"","line":145,"renderedHtml":"\u003cp>Lets experienced creators bring their own best practices into the guidance for building apps. Whoever shapes the guidance shapes the platform, so this is the path from creator to co-owner.\u003c/p>\n"},{"kind":"prose","text":"Lets experienced creators bring their own best practices into the guidance for building apps. Whoever shapes the guidance shapes the platform, so this is the path from creator to co-owner.","line":146,"renderedHtml":""},{"kind":"prose","text":"","line":147,"renderedHtml":""},{"kind":"block","blockType":"service","attributes":{"id":"s-contribute-practices","title":"Contributing best practices to the guidance","for":"e-creators","stage":"new-opportunity","kind":"empowering"},"startLine":149,"endLine":155,"inPdt42Fence":true},{"kind":"prose","text":"","line":157,"renderedHtml":""},{"kind":"heading","level":3,"text":"Finding apps by topic and grade","line":158},{"kind":"prose","text":"","line":159,"renderedHtml":"\u003cp>Helps adults find a fitting app in one place.\u003c/p>\n"},{"kind":"prose","text":"Helps adults find a fitting app in one place.","line":160,"renderedHtml":""},{"kind":"prose","text":"","line":161,"renderedHtml":""},{"kind":"block","blockType":"service","attributes":{"id":"s-finding","title":"Finding apps by topic and grade","for":"e-adopters","stage":"onboarding","kind":"other","supports":"t-find-app","channel":"ch-app-overview"},"startLine":163,"endLine":171,"inPdt42Fence":true},{"kind":"prose","text":"","line":173,"renderedHtml":""},{"kind":"heading","level":3,"text":"Starting an app right away","line":174},{"kind":"prose","text":"","line":175,"renderedHtml":"\u003cp>Students open an app an adult brought to them and start right away, without installation or sign-up.\u003c/p>\n"},{"kind":"prose","text":"Students open an app an adult brought to them and start right away, without installation or sign-up.","line":176,"renderedHtml":""},{"kind":"prose","text":"","line":177,"renderedHtml":""},{"kind":"block","blockType":"service","attributes":{"id":"s-start-right-away","title":"Starting an app right away","for":"e-students","stage":"onboarding","kind":"other","supports":"t-bring-app","channel":"ch-collections"},"startLine":179,"endLine":187,"inPdt42Fence":true},{"kind":"prose","text":"","line":189,"renderedHtml":""},{"kind":"heading","level":3,"text":"Finding apps before a test","line":190},{"kind":"prose","text":"","line":191,"renderedHtml":"\u003cp>Helps students return to apps and find new ones for their topic on their own, for instance before a test.\u003c/p>\n"},{"kind":"prose","text":"Helps students return to apps and find new ones for their topic on their own, for instance before a test.","line":192,"renderedHtml":""},{"kind":"prose","text":"","line":193,"renderedHtml":""},{"kind":"block","blockType":"service","attributes":{"id":"s-student-finding","title":"Finding apps before a test","for":"e-students","stage":"getting-better","kind":"other","supports":"t-return-to-app","channel":"ch-app-overview"},"startLine":195,"endLine":203,"inPdt42Fence":true},{"kind":"prose","text":"","line":205,"renderedHtml":""},{"kind":"heading","level":3,"text":"Clarity on fitness for use","line":206},{"kind":"prose","text":"","line":207,"renderedHtml":"\u003cp>Answers whether an app may be used, before an adult brings it to class.\u003c/p>\n"},{"kind":"prose","text":"Answers whether an app may be used, before an adult brings it to class.","line":208,"renderedHtml":""},{"kind":"prose","text":"","line":209,"renderedHtml":""},{"kind":"block","blockType":"service","attributes":{"id":"s-fitness-clarity","title":"Clarity on fitness for use","for":"e-adopters","stage":"onboarding","kind":"other","supports":"t-confirm-fitness","channel":"ch-fitness-signal"},"startLine":211,"endLine":219,"inPdt42Fence":true},{"kind":"prose","text":"","line":221,"renderedHtml":""},{"kind":"heading","level":3,"text":"Assembling apps for a class","line":222},{"kind":"prose","text":"","line":223,"renderedHtml":"\u003cp>Lets adults bundle apps for one class and bring them to students in one step, so students start without installation or sign-up.\u003c/p>\n"},{"kind":"prose","text":"Lets adults bundle apps for one class and bring them to students in one step, so students start without installation or sign-up.","line":224,"renderedHtml":""},{"kind":"prose","text":"","line":225,"renderedHtml":""},{"kind":"block","blockType":"service","attributes":{"id":"s-class-sets","title":"Assembling apps for a class","for":"e-adopters","stage":"getting-better","kind":"other","supports":"t-bring-app","channel":"ch-collections"},"startLine":227,"endLine":235,"inPdt42Fence":true},{"kind":"prose","text":"","line":237,"renderedHtml":""},{"kind":"heading","level":3,"text":"Giving feedback and thanks","line":238},{"kind":"prose","text":"","line":239,"renderedHtml":"\u003cp>Makes it easy for adults and students to give feedback, recommendations and thanks, without accounts and without identifying students. It explains, without being pushy, that a thank-you is what keeps the free platform alive.\u003c/p>\n"},{"kind":"prose","text":"Makes it easy for adults and students to give feedback, recommendations and thanks, without accounts and without identifying students. It explains, without being pushy, that a thank-you is what keeps the free platform alive.","line":240,"renderedHtml":""},{"kind":"prose","text":"","line":241,"renderedHtml":""},{"kind":"block","blockType":"service","attributes":{"id":"s-giving-back","title":"Giving feedback and thanks","for":"e-adopters, e-students","stage":"getting-better","kind":"other","supports":"t-give-feedback, t-recommend-app, t-thank-creator-adult, t-thank-creator-student","channel":"ch-feedback"},"startLine":243,"endLine":251,"inPdt42Fence":true},{"kind":"prose","text":"","line":253,"renderedHtml":""},{"kind":"heading","level":3,"text":"From using to adapting apps","line":254},{"kind":"prose","text":"","line":255,"renderedHtml":"\u003cp>Opens the path from the consumption to the production side: adults and students adapt an app or build their own, using the guidance for building apps.\u003c/p>\n"},{"kind":"prose","text":"Opens the path from the consumption to the production side: adults and students adapt an app or build their own, using the guidance for building apps.","line":256,"renderedHtml":""},{"kind":"prose","text":"","line":257,"renderedHtml":""},{"kind":"block","blockType":"service","attributes":{"id":"s-adapt-apps","title":"From using to adapting apps","for":"e-adopters, e-students","stage":"new-opportunity","kind":"other"},"startLine":259,"endLine":265,"inPdt42Fence":true},{"kind":"prose","text":"","line":267,"renderedHtml":""}]},{"filePath":"2-design/d7-experiences.pdt42.md","title":"Assemble the platform experiences","steps":["D7"],"nodes":[{"kind":"heading","level":1,"text":"Assemble the platform experiences","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":"\u003cp>\u003cem>Each experience takes one role&#39;s point of view in one core relationship (D4) and orders transactions (D5) and services (D6) into a journey. Two are the core entity&#39;s, adults in an acute moment: teachers right before a lesson, parents the evening before a test. The third is the creators&#39;, because supply does not come by itself (D4).\u003c/em>\u003c/p>\n\u003cp>Adults rarely plan ahead: they look for an app when they need it now. What they feel is relief, not excitement: &quot;it fits and it runs right away&quot;. This shapes every step: trust has to be built in rather than checked, one app counts more than a collection, and anything asked afterwards must take a single click.\u003c/p>\n\u003cp>In every journey, the thank-you after use is a step of its own. The platform is free, and thanks is what keeps it alive: every user should understand this, without the platform being pushy about it.\u003c/p>\n"},{"kind":"prose","text":"*Each experience takes one role's point of view in one core relationship (D4) and orders transactions (D5) and services (D6) into a journey. Two are the core entity's, adults in an acute moment: teachers right before a lesson, parents the evening before a test. The third is the creators', because supply does not come by itself (D4).*","line":3,"renderedHtml":""},{"kind":"prose","text":"","line":4,"renderedHtml":""},{"kind":"prose","text":"Adults rarely plan ahead: they look for an app when they need it now. What they feel is relief, not excitement: \"it fits and it runs right away\". This shapes every step: trust has to be built in rather than checked, one app counts more than a collection, and anything asked afterwards must take a single click.","line":5,"renderedHtml":""},{"kind":"prose","text":"","line":6,"renderedHtml":""},{"kind":"prose","text":"In every journey, the thank-you after use is a step of its own. The platform is free, and thanks is what keeps it alive: every user should understand this, without the platform being pushy about it.","line":7,"renderedHtml":""},{"kind":"prose","text":"","line":8,"renderedHtml":""},{"kind":"heading","level":2,"text":"An app in class within minutes","line":9},{"kind":"prose","text":"","line":10,"renderedHtml":"\u003cp>The journey of a teacher a few minutes before a lesson: find an app for this topic and grade, see at a glance that it may be used, put it on the projector or the class&#39;s devices, and say thanks afterwards.\u003c/p>\n"},{"kind":"prose","text":"The journey of a teacher a few minutes before a lesson: find an app for this topic and grade, see at a glance that it may be used, put it on the projector or the class's devices, and say thanks afterwards.","line":11,"renderedHtml":""},{"kind":"prose","text":"","line":12,"renderedHtml":""},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-x-app-in-minutes","canvas":"platform-experience","of":"x-app-in-minutes"},"startLine":14,"endLine":18,"inPdt42Fence":true},{"kind":"prose","text":"","line":20,"renderedHtml":""},{"kind":"block","blockType":"experience","attributes":{"id":"x-app-in-minutes","title":"An app in class within minutes","core-entity":"e-adopters","roles":"e-creators, e-students","relationship":"r-creators-adults","value-proposition":"The right active-learning app for this topic and grade, running in class within minutes, safe to use without checking it yourself","steps":"s-finding, t-find-app, s-fitness-clarity, t-confirm-fitness, t-bring-app, t-use-in-class, s-giving-back, t-thank-creator-adult, t-give-feedback","activities":"","resources":"","costs":"","revenues":""},"lists":{"activities":["Keeping listings comparable and current","Listing only apps that meet the fitness criteria, so trust is built in"],"resources":["The listings","The signal of fitness for use"],"costs":["The platform owner's time","Near-zero operating costs, as the apps run in the browser"],"revenues":["No money: the platform is free","Thanks and feedback, which keep creators contributing and the platform alive"]},"startLine":22,"endLine":42,"inPdt42Fence":true},{"kind":"prose","text":"","line":44,"renderedHtml":""},{"kind":"heading","level":2,"text":"Practice tonight, before the test","line":45},{"kind":"prose","text":"","line":46,"renderedHtml":"\u003cp>The journey of a parent the evening before a test: find an app the child can start right away for the topic of tomorrow&#39;s test, let the child practise, and say thanks afterwards. The setting is the kitchen table, not the classroom, and the goal is the next test, like the students&#39; own.\u003c/p>\n"},{"kind":"prose","text":"The journey of a parent the evening before a test: find an app the child can start right away for the topic of tomorrow's test, let the child practise, and say thanks afterwards. The setting is the kitchen table, not the classroom, and the goal is the next test, like the students' own.","line":47,"renderedHtml":""},{"kind":"prose","text":"","line":48,"renderedHtml":""},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-x-practice-tonight","canvas":"platform-experience","of":"x-practice-tonight"},"startLine":50,"endLine":54,"inPdt42Fence":true},{"kind":"prose","text":"","line":56,"renderedHtml":""},{"kind":"block","blockType":"experience","attributes":{"id":"x-practice-tonight","title":"Practice tonight, before the test","core-entity":"e-adopters","roles":"e-students, e-creators","relationship":"r-adults-students","value-proposition":"Tonight, before tomorrow's test: an app your child can start right away","steps":"s-finding, t-find-app, t-bring-app, s-start-right-away, t-learn-with-app, s-giving-back, t-thank-creator-adult","activities":"","resources":"","costs":"","revenues":""},"lists":{"activities":["Keeping listings findable by topic and grade","Keeping apps startable without installation or sign-up"],"resources":["The listings","The apps themselves, contributed by creators"],"costs":["The platform owner's time","Near-zero operating costs"],"revenues":["No money: the platform is free","Thanks, which keep creators contributing and the platform alive"]},"startLine":58,"endLine":78,"inPdt42Fence":true},{"kind":"prose","text":"","line":80,"renderedHtml":""},{"kind":"heading","level":2,"text":"List an app and hear it is used","line":81},{"kind":"prose","text":"","line":82,"renderedHtml":"\u003cp>The journey of the supply side: a creator who built an app for their own class lists it with almost no effort and then hears that and how it helped elsewhere. Reach is no reason to start, but use and praise keep creators (D4). The thanks they receive is the same click every user is asked for.\u003c/p>\n"},{"kind":"prose","text":"The journey of the supply side: a creator who built an app for their own class lists it with almost no effort and then hears that and how it helped elsewhere. Reach is no reason to start, but use and praise keep creators (D4). The thanks they receive is the same click every user is asked for.","line":83,"renderedHtml":""},{"kind":"prose","text":"","line":84,"renderedHtml":""},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-x-list-and-hear-back","canvas":"platform-experience","of":"x-list-and-hear-back"},"startLine":86,"endLine":90,"inPdt42Fence":true},{"kind":"prose","text":"","line":92,"renderedHtml":""},{"kind":"block","blockType":"experience","attributes":{"id":"x-list-and-hear-back","title":"List an app and hear it is used","core-entity":"e-creators","roles":"e-adopters","relationship":"r-creators-adults","value-proposition":"Build your app faster with good guidance, list it in minutes, and hear with every thank-you when it helped a class beyond your own","steps":"s-building-guidance, s-listing-help, t-list-app, t-use-in-class, s-use-insight, t-thank-creator-adult, t-give-feedback, t-recommend-app","activities":"","resources":"","costs":"","revenues":""},"lists":{"activities":["Maintaining the guidance for building apps","Checking and publishing listings","Returning thanks and feedback to creators"],"resources":["The guidance for building apps","The listings","The thanks and feedback, counted anonymously"],"costs":["The platform owner's time, later shared with co-owners (D6)","A small service for anonymous thanks, without tracking"],"revenues":["No money: the platform is free","Thanks as the currency that keeps creators contributing"]},"startLine":94,"endLine":116,"inPdt42Fence":true},{"kind":"prose","text":"","line":118,"renderedHtml":""}]},{"filePath":"2-design/d8-mvp.pdt42.md","title":"Set up the Minimum Viable Platform","steps":["D8"],"nodes":[{"kind":"heading","level":1,"text":"Set up the Minimum Viable Platform","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":"\u003cp>\u003cem>Draft for discussion. Two stages: a first draft that can start now with the creators the platform owner knows, and the real MVP, which needs teachers who still have to be won. The first draft also produces what is needed to win them. The organisation&#39;s \u003ca href=\"../about/#ch06-objectives.biz42.md\">objectives\u003c/a> and \u003ca href=\"../about/#ch07-measures.biz42.md\">measures\u003c/a> in the business model (biz42) follow from these assumptions.\u003c/em>\u003c/p>\n\u003cp>Two constraints shape every test. There is no hidden data collection (KD-18): only explicit clicks are counted, openly, so most rates cannot be measured: nobody knows how many uses a thank-you is out of. And users are not accompanied or observed, because people who know they are watched would behave differently, above all when saying thanks. The tests therefore measure outcomes that need neither: whether apps get listed, whether thanks arrive, whether creators stay. With 5 to 10 creators and about 10 teachers, the criteria are small absolute numbers, and the conversations with creators are the main source. These are learning tests, not statistical ones. Comparing two ways of asking for thanks needs far more users and is left for later.\u003c/p>\n"},{"kind":"prose","text":"*Draft for discussion. Two stages: a first draft that can start now with the creators the platform owner knows, and the real MVP, which needs teachers who still have to be won. The first draft also produces what is needed to win them. The organisation's [objectives](../about/#ch06-objectives.biz42.md) and [measures](../about/#ch07-measures.biz42.md) in the business model (biz42) follow from these assumptions.*","line":3,"renderedHtml":""},{"kind":"prose","text":"","line":4,"renderedHtml":""},{"kind":"prose","text":"Two constraints shape every test. There is no hidden data collection (KD-18): only explicit clicks are counted, openly, so most rates cannot be measured: nobody knows how many uses a thank-you is out of. And users are not accompanied or observed, because people who know they are watched would behave differently, above all when saying thanks. The tests therefore measure outcomes that need neither: whether apps get listed, whether thanks arrive, whether creators stay. With 5 to 10 creators and about 10 teachers, the criteria are small absolute numbers, and the conversations with creators are the main source. These are learning tests, not statistical ones. Comparing two ways of asking for thanks needs far more users and is left for later.","line":5,"renderedHtml":""},{"kind":"prose","text":"","line":6,"renderedHtml":""},{"kind":"heading","level":2,"text":"First draft: first apps","line":7},{"kind":"prose","text":"","line":8,"renderedHtml":"\u003cp>Starts now, with the creators the platform owner knows. It tests the supply side, whether the anonymous thanks works at all, also from school networks, and whether the platform convinces teachers on its own. For the last, the owner&#39;s contacts forward a referral link to colleagues the owner does not know: the platform itself is the pitch. The thanks is part of the first draft too, and nobody is told about it: if thanks arrive, the platform made them self-evident.\u003c/p>\n"},{"kind":"prose","text":"Starts now, with the creators the platform owner knows. It tests the supply side, whether the anonymous thanks works at all, also from school networks, and whether the platform convinces teachers on its own. For the last, the owner's contacts forward a referral link to colleagues the owner does not know: the platform itself is the pitch. The thanks is part of the first draft too, and nobody is told about it: if thanks arrive, the platform made them self-evident.","line":9,"renderedHtml":""},{"kind":"prose","text":"","line":10,"renderedHtml":""},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-mvp-first-draft","canvas":"mvp","of":"mvp-first-draft"},"startLine":12,"endLine":16,"inPdt42Fence":true},{"kind":"prose","text":"","line":18,"renderedHtml":""},{"kind":"block","blockType":"mvp","attributes":{"id":"mvp-first-draft","title":"First draft: first apps","experiences":"x-list-and-hear-back,
