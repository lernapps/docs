  <script>window.__WORKSPACE__={"elements":[{"id":"scope-lernapps","title":"lernapps.net — Community EdTech Coordination Layer","included":"|","excluded":"|","kind":"scope","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch01-scope.biz42.md","line":6,"heading":"Chapter 1: Scope","prose":"\nlernapps.net is a non-profit coordination layer for community-built educational software in Germany. It connects creators of personal educational software with educators, maps the landscape of digital learning capabilities against the KMK Kompetenzrahmen, and provides the trust infrastructure that allows school-safe adoption of tools that commercial platforms and public procurement processes cannot support. Its primary market is German schools and the informal community of teachers, developers, and media educators who build for them.\n"}},{"id":"sig-ai-dev","title":"AI-assisted dev reduces tool-building cost to a weekend","source":"external","surfaces":["risk-island","opp-ai-creation"],"kind":"signal","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch02-signals.biz42.md","line":60,"heading":"AI-assisted development lowers creation cost","prose":"\nAI-assisted development has dropped the cost of building a working educational app prototype to roughly a weekend of effort, enabling a wave of community-built tools — but also risking a fragmented island landscape with no coordination.\n"}},{"id":"sig-digitalpakt","title":"Digitalpakt funded hardware, not software ecosystem","source":"external","surfaces":["risk-island","opp-pisa-window"],"kind":"signal","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch02-signals.biz42.md","line":21,"heading":"Digitalpakt gap","prose":"\nGermany's Digitalpakt invested €11.5 billion in school hardware and connectivity, but did not fund the software ecosystem needed to make that infrastructure produce active learning outcomes.\n"}},{"id":"sig-gov-programs","title":"Many governmental digital-education programmes, low classroom adoption","source":"external","surfaces":["risk-unsafe-adoption","opp-pisa-window"],"kind":"signal","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch02-signals.biz42.md","line":34,"heading":"Low adoption of government digital programmes","prose":"\nMany governmental and state-level programmes promote digital education, but adoption rates in actual classrooms remain low — programme announcements do not translate into changed teaching practice.\n"}},{"id":"sig-kmk-strategy","title":"KMK Strategie \"Bildung in der digitalen Welt\" — binding Kompetenzrahmen and policy mandate","source":"external","surfaces":["opp-pisa-window","risk-unsafe-adoption"],"kind":"signal","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch02-signals.biz42.md","line":73,"heading":"KMK Strategie \"Bildung in der digitalen Welt\"","prose":"\nThe KMK published its \"Bildung in der digitalen Welt\" strategy in 2016, establishing a binding Kompetenzrahmen for digital competences across all German states. The strategy was extended in 2021 with recommendations on teaching and learning in the digital world, and again in 2024 with a dedicated AI guidance addendum. This creates both the institutional legitimacy and the vocabulary framework that lernapps.net's capability map is grounded in — and demonstrates that the political system has already committed to this direction, even if implementation lags.\n"}},{"id":"sig-pisa","title":"PISA 2026 — German students at historic performance low","source":"external","surfaces":["risk-invisibility","risk-unsafe-adoption","opp-pisa-window"],"kind":"signal","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch02-signals.biz42.md","line":8,"heading":"PISA 2026 performance low","prose":"\nGermany's PISA 2026 results reached a historic low — a third of 15-year-olds cannot reach baseline in reading or mathematics. The study identified inadequate digitalisation as one of three structural causes, creating an acute political moment for intervention.\n"}},{"id":"sig-unsafe-tools","title":"Teachers using unsafe or unreviewed tools on private accounts","source":"external","surfaces":["risk-dsgvo","risk-unsafe-adoption","opp-dsgvo-framing"],"kind":"signal","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch02-signals.biz42.md","line":47,"heading":"Teachers using unsafe tools","prose":"\nTeachers who do digitise their classrooms often resort to tools shared informally on personal social media accounts, outside school procurement and DSGVO review processes, creating compliance and data-safety risk.\n"}},{"id":"exp-adopter","title":"Adopters need safe, active-learning tools they can trust immediately","source":"Adopter (classroom teacher)","surfaces":["risk-dsgvo","risk-unsafe-adoption"],"kind":"expectation","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch03-expectations.biz42.md","line":21,"heading":"Adopters need safe, active-learning tools","prose":"\nTime-constrained classroom teachers need fast, reliable answers about whether a digital tool is DSGVO-compliant and whether it promotes active rather than passive learning, so they can adopt it without personal or school-level risk.\n"}},{"id":"exp-contributor","title":"Contributors build for themselves; once their work is used, recognition motivates them strongly","source":"Contributor (builder — teacher, developer, media educator)","surfaces":["risk-invisibility","risk-weak-supply","opp-ai-creation"],"kind":"expectation","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch03-expectations.biz42.md","line":8,"heading":"Contributors build for themselves, and stay for recognition","prose":"\nCreators of educational software — teachers, developers, and media educators — build their apps as personal software for their own class or child, with or without a platform. That others find, trust and build on their work is a nice-to-have, not their reason to start. Once their apps are used, though, most engaged creators are strongly motivated by praise and use; their work should then not disappear after a tweet or a barcamp session.\n"}},{"id":"exp-maintainer","title":"Platform maintainers need validated, low-friction contribution workflows","source":"Platform Maintainer","surfaces":["risk-island"],"kind":"expectation","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch03-expectations.biz42.md","line":60,"heading":"Platform maintainers need validated contribution workflows","prose":"\nPlatform maintainers need schema-validated contributions, low-friction CI pipelines, and clear data format documentation so reviewing pull requests stays manageable as the community grows.\n"}},{"id":"exp-navigator","title":"Navigators need to make defensible digital strategy decisions with low research overhead","source":"Navigator (school coordinator / digital lead)","surfaces":["risk-invisibility","opp-pisa-window"],"kind":"expectation","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch03-expectations.biz42.md","line":34,"heading":"Navigators need defensible decisions without research overhead","prose":"\nSchool coordinators and digital leads are accountable for their school's digital strategy but cannot spend weeks researching every tool. They need enough structured, reliable information to make and justify decisions to colleagues and parents — without doing all the evaluation work themselves.\n"}},{"id":"exp-oss-contributor","title":"OSS contributors need documented, forkable architecture","source":"Open-source Contributor","surfaces":["opp-ai-creation"],"kind":"expectation","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch03-expectations.biz42.md","line":73,"heading":"OSS contributors need forkable architecture","prose":"\nOpen-source contributors building on or forking the platform need documented architecture, clear building-block responsibilities, and zero-cost forkability so they can extend the ecosystem without starting from scratch.\n"}},{"id":"exp-signal-reader","title":"Signal readers need real-time, open data on community tool activity","source":"Signal Reader (researcher / policy-adjacent)","surfaces":["opp-pisa-window"],"kind":"expectation","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch03-expectations.biz42.md","line":47,"heading":"Signal readers need open data on community activity","prose":"\nEducation researchers and policy advisors need a real-time, machine-readable picture of what teachers and builders are actually making and using — to track capability map evolution and inform evidence-based policy.\n"}},{"id":"risk-dsgvo","title":"DSGVO non-compliance blocks or dangerously bypasses school adoption","severity":"high","mitigation":"frontend-only badge provides structural DSGVO guarantee; trust signal taxonomy makes compliance status visible at a glance","kind":"risk","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch04-risks.biz42.md","line":21,"heading":"DSGVO barrier and unsafe adoption","prose":"\nDSGVO compliance is a hard requirement in German schools. Tools that have not passed official review are technically off-limits, yet teachers adopt them anyway on personal accounts. This creates legal exposure for teachers and schools, and erodes trust in community-built tools generally when incidents occur. Likelihood is high; impact is high as it directly blocks or endangers the core adoption path.\n"}},{"id":"risk-endorsement","title":"Reputational risk from endorsing a tool that later proves harmful","severity":"medium","mitigation":"progressive trust model (anecdotal → community-validated → research-backed) distributes responsibility; no single authority endorses tools","kind":"risk","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch04-risks.biz42.md","line":63,"heading":"Endorsement reputation risk","prose":"\nIf lernapps.net lists or highlights a tool that later proves harmful — to student data, pedagogical outcomes, or community trust — it risks becoming associated with the failure, undermining the credibility of the entire platform. Likelihood is low in the short term; impact is medium.\n\n"}},{"id":"risk-invisibility","title":"Community-built tools are structurally invisible and unrecoverable","severity":"high","mitigation":"solution registry with PR-based contributions gives every tool a permanent, findable, linkable entry","kind":"risk","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch04-risks.biz42.md","line":34,"heading":"Tool invisibility","prose":"\nGenuinely effective educational tools are created by engaged individuals, shared briefly on social media or at barcamps, and then vanish. There is no registry, no canonical URL, no fork lineage — the community's creative output is structurally invisible and unreusable. Likelihood is certain (already observed); impact is high as it means the ecosystem never compounds.\n"}},{"id":"risk-island","title":"Island proliferation — fragmented tools with no coordination layer","severity":"high","mitigation":"lernapps.net's capability map and registry provide the coordination layer; architecture guidelines ensure tools are ecosystem-connected from day one","kind":"risk","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch04-risks.biz42.md","line":8,"heading":"Island proliferation","prose":"\nAs AI-assisted development makes it trivially cheap to build educational tools, there is a real risk that the community produces hundreds of isolated, incompatible tools with no shared vocabulary, no common capability map, and no coordination layer. Each tool reinvents the same patterns, and the ecosystem fragments instead of compounds. Likelihood is high given current trends; impact is high as it would undermine lernapps.net's core value proposition.\n"}},{"id":"risk-unsafe-adoption","title":"Teachers adopt unsafe or pedagogically passive tools by default","severity":"high","mitigation":"solution registry with active/passive taxonomy and DSGVO signals gives teachers a fast, trustworthy alternative discovery path","kind":"risk","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch04-risks.biz42.md","line":47,"heading":"Unsafe adoption driven by teacher isolation","prose":"\nWhen teachers cannot find safe, vetted tools through official channels, they resort to whatever they find informally — often passive content platforms or tools with unclear data practices. This is not a knowledge failure; it is a structural gap in the ecosystem that lernapps.net is positioned to fill. Likelihood is high (already observed); impact is medium — harmful to individual teachers but not existential for lernapps.net.\n"}},{"id":"risk-weak-supply","title":"Creators have little reason to contribute their apps","severity":"high","mitigation":"make listing an app almost effortless, offer creators a benefit independent of reach such as better guidance when building, and make use and praise visible to creators once their app is used","kind":"risk","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch04-risks.biz42.md","line":76,"heading":"Creators have little reason to contribute","prose":"\nCreators build their apps as personal software for their own class or child, with or without lernapps.net. That others use their app is only a nice-to-have for them. So the supply of apps does not come by itself: if contributing costs effort, few creators will do it, and adults find too little to come back. Once an app is used, however, praise and use motivate most engaged creators strongly; the hurdle is the first contribution. Identified in the platform design (pdt42 D4, 2026-09-30).\n"}},{"id":"opp-ai-creation","title":"AI-assisted dev enables rapid community tool creation at scale","kind":"opportunity","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch05-opportunities.biz42.md","line":19,"heading":"AI-assisted community creation","prose":"\nAI-assisted development means motivated teachers and developers can build working educational prototypes in a weekend. lernapps.net can capture this creative energy by providing the capability map, scaffolding, and registry that turn individual experiments into ecosystem contributions.\n"}},{"id":"opp-dsgvo-framing","title":"Frontend-only badge unlocks school adoption without procurement review","kind":"opportunity","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch05-opportunities.biz42.md","line":30,"heading":"Frontend-only DSGVO framing","prose":"\nTools that run entirely in the browser with no backend are structurally incapable of exfiltrating student data — yet this framing does not yet exist in the school adoption conversation. lernapps.net can pioneer a \"frontend-only = DSGVO-safe by design\" badge that unlocks immediate classroom adoption without bureaucratic review.\n"}},{"id":"opp-pisa-window","title":"PISA 2026 political moment creates demand for ecosystem coordination","kind":"opportunity","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch05-opportunities.biz42.md","line":8,"heading":"PISA political window","prose":"\nThe PISA 2026 results have opened a rare political window where politicians, media, school leadership, and teachers are simultaneously motivated to act on digital education. lernapps.net can establish itself as the credible coordination layer before this window closes.\n"}},{"id":"obj-agent-guidance","title":"Provide scaffolding and agent guidance for ecosystem-connected tool creation","addresses":["risk-island","risk-weak-supply","opp-ai-creation"],"measured-by":["measure-scaffold-usage"],"owner":"owner-platform","requires":["cap-scaffolding","cap-capability-mapping"],"kind":"objective","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch06-objectives.biz42.md","line":53,"heading":"Provide agent guidance for rapid ecosystem-connected development","prose":"\nThe scaffolding layer — architecture guidelines, starter templates, AI-assisted creation flow — enables contributors to build new tools that are ecosystem-connected from day one rather than reinvented from scratch. This captures the AI-assisted creation opportunity and prevents future island proliferation.\n"}},{"id":"obj-capability-map","title":"Publish a live KMK-aligned capability inventory with coverage status","addresses":["risk-island","risk-invisibility","opp-pisa-window"],"measured-by":["measure-capability-coverage"],"owner":"owner-platform","requires":["cap-capability-mapping","cap-registry-ops"],"kind":"objective","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch06-objectives.biz42.md","line":23,"heading":"Publish a live capability inventory","prose":"\nThe capability map is the strategic core of lernapps.net. Without it, the registry is just a list. With it, gaps become visible build opportunities, contributors can position their work, and school coordinators can assess coverage. This directly addresses island proliferation by providing the coordination vocabulary.\n"}},{"id":"obj-first-apps","title":"Curate a high-quality initial set of registry entries","addresses":["risk-dsgvo","risk-unsafe-adoption","opp-dsgvo-framing"],"measured-by":["measure-registry-entries"],"owner":"owner-platform","requires":["cap-curation","cap-registry-ops"],"kind":"objective","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch06-objectives.biz42.md","line":38,"heading":"Curate a high-quality set of first registry entries","prose":"\nThe registry needs enough high-quality, DSGVO-safe, active-learning-focused entries to be useful on day one. A sparse registry drives teachers back to passive platforms. This objective seeds the trust flywheel and demonstrates the value of the capability map in practice.\n"}},{"id":"obj-narrative","title":"Establish clear public narrative — what lernapps.net is and is not","addresses":["risk-invisibility","risk-unsafe-adoption","opp-pisa-window"],"measured-by":["measure-landing-engagement"],"owner":"owner-platform","requires":["cap-communication"],"kind":"objective","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch06-objectives.biz42.md","line":8,"heading":"Establish the narrative and positioning","prose":"\nlernapps.net's first obligation is to make clear what it is and what it is not. Without a sharp, credible narrative, contributors won't submit tools, teachers won't trust the registry, and the PISA political window closes before the platform has established itself. This objective addresses the risks of invisibility and unsafe adoption by establishing a trustworthy public identity.\n"}},{"id":"obj-trust-model","title":"Operate a progressive trust model that protects platform credibility","addresses":["risk-endorsement","risk-dsgvo"],"measured-by":["measure-trust-signals"],"owner":"owner-platform","requires":["cap-curation","cap-registry-ops"],"kind":"objective","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch06-objectives.biz42.md","line":68,"heading":"Protect platform credibility through progressive trust","prose":"\nAs the registry grows, lernapps.net must not become a source of harmful tool recommendations. The progressive trust model (anecdotal → community-validated → research-backed) and DSGVO signal taxonomy must be operational and visible before growth accelerates.\n"}},{"id":"measure-capability-coverage","title":"KMK capability map coverage — domains covered and gap nodes published","target":"All 6 KMK domains covered with at least 3 capability nodes each; at least 10 gap nodes marked as build opportunities","kind":"measure","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch07-measures.biz42.md","line":20,"heading":"Capability map coverage","prose":"\nThe capability map must cover all six KMK Kompetenzrahmen domains with at least one capability node per domain, and surface genuine gaps as explicit build opportunities. Coverage breadth and the number of `needed` nodes published as open contributions are the leading indicators.\n"}},{"id":"measure-landing-engagement","title":"Landing page engagement and community sign-ups","target":"500 unique visitors and 100 sign-ups within 60 days of launch","kind":"measure","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch07-measures.biz42.md","line":8,"heading":"Landing page engagement","prose":"\nThe landing page is the first test of whether the narrative lands. Engagement signals — unique visitors, time on page, and newsletter or community sign-ups — indicate whether the story resonates with the target audience during the PISA political window.\n"}},{"id":"measure-registry-entries","title":"Number of registry entries with DSGVO and active/passive signals populated","target":"20 entries at launch, all with DSGVO status and active/passive level populated","kind":"measure","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch07-measures.biz42.md","line":32,"heading":"Registry entry count and quality","prose":"\nThe registry must reach a critical mass of high-quality, DSGVO-safe, active-learning-focused entries to be useful as a discovery tool. Both quantity and quality signals (DSGVO status, active/passive classification populated) are tracked.\n"}},{"id":"measure-scaffold-usage","title":"New tool submissions using lernapps.net scaffolding or referencing capability map gaps","target":"5 submissions citing capability map gap within 90 days of scaffolding layer launch","kind":"measure","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch07-measures.biz42.md","line":44,"heading":"Scaffolding and agent guidance usage","prose":"\nOnce the scaffolding layer is published, uptake by contributors — measured as new tool submissions that cite lernapps.net architecture or use starter templates — indicates whether the guidance is actually reducing friction.\n"}},{"id":"measure-trust-signals","title":"Share of registry entries with community-validated or higher evidence level","target":"30% of registry entries reach community-validated within 6 months of launch","kind":"measure","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch07-measures.biz42.md","line":56,"heading":"Trust signal adoption","prose":"\nThe progressive trust model is effective only if community members actually provide \"I tried this\" feedback and if DSGVO signals are populated. The share of entries with at least `community-validated` evidence level is the key quality signal.\n"}},{"id":"owner-platform","title":"Platform owner (Oliver Jägle)","kind":"owner","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch08-owners.biz42.md","line":8,"heading":"Platform owner","prose":"\nOliver Jägle is accountable for the platform: all strategic objectives and products. Ralf D. Müller, the author of the Mathe-Karte, focuses on the apps themselves, such as the Mathe-Karte, and does not take part in the platform. App repositories belong to their authors. There is no registered legal entity yet; if the platform takes off, it could become a registered association (Verein), so that it belongs to those who fill it with life. How decisions are made is described in [GOVERNANCE.md](https://github.com/lernapps/.github/blob/main/GOVERNANCE.md); it still describes two owners with equal rights and is to be updated to the sole owner.\n"}},{"id":"cap-capability-mapping","title":"Capability mapping against KMK Kompetenzrahmen","status":"planned","enables":["prod-capability-map"],"kind":"capability","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch09-capabilities.biz42.md","line":21,"heading":"Capability mapping","prose":"\nThe ability to maintain a living map of educational capabilities aligned to the KMK Kompetenzrahmen — tracking what exists, what is missing, and what is partially covered — and to keep that map current as the community evolves.\n"}},{"id":"cap-communication","title":"Strategic communication — narrative and positioning","status":"exists","enables":["prod-landing-page"],"kind":"capability","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch09-capabilities.biz42.md","line":8,"heading":"Strategic communication","prose":"\nThe ability to articulate what lernapps.net is and is not — in plain language that resonates with teachers, builders, researchers, and policy audiences — across the landing page, documentation, and community channels.\n"}},{"id":"cap-curation","title":"Curation — active/passive taxonomy and DSGVO trust signal assignment","status":"planned","enables":["prod-registry"],"kind":"capability","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch09-capabilities.biz42.md","line":47,"heading":"Curation and trust signalling","prose":"\nThe ability to assess submissions against the active/passive taxonomy and DSGVO signal framework, assign initial evidence levels, and surface community validation signals as the registry matures.\n"}},{"id":"cap-registry-ops","title":"Registry operations — contribution workflow and schema validation","status":"planned","enables":["prod-registry"],"kind":"capability","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch09-capabilities.biz42.md","line":34,"heading":"Registry operations","prose":"\nThe ability to accept, validate, and publish community tool submissions via a GitHub PR workflow with schema validation, CI checks, and clear contribution documentation.\n"}},{"id":"cap-scaffolding","title":"Scaffolding — architecture guidelines and AI-assisted creation flow","status":"gap","enables":["prod-scaffolding"],"kind":"capability","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch09-capabilities.biz42.md","line":60,"heading":"Scaffolding and agent guidance","prose":"\nThe ability to publish architecture guidelines, starter templates, and AI-assisted creation flows that allow contributors to build ecosystem-connected tools starting from a capability map gap rather than a blank page.\n"}},{"id":"prod-capability-map","title":"Capability map — KMK-aligned living inventory of educational capabilities","fulfills":["exp-navigator","exp-signal-reader","exp-contributor"],"owner":"owner-platform","kind":"product","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch10-products.biz42.md","line":21,"heading":"Capability map","prose":"\nA publicly accessible, living map of educational capabilities organised by the six KMK Kompetenzrahmen domains. Each capability node carries a coverage status (`needed`, `partial`, `well-covered`). Gap nodes are surfaced as explicit build invitations for contributors. This is the strategic core that differentiates lernapps.net from a plain tool list.\n"}},{"id":"prod-landing-page","title":"Landing page — narrative entry point for all personas","fulfills":["exp-contributor","exp-adopter","exp-navigator","exp-signal-reader"],"owner":"owner-platform","kind":"product","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch10-products.biz42.md","line":8,"heading":"Landing page","prose":"\nThe narrative entry point for all personas — contributors, adopters, navigators, researchers. It communicates the value proposition clearly, directs each stakeholder to the right next step, and establishes lernapps.net's credibility during the PISA political window.\n"}},{"id":"prod-registry","title":"Solution registry — structured, trusted catalog of community-built tools","fulfills":["exp-adopter","exp-contributor","exp-navigator","exp-maintainer"],"owner":"owner-platform","kind":"product","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch10-products.biz42.md","line":34,"heading":"Solution registry","prose":"\nA structured, filterable catalog of community-built educational tools. Every entry is linked to capability nodes, carries DSGVO status, active/passive classification, and an evidence level. Contributions are submitted as GitHub Pull Requests with automated schema validation.\n"}},{"id":"prod-scaffolding","title":"Scaffolding layer — architecture guidelines and AI-assisted creation flow","fulfills":["exp-contributor","exp-oss-contributor"],"owner":"owner-platform","kind":"product","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch10-products.biz42.md","line":47,"heading":"Scaffolding layer","prose":"\nArchitecture guidelines, starter templates, and an AI-assisted creation flow that allows contributors to build new tools starting from a capability map gap. Ensures new tools are ecosystem-connected rather than reinvented from scratch.\n"}},{"id":"eval-landing-review","title":"Monthly landing page and community growth review","evaluates":["measure-landing-engagement"],"kind":"evaluation","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch11-evaluation.biz42.md","line":8,"heading":"Monthly landing page review","prose":"\nThe founding team reviews landing page engagement metrics monthly to determine whether the narrative is resonating and whether the PISA political window is being used effectively. Findings feed directly into narrative and positioning adjustments.\n"}},{"id":"eval-registry-review","title":"Quarterly capability map coverage and registry quality review","evaluates":["measure-capability-coverage","measure-registry-entries","measure-trust-signals"],"kind":"evaluation","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch11-evaluation.biz42.md","line":20,"heading":"Quarterly capability map and registry review","prose":"\nEvery quarter the founding team reviews capability map coverage and registry entry quality — checking whether KMK domains are covered, whether gap nodes are being claimed, and whether new entries meet the DSGVO and active/passive quality bar.\n"}},{"id":"eval-scaffold-review","title":"Quarterly scaffolding uptake and contributor friction review","evaluates":["measure-scaffold-usage"],"kind":"evaluation","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch11-evaluation.biz42.md","line":32,"heading":"Quarterly scaffolding uptake review","prose":"\nOnce the scaffolding layer is live, the team reviews whether new contributions are being made from capability map gaps and whether the AI-assisted creation flow reduces friction. This evaluation triggers improvements to the scaffolding documentation and templates.\n"}},{"id":"imp-landing","title":"Launch landing page to validate narrative and capture PISA-window interest","type":"innovative","triggered-by":"eval-landing-review","addresses":["obj-narrative"],"kind":"improvement","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch12-improvements.biz42.md","line":8,"heading":"Phase 0 — Launch landing page","prose":"\nThe landing page is the first concrete delivery. It validates the narrative before infrastructure is built, generates community signal during the PISA political window, and establishes the public URL and identity that subsequent phases build on.\n"}},{"id":"imp-registry","title":"Launch static capability map and solution registry with PR contribution workflow","type":"innovative","triggered-by":"eval-registry-review","addresses":["obj-capability-map","obj-first-apps","obj-trust-model"],"kind":"improvement","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch12-improvements.biz42.md","line":22,"heading":"Phase 1 — Launch static capability map and registry","prose":"\nThe static registry with capability map, client-side discovery, and GitHub PR contribution workflow is the minimum viable coordination layer. This phase turns the narrative promise into a working product.\n"}},{"id":"imp-scaffolding","title":"Launch scaffolding layer with architecture guidelines and AI-assisted creation flow","type":"innovative","triggered-by":"eval-scaffold-review","addresses":["obj-agent-guidance"],"kind":"improvement","loc":{"file":"/home/runner/work/docs/docs/docs/biz42/ch12-improvements.biz42.md","line":36,"heading":"Phase 2 — Launch scaffolding and agent guidance layer","prose":"\nThe scaffolding layer — architecture guidelines, starter templates, and AI-assisted creation flow connected to the capability map — captures the AI-assisted development opportunity and closes the island proliferation risk by ensuring new tools are ecosystem-connected from day one.\n"}}],"edges":[{"from":"sig-pisa","to":"risk-invisibility","relation":"surfaces"},{"from":"sig-pisa","to":"risk-unsafe-adoption","relation":"surfaces"},{"from":"sig-pisa","to":"opp-pisa-window","relation":"surfaces"},{"from":"sig-digitalpakt","to":"risk-island","relation":"surfaces"},{"from":"sig-digitalpakt","to":"opp-pisa-window","relation":"surfaces"},{"from":"sig-gov-programs","to":"risk-unsafe-adoption","relation":"surfaces"},{"from":"sig-gov-programs","to":"opp-pisa-window","relation":"surfaces"},{"from":"sig-unsafe-tools","to":"risk-dsgvo","relation":"surfaces"},{"from":"sig-unsafe-tools","to":"risk-unsafe-adoption","relation":"surfaces"},{"from":"sig-unsafe-tools","to":"opp-dsgvo-framing","relation":"surfaces"},{"from":"sig-ai-dev","to":"risk-island","relation":"surfaces"},{"from":"sig-ai-dev","to":"opp-ai-creation","relation":"surfaces"},{"from":"sig-kmk-strategy","to":"opp-pisa-window","relation":"surfaces"},{"from":"sig-kmk-strategy","to":"risk-unsafe-adoption","relation":"surfaces"},{"from":"exp-contributor","to":"risk-invisibility","relation":"surfaces"},{"from":"exp-contributor","to":"risk-weak-supply","relation":"surfaces"},{"from":"exp-contributor","to":"opp-ai-creation","relation":"surfaces"},{"from":"exp-adopter","to":"risk-dsgvo","relation":"surfaces"},{"from":"exp-adopter","to":"risk-unsafe-adoption","relation":"surfaces"},{"from":"exp-navigator","to":"risk-invisibility","relation":"surfaces"},{"from":"exp-navigator","to":"opp-pisa-window","relation":"surfaces"},{"from":"exp-signal-reader","to":"opp-pisa-window","relation":"surfaces"},{"from":"exp-maintainer","to":"risk-island","relation":"surfaces"},{"from":"exp-oss-contributor","to":"opp-ai-creation","relation":"surfaces"},{"from":"obj-narrative","to":"risk-invisibility","relation":"addresses"},{"from":"obj-narrative","to":"risk-unsafe-adoption","relation":"addresses"},{"from":"obj-narrative","to":"opp-pisa-window","relation":"addresses"},{"from":"obj-narrative","to":"measure-landing-engagement","relation":"measured-by"},{"from":"obj-narrative","to":"owner-platform","relation":"owner"},{"from":"obj-narrative","to":"cap-communication","relation":"requires"},{"from":"obj-capability-map","to":"risk-island","relation":"addresses"},{"from":"obj-capability-map","to":"risk-invisibility","relation":"addresses"},{"from":"obj-capability-map","to":"opp-pisa-window","relation":"addresses"},{"from":"obj-capability-map","to":"measure-capability-coverage","relation":"measured-by"},{"from":"obj-capability-map","to":"owner-platform","relation":"owner"},{"from":"obj-capability-map","to":"cap-capability-mapping","relation":"requires"},{"from":"obj-capability-map","to":"cap-registry-ops","relation":"requires"},{"from":"obj-first-apps","to":"risk-dsgvo","relation":"addresses"},{"from":"obj-first-apps","to":"risk-unsafe-adoption","relation":"addresses"},{"from":"obj-first-apps","to":"opp-dsgvo-framing","relation":"addresses"},{"from":"obj-first-apps","to":"measure-registry-entries","relation":"measured-by"},{"from":"obj-first-apps","to":"owner-platform","relation":"owner"},{"from":"obj-first-apps","to":"cap-curation","relation":"requires"},{"from":"obj-first-apps","to":"cap-registry-ops","relation":"requires"},{"from":"obj-agent-guidance","to":"risk-island","relation":"addresses"},{"from":"obj-agent-guidance","to":"risk-weak-supply","relation":"addresses"},{"from":"obj-agent-guidance","to":"opp-ai-creation","relation":"addresses"},{"from":"obj-agent-guidance","to":"measure-scaffold-usage","relation":"measured-by"},{"from":"obj-agent-guidance","to":"owner-platform","relation":"owner"},{"from":"obj-agent-guidance","to":"cap-scaffolding","relation":"requires"},{"from":"obj-agent-guidance","to":"cap-capability-mapping","relation":"requires"},{"from":"obj-trust-model","to":"risk-endorsement","relation":"addresses"},{"from":"obj-trust-model","to":"risk-dsgvo","relation":"addresses"},{"from":"obj-trust-model","to":"measure-trust-signals","relation":"measured-by"},{"from":"obj-trust-model","to":"owner-platform","relation":"owner"},{"from":"obj-trust-model","to":"cap-curation","relation":"requires"},{"from":"obj-trust-model","to":"cap-registry-ops","relation":"requires"},{"from":"cap-communication","to":"prod-landing-page","relation":"enables"},{"from":"cap-capability-mapping","to":"prod-capability-map","relation":"enables"},{"from":"cap-registry-ops","to":"prod-registry","relation":"enables"},{"from":"cap-curation","to":"prod-registry","relation":"enables"},{"from":"cap-scaffolding","to":"prod-scaffolding","relation":"enables"},{"from":"prod-landing-page","to":"exp-contributor","relation":"fulfills"},{"from":"prod-landing-page","to":"exp-adopter","relation":"fulfills"},{"from":"prod-landing-page","to":"exp-navigator","relation":"fulfills"},{"from":"prod-landing-page","to":"exp-signal-reader","relation":"fulfills"},{"from":"prod-landing-page","to":"owner-platform","relation":"owner"},{"from":"prod-capability-map","to":"exp-navigator","relation":"fulfills"},{"from":"prod-capability-map","to":"exp-signal-reader","relation":"fulfills"},{"from":"prod-capability-map","to":"exp-contributor","relation":"fulfills"},{"from":"prod-capability-map","to":"owner-platform","relation":"owner"},{"from":"prod-registry","to":"exp-adopter","relation":"fulfills"},{"from":"prod-registry","to":"exp-contributor","relation":"fulfills"},{"from":"prod-registry","to":"exp-navigator","relation":"fulfills"},{"from":"prod-registry","to":"exp-maintainer","relation":"fulfills"},{"from":"prod-registry","to":"owner-platform","relation":"owner"},{"from":"prod-scaffolding","to":"exp-contributor","relation":"fulfills"},{"from":"prod-scaffolding","to":"exp-oss-contributor","relation":"fulfills"},{"from":"prod-scaffolding","to":"owner-platform","relation":"owner"},{"from":"eval-landing-review","to":"measure-landing-engagement","relation":"evaluates"},{"from":"eval-registry-review","to":"measure-capability-coverage","relation":"evaluates"},{"from":"eval-registry-review","to":"measure-registry-entries","relation":"evaluates"},{"from":"eval-registry-review","to":"measure-trust-signals","relation":"evaluates"},{"from":"eval-scaffold-review","to":"measure-scaffold-usage","relation":"evaluates"},{"from":"imp-landing","to":"eval-landing-review","relation":"triggered-by"},{"from":"imp-landing","to":"obj-narrative","relation":"improvement-addresses"},{"from":"imp-registry","to":"eval-registry-review","relation":"triggered-by"},{"from":"imp-registry","to":"obj-capability-map","relation":"improvement-addresses"},{"from":"imp-registry","to":"obj-first-apps","relation":"improvement-addresses"},{"from":"imp-registry","to":"obj-trust-model","relation":"improvement-addresses"},{"from":"imp-scaffolding","to":"eval-scaffold-review","relation":"triggered-by"},{"from":"imp-scaffolding","to":"obj-agent-guidance","relation":"improvement-addresses"}],"documents":[{"filePath":"/home/runner/work/docs/docs/docs/biz42/ch01-scope.biz42.md","nodes":[{"kind":"heading","level":1,"text":"Chapter 1: Scope","line":1},{"kind":"prose","text":"","line":2},{"kind":"prose","text":"lernapps.net is a non-profit coordination layer for community-built educational software in Germany. It connects creators of personal educational software with educators, maps the landscape of digital learning capabilities against the KMK Kompetenzrahmen, and provides the trust infrastructure that allows school-safe adoption of tools that commercial platforms and public procurement processes cannot support. Its primary market is German schools and the informal community of teachers, developers, and media educators who build for them.","line":3},{"kind":"prose","text":"","line":4},{"kind":"block","blockType":"scope","attributes":{"id":"scope-lernapps","title":"lernapps.net — Community EdTech Coordination Layer","included":"|","excluded":"|"},"startLine":6,"endLine":23,"inBiz42Fence":true},{"kind":"prose","text":"","line":25}]},{"filePath":"/home/runner/work/docs/docs/docs/biz42/ch02-signals.biz42.md","nodes":[{"kind":"heading","level":1,"text":"Chapter 2: Signals","line":1},{"kind":"prose","text":"","line":2},{"kind":"heading","level":2,"text":"PISA 2026 performance low","line":3},{"kind":"prose","text":"","line":4},{"kind":"prose","text":"Germany's PISA 2026 results reached a historic low — a third of 15-year-olds cannot reach baseline in reading or mathematics. The study identified inadequate digitalisation as one of three structural causes, creating an acute political moment for intervention.","line":5},{"kind":"prose","text":"","line":6},{"kind":"block","blockType":"signal","attributes":{"id":"sig-pisa","title":"PISA 2026 — German students at historic performance low","source":"external","surfaces":"risk-invisibility, risk-unsafe-adoption, opp-pisa-window"},"startLine":8,"endLine":13,"inBiz42Fence":true},{"kind":"prose","text":"","line":15},{"kind":"heading","level":2,"text":"Digitalpakt gap","line":16},{"kind":"prose","text":"","line":17},{"kind":"prose","text":"Germany's Digitalpakt invested €11.5 billion in school hardware and connectivity, but did not fund the software ecosystem needed to make that infrastructure produce active learning outcomes.","line":18},{"kind":"prose","text":"","line":19},{"kind":"block","blockType":"signal","attributes":{"id":"sig-digitalpakt","title":"Digitalpakt funded hardware, not software ecosystem","source":"external","surfaces":"risk-island, opp-pisa-window"},"startLine":21,"endLine":26,"inBiz42Fence":true},{"kind":"prose","text":"","line":28},{"kind":"heading","level":2,"text":"Low adoption of government digital programmes","line":29},{"kind":"prose","text":"","line":30},{"kind":"prose","text":"Many governmental and state-level programmes promote digital education, but adoption rates in actual classrooms remain low — programme announcements do not translate into changed teaching practice.","line":31},{"kind":"prose","text":"","line":32},{"kind":"block","blockType":"signal","attributes":{"id":"sig-gov-programs","title":"Many governmental digital-education programmes, low classroom adoption","source":"external","surfaces":"risk-unsafe-adoption, opp-pisa-window"},"startLine":34,"endLine":39,"inBiz42Fence":true},{"kind":"prose","text":"","line":41},{"kind":"heading","level":2,"text":"Teachers using unsafe tools","line":42},{"kind":"prose","text":"","line":43},{"kind":"prose","text":"Teachers who do digitise their classrooms often resort to tools shared informally on personal social media accounts, outside school procurement and DSGVO review processes, creating compliance and data-safety risk.","line":44},{"kind":"prose","text":"","line":45},{"kind":"block","blockType":"signal","attributes":{"id":"sig-unsafe-tools","title":"Teachers using unsafe or unreviewed tools on private accounts","source":"external","surfaces":"risk-dsgvo, risk-unsafe-adoption, opp-dsgvo-framing"},"startLine":47,"endLine":52,"inBiz42Fence":true},{"kind":"prose","text":"","line":54},{"kind":"heading","level":2,"text":"AI-assisted development lowers creation cost","line":55},{"kind":"prose","text":"","line":56},{"kind":"prose","text":"AI-assisted development has dropped the cost of building a working educational app prototype to roughly a weekend of effort, enabling a wave of community-built tools — but also risking a fragmented island landscape with no coordination.","line":57},{"kind":"prose","text":"","line":58},{"kind":"block","blockType":"signal","attributes":{"id":"sig-ai-dev","title":"AI-assisted dev reduces tool-building cost to a weekend","source":"external","surfaces":"risk-island, opp-ai-creation"},"startLine":60,"endLine":65,"inBiz42Fence":true},{"kind":"prose","text":"","line":67},{"kind":"heading","level":2,"text":"KMK Strategie \"Bildung in der digitalen Welt\"","line":68},{"kind":"prose","text":"","line":69},{"kind":"prose","text":"The KMK published its \"Bildung in der digitalen Welt\" strategy in 2016, establishing a binding Kompetenzrahmen for digital competences across all German states. The strategy was extended in 2021 with recommendations on teaching and learning in the digital world, and again in 2024 with a dedicated AI guidance addendum. This creates both the institutional legitimacy and the vocabulary framework that lernapps.net's capability map is grounded in — and demonstrates that the political system has already committed to this direction, even if implementation lags.","line":70},{"kind":"prose","text":"","line":71},{"kind":"block","blockType":"signal","attributes":{"id":"sig-kmk-strategy","title":"KMK Strategie \"Bildung in der digitalen Welt\" — binding Kompetenzrahmen and policy mandate","source":"external","surfaces":"opp-pisa-window, risk-unsafe-adoption"},"startLine":73,"endLine":78,"inBiz42Fence":true},{"kind":"prose","text":"","line":80}]},{"filePath":"/home/runner/work/docs/docs/docs/biz42/ch03-expectations.biz42.md","nodes":[{"kind":"heading","level":1,"text":"Chapter 3: Expectations","line":1},{"kind":"prose","text":"","line":2},{"kind":"heading","level":2,"text":"Contributors build for themselves, and stay for recognition","line":3},{"kind":"prose","text":"","line":4},{"kind":"prose","text":"Creators of educational software — teachers, developers, and media educators — build their apps as personal software for their own class or child, with or without a platform. That others find, trust and build on their work is a nice-to-have, not their reason to start. Once their apps are used, though, most engaged creators are strongly motivated by praise and use; their work should then not disappear after a tweet or a barcamp session.","line":5},{"kind":"prose","text":"","line":6},{"kind":"block","blockType":"expectation","attributes":{"id":"exp-contributor","title":"Contributors build for themselves; once their work is used, recognition motivates them strongly","source":"Contributor (builder — teacher, developer, media educator)","surfaces":"risk-invisibility, risk-weak-supply, opp-ai-creation"},"startLine":8,"endLine":13,"inBiz42Fence":true},{"kind":"prose","text":"","line":15},{"kind":"heading","level":2,"text":"Adopters need safe, active-learning tools","line":16},{"kind":"prose","text":"","line":17},{"kind":"prose","text":"Time-constrained classroom teachers need fast, reliable answers about whether a digital tool is DSGVO-compliant and whether it promotes active rather than passive learning, so they can adopt it without personal or school-level risk.","line":18},{"kind":"prose","text":"","line":19},{"kind":"block","blockType":"expectation","attributes":{"id":"exp-adopter","title":"Adopters need safe, active-learning tools they can trust immediately","source":"Adopter (classroom teacher)","surfaces":"risk-dsgvo, risk-unsafe-adoption"},"startLine":21,"endLine":26,"inBiz42Fence":true},{"kind":"prose","text":"","line":28},{"kind":"heading","level":2,"text":"Navigators need defensible decisions without research overhead","line":29},{"kind":"prose","text":"","line":30},{"kind":"prose","text":"School coordinators and digital leads are accountable for their school's digital strategy but cannot spend weeks researching every tool. They need enough structured, reliable information to make and justify decisions to colleagues and parents — without doing all the evaluation work themselves.","line":31},{"kind":"prose","text":"","line":32},{"kind":"block","blockType":"expectation","attributes":{"id":"exp-navigator","title":"Navigators need to make defensible digital strategy decisions with low research overhead","source":"Navigator (school coordinator / digital lead)","surfaces":"risk-invisibility, opp-pisa-window"},"startLine":34,"endLine":39,"inBiz42Fence":true},{"kind":"prose","text":"","line":41},{"kind":"heading","level":2,"text":"Signal readers need open data on community activity","line":42},{"kind":"prose","text":"","line":43},{"kind":"prose","text":"Education researchers and policy advisors need a real-time, machine-readable picture of what teachers and builders are actually making and using — to track capability map evolution and inform evidence-based policy.","line":44},{"kind":"prose","text":"","line":45},{"kind":"block","blockType":"expectation","attributes":{"id":"exp-signal-reader","title":"Signal readers need real-time, open data on community tool activity","source":"Signal Reader (researcher / policy-adjacent)","surfaces":"opp-pisa-window"},"startLine":47,"endLine":52,"inBiz42Fence":true},{"kind":"prose","text":"","line":54},{"kind":"heading","level":2,"text":"Platform maintainers need validated contribution workflows","line":55},{"kind":"prose","text":"","line":56},{"kind":"prose","text":"Platform maintainers need schema-validated contributions, low-friction CI pipelines, and clear data format documentation so reviewing pull requests stays manageable as the community grows.","line":57},{"kind":"prose","text":"","line":58},{"kind":"block","blockType":"expectation","attributes":{"id":"exp-maintainer","title":"Platform maintainers need validated, low-friction contribution workflows","source":"Platform Maintainer","surfaces":"risk-island"},"startLine":60,"endLine":65,"inBiz42Fence":true},{"kind":"prose","text":"","line":67},{"kind":"heading","level":2,"text":"OSS contributors need forkable architecture","line":68},{"kind":"prose","text":"","line":69},{"kind":"prose","text":"Open-source contributors building on or forking the platform need documented architecture, clear building-block responsibilities, and zero-cost forkability so they can extend the ecosystem without starting from scratch.","line":70},{"kind":"prose","text":"","line":71},{"kind":"block","blockType":"expectation","attributes":{"id":"exp-oss-contributor","title":"OSS contributors need documented, forkable architecture","source":"Open-source Contributor","surfaces":"opp-ai-creation"},"startLine":73,"endLine":78,"inBiz42Fence":true},{"kind":"prose","text":"","line":80}]},{"filePath":"/home/runner/work/docs/docs/docs/biz42/ch04-risks.biz42.md","nodes":[{"kind":"heading","level":1,"text":"Chapter 4: Risks","line":1},{"kind":"prose","text":"","line":2},{"kind":"heading","level":2,"text":"Island proliferation","line":3},{"kind":"prose","text":"","line":4},{"kind":"prose","text":"As AI-assisted development makes it trivially cheap to build educational tools, there is a real risk that the community produces hundreds of isolated, incompatible tools with no shared vocabulary, no common capability map, and no coordination layer. Each tool reinvents the same patterns, and the ecosystem fragments instead of compounds. Likelihood is high given current trends; impact is high as it would undermine lernapps.net's core value proposition.","line":5},{"kind":"prose","text":"","line":6},{"kind":"block","blockType":"risk","attributes":{"id":"risk-island","title":"Island proliferation — fragmented tools with no coordination layer","severity":"high","mitigation":"lernapps.net's capability map and registry provide the coordination layer; architecture guidelines ensure tools are ecosystem-connected from day one"},"startLine":8,"endLine":13,"inBiz42Fence":true},{"kind":"prose","text":"","line":15},{"kind":"heading","level":2,"text":"DSGVO barrier and unsafe adoption","line":16},{"kind":"prose","text":"","line":17},{"kind":"prose","text":"DSGVO compliance is a hard requirement in German schools. Tools that have not passed official review are technically off-limits, yet teachers adopt them anyway on personal accounts. This creates legal exposure for teachers and schools, and erodes trust in community-built tools generally when incidents occur. Likelihood is high; impact is high as it directly blocks or endangers the core adoption path.","line":18},{"kind":"prose","text":"","line":19},{"kind":"block","blockType":"risk","attributes":{"id":"risk-dsgvo","title":"DSGVO non-compliance blocks or dangerously bypasses school adoption","severity":"high","mitigation":"frontend-only badge provides structural DSGVO guarantee; trust signal taxonomy makes compliance status visible at a glance"},"startLine":21,"endLine":26,"inBiz42Fence":true},{"kind":"prose","text":"","line":28},{"kind":"heading","level":2,"text":"Tool invisibility","line":29},{"kind":"prose","text":"","line":30},{"kind":"prose","text":"Genuinely effective educational tools are created by engaged individuals, shared briefly on social media or at barcamps, and then vanish. There is no registry, no canonical URL, no fork lineage — the community's creative output is structurally invisible and unreusable. Likelihood is certain (already observed); impact is high as it means the ecosystem never compounds.","line":31},{"kind":"prose","text":"","line":32},{"kind":"block","blockType":"risk","attributes":{"id":"risk-invisibility","title":"Community-built tools are structurally invisible and unrecoverable","severity":"high","mitigation":"solution registry with PR-based contributions gives every tool a permanent, findable, linkable entry"},"startLine":34,"endLine":39,"inBiz42Fence":true},{"kind":"prose","text":"","line":41},{"kind":"heading","level":2,"text":"Unsafe adoption driven by teacher isolation","line":42},{"kind":"prose","text":"","line":43},{"kind":"prose","text":"When teachers cannot find safe, vetted tools through official channels, they resort to whatever they find informally — often passive content platforms or tools with unclear data practices. This is not a knowledge failure; it is a structural gap in the ecosystem that lernapps.net is positioned to fill. Likelihood is high (already observed); impact is medium — harmful to individual teachers but not existential for lernapps.net.","line":44},{"kind":"prose","text":"","line":45},{"kind":"block","blockType":"risk","attributes":{"id":"risk-unsafe-adoption","title":"Teachers adopt unsafe or pedagogically passive tools by default","severity":"high","mitigation":"solution registry with active/passive taxonomy and DSGVO signals gives teachers a fast, trustworthy alternative discovery path"},"startLine":47,"endLine":52,"inBiz42Fence":true},{"kind":"prose","text":"","line":54},{"kind":"heading","level":2,"text":"Endorsement reputation risk","line":55},{"kind":"prose","text":"","line":56},{"kind":"prose","text":"If lernapps.net lists or highlights a tool that later proves harmful — to student data, pedagogical outcomes, or community trust — it risks becoming associated with the failure, undermining the credibility of the entire platform. Likelihood is low in the short term; impact is medium.","line":57},{"kind":"prose","text":"","line":58},{"kind":"ignore","ruleCode":"H005","reason":"risk-endorsement is an internally-inferred reputational risk with no single external signal — accepted as a known gap","startLine":60,"endLine":61},{"kind":"prose","text":"","line":62},{"kind":"block","blockType":"risk","attributes":{"id":"risk-endorsement","title":"Reputational risk from endorsing a tool that later proves harmful","severity":"medium","mitigation":"progressive trust model (anecdotal → community-validated → research-backed) distributes responsibility; no single authority endorses tools"},"startLine":63,"endLine":68,"inBiz42Fence":true},{"kind":"prose","text":"","line":70},{"kind":"heading","level":2,"text":"Creators have little reason to contribute","line":71},{"kind":"prose","text":"","line":72},{"kind":"prose","text":"Creators build their apps as personal software for their own class or child, with or without lernapps.net. That others use their app is only a nice-to-have for them. So the supply of apps does not come by itself: if contributing costs effort, few creators will do it, and adults find too little to come back. Once an app is used, however, praise and use motivate most engaged creators strongly; the hurdle is the first contribution. Identified in the platform design (pdt42 D4, 2026-09-30).","line":73},{"kind":"prose","text":"","line":74},{"kind":"block","blockType":"risk","attributes":{"id":"risk-weak-supply","title":"Creators have little reason to contribute their apps","severity":"high","mitigation":"make listing an app almost effortless, offer creators a benefit independent of reach such as better guidance when building, and make use and praise visible to creators once their app is used"},"startLine":76,"endLine":81,"inBiz42Fence":true},{"kind":"prose","text":"","line":83}]},{"filePath":"/home/runner/work/docs/docs/docs/biz42/ch05-opportunities.biz42.md","nodes":[{"kind":"heading","level":1,"text":"Chapter 5: Opportunities","line":1},{"kind":"prose","text":"","line":2},{"kind":"heading","level":2,"text":"PISA political window","line":3},{"kind":"prose","text":"","line":4},{"kind":"prose","text":"The PISA 2026 results have opened a rare political window where politicians, media, school leadership, and teachers are simultaneously motivated to act on digital education. lernapps.net can establish itself as the credible coordination layer before this window closes.","line":5},{"kind":"prose","text":"","line":6},{"kind":"block","blockType":"opportunity","attributes":{"id":"opp-pisa-window","title":"PISA 2026 political moment creates demand for ecosystem coordination"},"startLine":8,"endLine":11,"inBiz42Fence":true},{"kind":"prose","text":"","line":13},{"kind":"heading","level":2,"text":"AI-assisted community creation","line":14},{"kind":"prose","text":"","line":15},{"kind":"prose","text":"AI-assisted development means motivated teachers and developers can build working educational prototypes in a weekend. lernapps.net can capture this creative energy by providing the capability map, scaffolding, and registry that turn individual experiments into ecosystem contributions.","line":16},{"kind":"prose","text":"","line":17},{"kind":"block","blockType":"opportunity","attributes":{"id":"opp-ai-creation","title":"AI-assisted dev enables rapid community tool creation at scale"},"startLine":19,"endLine":22,"inBiz42Fence":true},{"kind":"prose","text":"","line":24},{"kind":"heading","level":2,"text":"Frontend-only DSGVO framing","line":25},{"kind":"prose","text":"","line":26},{"kind":"prose","text":"Tools that run entirely in the browser with no backend are structurally incapable of exfiltrating student data — yet this framing does not yet exist in the school adoption conversation. lernapps.net can pioneer a \"frontend-only = DSGVO-safe by design\" badge that unlocks immediate classroom adoption without bureaucratic review.","line":27},{"kind":"prose","text":"","line":28},{"kind":"block","blockType":"opportunity","attributes":{"id":"opp-dsgvo-framing","title":"Frontend-only badge unlocks school adoption without procurement review"},"startLine":30,"endLine":33,"inBiz42Fence":true},{"kind":"prose","text":"","line":35}]},{"filePath":"/home/runner/work/docs/docs/docs/biz42/ch06-objectives.biz42.md","nodes":[{"kind":"heading","level":1,"text":"Chapter 6: Objectives","line":1},{"kind":"prose","text":"","line":2},{"kind":"heading","level":2,"text":"Establish the narrative and positioning","line":3},{"kind":"prose","text":"","line":4},{"kind":"prose","text":"lernapps.net's first obligation is to make clear what it is and what it is not. Without a sharp, credible narrative, contributors won't submit tools, teachers won't trust the registry, and the PISA political window closes before the platform has established itself. This objective addresses the risks of invisibility and unsafe adoption by establishing a trustworthy public identity.","line":5},{"kind":"prose","text":"","line":6},{"kind":"block","blockType":"objective","attributes":{"id":"obj-narrative","title":"Establish clear public narrative — what lernapps.net is and is not","addresses":"risk-invisibility, risk-unsafe-adoption, opp-pisa-window","measured-by":"measure-landing-engagement","owner":"owner-platform","requires":"cap-communication"},"startLine":8,"endLine":15,"inBiz42Fence":true},{"kind":"prose","text":"","line":17},{"kind":"heading","level":2,"text":"Publish a live capability inventory","line":18},{"kind":"prose","text":"","line":19},{"kind":"prose","text":"The capability map is the strategic core of lernapps.net. Without it, the registry is just a list. With it, gaps become visible build opportunities, contributors can position their work, and school coordinators can assess coverage. This directly addresses island proliferation by providing the coordination vocabulary.","line":20},{"kind":"prose","text":"","line":21},{"kind":"block","blockType":"objective","attributes":{"id":"obj-capability-map","title":"Publish a live KMK-aligned capability inventory with coverage status","addresses":"risk-island, risk-invisibility, opp-pisa-window","measured-by":"measure-capability-coverage","owner":"owner-platform","requires":"cap-capability-mapping, cap-registry-ops"},"startLine":23,"endLine":30,"inBiz42Fence":true},{"kind":"prose","text":"","line":32},{"kind":"heading","level":2,"text":"Curate a high-quality set of first registry entries","line":33},{"kind":"prose","text":"","line":34},{"kind":"prose","text":"The registry needs enough high-quality, DSGVO-safe, active-learning-focused entries to be useful on day one. A sparse registry drives teachers back to passive platforms. This objective seeds the trust flywheel and demonstrates the value of the capability map in practice.","line":35},{"kind":"prose","text":"","line":36},{"kind":"block","blockType":"objective","attributes":{"id":"obj-first-apps","title":"Curate a high-quality initial set of registry entries","addresses":"risk-dsgvo, risk-unsafe-adoption, opp-dsgvo-framing","measured-by":"measure-registry-entries","owner":"owner-platform","requires":"cap-curation, cap-registry-ops"},"startLine":38,"endLine":45,"inBiz42Fence":true},{"kind":"prose","text":"","line":47},{"kind":"heading","level":2,"text":"Provide agent guidance for rapid ecosystem-connected development","line":48},{"kind":"prose","text":"","line":49},{"kind":"prose","text":"The scaffolding layer — architecture guidelines, starter templates, AI-assisted creation flow — enables contributors to build new tools that are ecosystem-connected from day one rather than reinvented from scratch. This captures the AI-assisted creation opportunity and prevents future island proliferation.","line":50},{"kind":"prose","text":"","line":51},{"kind":"block","blockType":"objective","attributes":{"id":"obj-agent-guidance","title":"Provide scaffolding and agent guidance for ecosystem-connected tool creation","addresses":"risk-island, risk-weak-supply, opp-ai-creation","measured-by":"measure-scaffold-usage","owner":"owner-platform","requires":"cap-scaffolding, cap-capability-mapping"},"startLine":53,"endLine":60,"inBiz42Fence":true},{"kind":"prose","text":"","line":62},{"kind":"heading","level":2,"text":"Protect platform credibility through progressive trust","line":63},{"kind":"prose","text":"","line":64},{"kind":"prose","text":"As the registry grows, lernapps.net must not become a source of harmful tool recommendations. The progressive trust model (anecdotal → community-validated → research-backed) and DSGVO signal taxonomy must be operational and visible before growth accelerates.","line":65},{"kind":"prose","text":"","line":66},{"kind":"block","blockType":"objective","attributes":{"id":"obj-trust-model","title":"Operate a progressive trust model that protects platform credibility","addresses":"risk-endorsement, risk-dsgvo","measured-by":"measure-trust-signals","owner":"owner-platform","requires":"cap-curation, cap-registry-ops"},"startLine":68,"endLine":75,"inBiz42Fence":true},{"kind":"prose","text":"","line":77}]},{"filePath":"/home/runner/work/docs/docs/docs/biz42/ch07-measures.biz42.md","nodes":[{"kind":"heading","level":1,"text":"Chapter 7: Measures","line":1},{"kind":"prose","text":"","line":2},{"kind":"heading","level":2,"text":"Landing page engagement","line":3},{"kind":"prose","text":"","line":4},{"kind":"prose","text":"The landing page is the first test of whether the narrative lands. Engagement signals — unique visitors, time on page, and newsletter or community sign-ups — indicate whether the story resonates with the target audience during the PISA political window.","line":5},{"kind":"prose","text":"","line":6},{"kind":"block","blockType":"measure","attributes":{"id":"measure-landing-engagement","title":"Landing page engagement and community sign-ups","target":"500 unique visitors and 100 sign-ups within 60 days of launch"},"startLine":8,"endLine":12,"inBiz42Fence":true},{"kind":"prose","text":"","line":14},{"kind":"heading","level":2,"text":"Capability map coverage","line":15},{"kind":"prose","text":"","line":16},{"kind":"prose","text":"The capability map must cover all six KMK Kompetenzrahmen domains with at least one capability node per domain, and surface genuine gaps as explicit build opportunities. Coverage breadth and the number of `needed` nodes published as open contributions are the leading indicators.","line":17},{"kind":"prose","text":"","line":18},{"kind":"block","blockType":"measure","attributes":{"id":"measure-capability-coverage","title":"KMK capability map coverage — domains covered and gap nodes published","target":"All 6 KMK domains covered with at least 3 capability nodes each; at least 10 gap nodes marked as build opportunities"},"startLine":20,"endLine":24,"inBiz42Fence":true},{"kind":"prose","text":"","line":26},{"kind":"heading","level":2,"text":"Registry entry count and quality","line":27},{"kind":"prose","text":"","line":28},{"kind":"prose","text":"The registry must reach a critical mass of high-quality, DSGVO-safe, active-learning-focused entries to be useful as a discovery tool. Both quantity and quality signals (DSGVO status, active/passive classification populated) are tracked.","line":29},{"kind":"prose","text":"","line":30},{"kind":"block","blockType":"measure","attributes":{"id":"measure-registry-entries","title":"Number of registry entries with DSGVO and active/passive signals populated","target":"20 entries at launch, all with DSGVO status and active/passive level populated"},"startLine":32,"endLine":36,"inBiz42Fence":true},{"kind":"prose","text":"","line":38},{"kind":"heading","level":2,"text":"Scaffolding and agent guidance usage","line":39},{"kind":"prose","text":"","line":40},{"kind":"prose","text":"Once the scaffolding layer is published, uptake by contributors — measured as new tool submissions that cite lernapps.net architecture or use starter templates — indicates whether the guidance is actually reducing friction.","line":41},{"kind":"prose","text":"","line":42},{"kind":"block","blockType":"measure","attributes":{"id":"measure-scaffold-usage","title":"New tool submissions using lernapps.net scaffolding or referencing capability map gaps","target":"5 submissions citing capability map gap within 90 days of scaffolding layer launch"},"startLine":44,"endLine":48,"inBiz42Fence":true},{"kind":"prose","text":"","line":50},{"kind":"heading","level":2,"text":"Trust signal adoption","line":51},{"kind":"prose","text":"","line":52},{"kind":"prose","text":"The progressive trust model is effective only if community members actually provide \"I tried this\" feedback and if DSGVO signals are populated. The share of entries with at least `community-validated` evidence level is the key quality signal.","line":53},{"kind":"prose","text":"","line":54},{"kind":"block","blockType":"measure","attributes":{"id":"measure-trust-signals","title":"Share of registry entries with community-validated or higher evidence level","target":"30% of registry entries reach community-validated within 6 months of launch"},"startLine":56,"endLine":60,"inBiz42Fence":true},{"kind":"prose","text":"","line":62}]},{"filePath":"/home/runner/work/docs/docs/docs/biz42/ch08-owners.biz42.md","nodes":[{"kind":"heading","level":1,"text":"Chapter 8: Owners","line":1},{"kind":"prose","text":"","line":2},{"kind":"heading","level":2,"text":"Platform owner","line":3},{"kind":"prose","text":"","line":4},{"kind":"prose","text":"Oliver Jägle is accountable for the platform: all strategic objectives and products. Ralf D. Müller, the author of the Mathe-Karte, focuses on the apps themselves, such as the Mathe-Karte, and does not take part in the platform. App repositories belong to their authors. There is no registered legal entity yet; if the platform takes off, it could become a registered association (Verein), so that it belongs to those who fill it with life. How decisions are made is described in [GOVERNANCE.md](https://github.com/lernapps/.github/blob/main/GOVERNANCE.md); it still describes two owners with equal rights and is to be updated to the sole owner.","line":5},{"kind":"prose","text":"","line":6},{"kind":"block","blockType":"owner","attributes":{"id":"owner-platform","title":"Platform owner (Oliver Jägle)"},"startLine":8,"endLine":11,"inBiz42Fence":true},{"kind":"prose","text":"","line":13}]},{"filePath":"/home/runner/work/docs/docs/docs/biz42/ch09-capabilities.biz42.md","nodes":[{"kind":"heading","level":1,"text":"Chapter 9: Capabilities","line":1},{"kind":"prose","text":"","line":2},{"kind":"heading","level":2,"text":"Strategic communication","line":3},{"kind":"prose","text":"","line":4},{"kind":"prose","text":"The ability to articulate what lernapps.net is and is not — in plain language that resonates with teachers, builders, researchers, and policy audiences — across the landing page, documentation, and community channels.","line":5},{"kind":"prose","text":"","line":6},{"kind":"block","blockType":"capability","attributes":{"id":"cap-communication","title":"Strategic communication — narrative and positioning","status":"exists","enables":"prod-landing-page"},"startLine":8,"endLine":13,"inBiz42Fence":true},{"kind":"prose","text":"","line":15},{"kind":"heading","level":2,"text":"Capability mapping","line":16},{"kind":"prose","text":"","line":17},{"kind":"prose","text":"The ability to maintain a living map of educational capabilities aligned to the KMK Kompetenzrahmen — tracking what exists, what is missing, and what is partially covered — and to keep that map current as the community evolves.","line":18},{"kind":"prose","text":"","line":19},{"kind":"block","blockType":"capability","attributes":{"id":"cap-capability-mapping","title":"Capability mapping against KMK Kompetenzrahmen","status":"planned","enables":"prod-capability-map"},"startLine":21,"endLine":26,"inBiz42Fence":true},{"kind":"prose","text":"","line":28},{"kind":"heading","level":2,"text":"Registry operations","line":29},{"kind":"prose","text":"","line":30},{"kind":"prose","text":"The ability to accept, validate, and publish community tool submissions via a GitHub PR workflow with schema validation, CI checks, and clear contribution documentation.","line":31},{"kind":"prose","text":"","line":32},{"kind":"block","blockType":"capability","attributes":{"id":"cap-registry-ops","title":"Registry operations — contribution workflow and schema validation","status":"planned","enables":"prod-registry"},"startLine":34,"endLine":39,"inBiz42Fence":true},{"kind":"prose","text":"","line":41},{"kind":"heading","level":2,"text":"Curation and trust signalling","line":42},{"kind":"prose","text":"","line":43},{"kind":"prose","text":"The ability to assess submissions against the active/passive taxonomy and DSGVO signal framework, assign initial evidence levels, and surface community validation signals as the registry matures.","line":44},{"kind":"prose","text":"","line":45},{"kind":"block","blockType":"capability","attributes":{"id":"cap-curation","title":"Curation — active/passive taxonomy and DSGVO trust signal assignment","status":"planned","enables":"prod-registry"},"startLine":47,"endLine":52,"inBiz42Fence":true},{"kind":"prose","text":"","line":54},{"kind":"heading","level":2,"text":"Scaffolding and agent guidance","line":55},{"kind":"prose","text":"","line":56},{"kind":"prose","text":"The ability to publish architecture guidelines, starter templates, and AI-assisted creation flows that allow contributors to build ecosystem-connected tools starting from a capability map gap rather than a blank page.","line":57},{"kind":"prose","text":"","line":58},{"kind":"block","blockType":"capability","attributes":{"id":"cap-scaffolding","title":"Scaffolding — architecture guidelines and AI-assisted creation flow","status":"gap","enables":"prod-scaffolding"},"startLine":60,"endLine":65,"inBiz42Fence":true},{"kind":"prose","text":"","line":67}]},{"filePath":"/home/runner/work/docs/docs/docs/biz42/ch10-products.biz42.md","nodes":[{"kind":"heading","level":1,"text":"Chapter 10: Products and Services","line":1},{"kind":"prose","text":"","line":2},{"kind":"heading","level":2,"text":"Landing page","line":3},{"kind":"prose","text":"","line":4},{"kind":"prose","text":"The narrative entry point for all personas — contributors, adopters, navigators, researchers. It communicates the value proposition clearly, directs each stakeholder to the right next step, and establishes lernapps.net's credibility during the PISA political window.","line":5},{"kind":"prose","text":"","line":6},{"kind":"block","blockType":"product","attributes":{"id":"prod-landing-page","title":"Landing page — narrative entry point for all personas","fulfills":"exp-contributor, exp-adopter, exp-navigator, exp-signal-reader","owner":"owner-platform"},"startLine":8,"endLine":13,"inBiz42Fence":true},{"kind":"prose","text":"","line":15},{"kind":"heading","level":2,"text":"Capability map","line":16},{"kind":"prose","text":"","line":17},{"kind":"prose","text":"A publicly accessible, living map of educational capabilities organised by the six KMK Kompetenzrahmen domains. Each capability node carries a coverage status (`needed`, `partial`, `well-covered`). Gap nodes are surfaced as explicit build invitations for contributors. This is the strategic core that differentiates lernapps.net from a plain tool list.","line":18},{"kind":"prose","text":"","line":19},{"kind":"block","blockType":"product","attributes":{"id":"prod-capability-map","title":"Capability map — KMK-aligned living inventory of educational capabilities","fulfills":"exp-navigator, exp-signal-reader, exp-contributor","owner":"owner-platform"},"startLine":21,"endLine":26,"inBiz42Fence":true},{"kind":"prose","text":"","line":28},{"kind":"heading","level":2,"text":"Solution registry","line":29},{"kind":"prose","text":"","line":30},{"kind":"prose","text":"A structured, filterable catalog of community-built educational tools. Every entry is linked to capability nodes, carries DSGVO status, active/passive classification, and an evidence level. Contributions are submitted as GitHub Pull Requests with automated schema validation.","line":31},{"kind":"prose","text":"","line":32},{"kind":"block","blockType":"product","attributes":{"id":"prod-registry","title":"Solution registry — structured, trusted catalog of community-built tools","fulfills":"exp-adopter, exp-contributor, exp-navigator, exp-maintainer","owner":"owner-platform"},"startLine":34,"endLine":39,"inBiz42Fence":true},{"kind":"prose","text":"","line":41},{"kind":"heading","level":2,"text":"Scaffolding layer","line":42},{"kind":"prose","text":"","line":43},{"kind":"prose","text":"Architecture guidelines, starter templates, and an AI-assisted creation flow that allows contributors to build new tools starting from a capability map gap. Ensures new tools are ecosystem-connected rather than reinvented from scratch.","line":44},{"kind":"prose","text":"","line":45},{"kind":"block","blockType":"product","attributes":{"id":"prod-scaffolding","title":"Scaffolding layer — architecture guidelines and AI-assisted creation flow","fulfills":"exp-contributor, exp-oss-contributor","owner":"owner-platform"},"startLine":47,"endLine":52,"inBiz42Fence":true},{"kind":"prose","text":"","line":54}]},{"filePath":"/home/runner/work/docs/docs/docs/biz42/ch11-evaluation.biz42.md","nodes":[{"kind":"heading","level":1,"text":"Chapter 11: Evaluation","line":1},{"kind":"prose","text":"","line":2},{"kind":"heading","level":2,"text":"Monthly landing page review","line":3},{"kind":"prose","text":"","line":4},{"kind":"prose","text":"The founding team reviews landing page engagement metrics monthly to determine whether the narrative is resonating and whether the PISA political window is being used effectively. Findings feed directly into narrative and positioning adjustments.","line":5},{"kind":"prose","text":"","line":6},{"kind":"block","blockType":"evaluation","attributes":{"id":"eval-landing-review","title":"Monthly landing page and community growth review","evaluates":"measure-landing-engagement"},"startLine":8,"endLine":12,"inBiz42Fence":true},{"kind":"prose","text":"","line":14},{"kind":"heading","level":2,"text":"Quarterly capability map and registry review","line":15},{"kind":"prose","text":"","line":16},{"kind":"prose","text":"Every quarter the founding team reviews capability map coverage and registry entry quality — checking whether KMK domains are covered, whether gap nodes are being claimed, and whether new entries meet the DSGVO and active/passive quality bar.","line":17},{"kind":"prose","text":"","line":18},{"kind":"block","blockType":"evaluation","attributes":{"id":"eval-registry-review","title":"Quarterly capability map coverage and registry quality review","evaluates":"measure-capability-coverage, measure-registry-entries, measure-trust-signals"},"startLine":20,"endLine":24,"inBiz42Fence":true},{"kind":"prose","text":"","line":26},{"kind":"heading","level":2,"text":"Quarterly scaffolding uptake review","line":27},{"kind":"prose","text":"","line":28},{"kind":"prose","text":"Once the scaffolding layer is live, the team reviews whether new contributions are being made from capability map gaps and whether the AI-assisted creation flow reduces friction. This evaluation triggers improvements to the scaffolding documentation and templates.","line":29},{"kind":"prose","text":"","line":30},{"kind":"block","blockType":"evaluation","attributes":{"id":"eval-scaffold-review","title":"Quarterly scaffolding uptake and contributor friction review","evaluates":"measure-scaffold-usage"},"startLine":32,"endLine":36,"inBiz42Fence":true},{"kind":"prose","text":"","line":38}]},{"filePath":"/home/runner/work/docs/docs/docs/biz42/ch12-improvements.biz42.md","nodes":[{"kind":"heading","level":1,"text":"Chapter 12: Improvements","line":1},{"kind":"prose","text":"","line":2},{"kind":"heading","level":2,"text":"Phase 0 — Launch landing page","line":3},{"kind":"prose","text":"","line":4},{"kind":"prose","text":"The landing page is the first concrete delivery. It validates the narrative before infrastructure is built, generates community signal during the PISA political window, and establishes the public URL and identity that subsequent phases build on.","line":5},{"kind":"prose","text":"","line":6},{"kind":"block","blockType":"improvement","attributes":{"id":"imp-landing","title":"Launch landing page to validate narrative and capture PISA-window interest","type":"innovative","addresses":"obj-narrative","triggered-by":"eval-landing-review"},"startLine":8,"endLine":14,"inBiz42Fence":true},{"kind":"prose","text":"","line":16},{"kind":"heading","level":2,"text":"Phase 1 — Launch static capability map and registry","line":17},{"kind":"prose","text":"","line":18},{"kind":"prose","text":"The static registry with capability map, client-side discovery, and GitHub PR contribution workflow is the minimum viable coordination layer. This phase turns the narrative promise into a working product.","line":19},{"kind":"prose","text":"","line":20},{"kind":"block","blockType":"improvement","attributes":{"id":"imp-registry","title":"Launch static capability map and solution registry with PR contribution workflow","type":"innovative","addresses":"obj-capability-map, obj-first-apps, obj-trust-model","triggered-by":"eval-registry-review"},"startLine":22,"endLine":28,"inBiz42Fence":true},{"kind":"prose","text":"","line":30},{"kind":"heading","level":2,"text":"Phase 2 — Launch scaffolding and agent guidance layer","line":31},{"kind":"prose","text":"","line":32},{"kind":"prose","text":"The scaffolding layer — architecture guidelines, starter templates, and AI-assisted creation flow connected to the capability map — captures the AI-assisted development opportunity and closes the island proliferation risk by ensuring new tools are ecosystem-connected from day one.","line":33},{"kind":"prose","text":"","line":34},{"kind":"block","blockType":"improvement","attributes":{"id":"imp-scaffolding","title":"Launch scaffolding layer with architecture guidelines and AI-assisted creation flow","type":"innovative","addresses":"obj-agent-guidance","triggered-by":"eval-scaffold-review"},"startLine":36,"endLine":42,"inBiz42Fence":true},{"kind":"prose","text":"","line":44}]}],"diagrams":[],"ignoreDirectives":[{"ruleCode":"H005","reason":"risk-endorsement is an internally-inferred reputational risk with no single external signal — accepted as a known gap","file":"/home/runner/work/docs/docs/docs/biz42/ch04-risks.biz42.md","line":60,"used":false}]};</script>
