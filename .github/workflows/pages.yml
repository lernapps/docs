name: Pages

# Builds the site into _site/, checks it, and on main publishes it to the gh-pages branch, which GitHub Pages
# serves at https://lernapps.net/docs/. The same for every lernapps.net site: the steps are the shared
# actions in lernapps/tooling (npm ci, npm run build, npm run check; deploy to gh-pages without touching
# the previews). Renovate bumps the pinned commits.
#
# The change scope (lernapps/tooling changes.yml) gates the jobs: a change of only the plan (.vibe/**) runs nothing;
# docs (docs/**/*.md) and anything else build, check and deploy the site. The job `site` always runs and reports the
# result: the required check, which never stays "Pending".
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    uses: lernapps/tooling/.github/workflows/changes.yml@204d7ac87338a1ec21676a7d997234e1d3cc23a4 # main
    with:
      tooling-ref: 204d7ac87338a1ec21676a7d997234e1d3cc23a4 # the classifier of the same commit

  build: # builds and checks the site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: lernapps/tooling/actions/site-check@204d7ac87338a1ec21676a7d997234e1d3cc23a4 # main

  deploy:
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.site == 'true'
    needs: [changes, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lernapps/tooling/actions/site-deploy@204d7ac87338a1ec21676a7d997234e1d3cc23a4 # main

  site: # required status check: always runs, fails when a job above failed or was cancelled
    needs: [changes, build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "the jobs ended: $RESULTS"
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac
