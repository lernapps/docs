  <head>
    <meta charset="UTF-8" /><script>window.__WORKSPACE__={"name":"lernapps.net","documents":[{"filePath":"1-exploration/e1-arenas.pdt42.md","title":"Identify the ecosystem and its arenas","steps":["E1","E4"],"nodes":[{"kind":"heading","level":1,"text":"Identify the ecosystem and its arenas","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":""},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-arena-scan","canvas":"arena-scan"},"startLine":4,"endLine":7,"inPdt42Fence":true},{"kind":"prose","text":"","line":9,"renderedHtml":"\u003cp>\u003cem>The arenas form a pure sequence, following one app from need to evolution. No enabling arenas are mapped. The enabling plays lernapps.net wants to perform come later, in the value chain (E5) and the Platform Plays (E6).\u003c/em>\u003c/p>\n"},{"kind":"prose","text":"*The arenas form a pure sequence, following one app from need to evolution. No enabling arenas are mapped. The enabling plays lernapps.net wants to perform come later, in the value chain (E5) and the Platform Plays (E6).*","line":10,"renderedHtml":""},{"kind":"prose","text":"","line":11,"renderedHtml":""},{"kind":"heading","level":2,"text":"Small, active-learning educational apps","line":12},{"kind":"prose","text":"","line":13,"renderedHtml":"\u003cp>The ecosystem consists of apps that are not only pedagogically valuable but have an explicit educational focus and promote active engagement by students. Many platforms are rather passive (e.g. Serlo) or focus on learning paths (e.g. Khan Academy). This ecosystem centres on small apps, each focused on teaching one aspect or a few closely related ones.\u003c/p>\n\u003cp>Value is created bottom-up today, but it does not compound. A teacher or parent notices a gap they want to close with an app — whether it is a real gap or existing solutions just don&#39;t fit does not matter. This engaged person builds an app with AI tools. It usually looks very individual: every tool follows its own principles, frameworks and so on. Then the app is used exactly once and rots afterwards.\u003c/p>\n\u003cp>The ecosystem already exists, but it has so far been shaped mostly top-down: ministries set up funding programmes, commission agencies or companies, receive the results and distribute them to schools — where they get stuck, because implementing large solutions in schools is hard. \u003cstrong>We deliberately leave ministries, funding programmes and commissioned agencies out as actors of this design\u003c/strong>: involving them would slow everything down. The top-down chain is the reason the ecosystem under-performs, not a route we act on.\u003c/p>\n\u003cp>We want creators to recognise existing solutions and gaps, build similar apps quickly and efficiently using guidelines for their agents, make them easily available to third parties who can use them without doubt about their fitness for use, and suggest extensions or contribute easily.\u003c/p>\n"},{"kind":"prose","text":"The ecosystem consists of apps that are not only pedagogically valuable but have an explicit educational focus and promote active engagement by students. Many platforms are rather passive (e.g. Serlo) or focus on learning paths (e.g. Khan Academy). This ecosystem centres on small apps, each focused on teaching one aspect or a few closely related ones.","line":14,"renderedHtml":""},{"kind":"prose","text":"","line":15,"renderedHtml":""},{"kind":"prose","text":"Value is created bottom-up today, but it does not compound. A teacher or parent notices a gap they want to close with an app — whether it is a real gap or existing solutions just don't fit does not matter. This engaged person builds an app with AI tools. It usually looks very individual: every tool follows its own principles, frameworks and so on. Then the app is used exactly once and rots afterwards.","line":16,"renderedHtml":""},{"kind":"prose","text":"","line":17,"renderedHtml":""},{"kind":"prose","text":"The ecosystem already exists, but it has so far been shaped mostly top-down: ministries set up funding programmes, commission agencies or companies, receive the results and distribute them to schools — where they get stuck, because implementing large solutions in schools is hard. **We deliberately leave ministries, funding programmes and commissioned agencies out as actors of this design**: involving them would slow everything down. The top-down chain is the reason the ecosystem under-performs, not a route we act on.","line":18,"renderedHtml":""},{"kind":"prose","text":"","line":19,"renderedHtml":""},{"kind":"prose","text":"We want creators to recognise existing solutions and gaps, build similar apps quickly and efficiently using guidelines for their agents, make them easily available to third parties who can use them without doubt about their fitness for use, and suggest extensions or contribute easily.","line":20,"renderedHtml":""},{"kind":"prose","text":"","line":21,"renderedHtml":""},{"kind":"block","blockType":"ecosystem","attributes":{"id":"eco-edu-apps","title":"Small, active-learning educational apps","context":"ecosystem-mobilization"},"startLine":23,"endLine":27,"inPdt42Fence":true},{"kind":"prose","text":"","line":29,"renderedHtml":""},{"kind":"heading","level":2,"text":"Spotting a need","line":30},{"kind":"prose","text":"","line":31,"renderedHtml":"\u003cp>A teacher or parent notices a gap they want to close with an app. Gaps are usually whole apps, not feature requests for an existing one. Today, whether a gap is real or existing solutions just don&#39;t fit remains unclear; we want existing solutions and gaps to be recognisable.\u003c/p>\n"},{"kind":"prose","text":"A teacher or parent notices a gap they want to close with an app. Gaps are usually whole apps, not feature requests for an existing one. Today, whether a gap is real or existing solutions just don't fit remains unclear; we want existing solutions and gaps to be recognisable.","line":32,"renderedHtml":""},{"kind":"prose","text":"","line":33,"renderedHtml":""},{"kind":"block","blockType":"arena","attributes":{"id":"ar-spotting","title":"Spotting a need","outcome":"Existing solutions and gaps are recognisable","focus":"no"},"startLine":35,"endLine":40,"inPdt42Fence":true},{"kind":"prose","text":"","line":42,"renderedHtml":""},{"kind":"heading","level":2,"text":"Building the app","line":43},{"kind":"prose","text":"","line":44,"renderedHtml":"\u003cp>Today every app is built individually, following its own principles and frameworks. With guidelines for their agents, creators should be able to build similar apps quickly and efficiently.\u003c/p>\n"},{"kind":"prose","text":"Today every app is built individually, following its own principles and frameworks. With guidelines for their agents, creators should be able to build similar apps quickly and efficiently.","line":45,"renderedHtml":""},{"kind":"prose","text":"","line":46,"renderedHtml":""},{"kind":"block","blockType":"arena","attributes":{"id":"ar-building","title":"Building the app","outcome":"Similar apps are built quickly and efficiently using agent guidelines","after":"ar-spotting","focus":"no"},"startLine":48,"endLine":54,"inPdt42Fence":true},{"kind":"prose","text":"","line":56,"renderedHtml":""},{"kind":"heading","level":2,"text":"Getting apps into use","line":57},{"kind":"prose","text":"","line":58,"renderedHtml":"\u003cp>The core we tackle first. Making an app available and using it are considered one arena: the outcome — an app reaching a classroom it was not built for — only exists jointly, and the entities involved overlap almost completely. Third parties are mostly other adults who come across the offering, browse it and show the apps to their students; students who know an app may return and look for content themselves. Fitness for use mainly means privacy, but also the lowest possible barriers to use: no installation, no sign-up.\u003c/p>\n"},{"kind":"prose","text":"The core we tackle first. Making an app available and using it are considered one arena: the outcome — an app reaching a classroom it was not built for — only exists jointly, and the entities involved overlap almost completely. Third parties are mostly other adults who come across the offering, browse it and show the apps to their students; students who know an app may return and look for content themselves. Fitness for use mainly means privacy, but also the lowest possible barriers to use: no installation, no sign-up.","line":59,"renderedHtml":""},{"kind":"prose","text":"","line":60,"renderedHtml":""},{"kind":"block","blockType":"arena","attributes":{"id":"ar-into-use","title":"Getting apps into use","outcome":"An app is used without doubt about its fitness for use, beyond the person who built it","after":"ar-building","focus":"yes","steps":""},"lists":{"steps":["Make the app available","Adults come across the offering and browse it","Judge fitness for use (privacy, no installation, no sign-up)","Show the app to students","Students return and look for content themselves"]},"startLine":62,"endLine":74,"inPdt42Fence":true},{"kind":"prose","text":"","line":76,"renderedHtml":""},{"kind":"heading","level":2,"text":"Evolving the app","line":77},{"kind":"prose","text":"","line":78,"renderedHtml":"\u003cp>Instead of rotting after a single use, apps are developed further: both users and other creators suggest extensions or contribute. The sequence is deliberately linear — evolving an app does not feed back into spotting a need, because gaps are usually whole apps rather than feature requests.\u003c/p>\n"},{"kind":"prose","text":"Instead of rotting after a single use, apps are developed further: both users and other creators suggest extensions or contribute. The sequence is deliberately linear — evolving an app does not feed back into spotting a need, because gaps are usually whole apps rather than feature requests.","line":79,"renderedHtml":""},{"kind":"prose","text":"","line":80,"renderedHtml":""},{"kind":"block","blockType":"arena","attributes":{"id":"ar-evolving","title":"Evolving the app","outcome":"Users and creators suggest extensions or contribute, so the app does not rot","after":"ar-into-use","focus":"no"},"startLine":82,"endLine":88,"inPdt42Fence":true},{"kind":"prose","text":"","line":90,"renderedHtml":""}]},{"filePath":"1-exploration/e2-scan.pdt42.md","title":"Scan the ecosystem","steps":["E2"],"nodes":[{"kind":"heading","level":1,"text":"Scan the ecosystem","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":""},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-ecosystem-scan","canvas":"ecosystem-scan"},"startLine":4,"endLine":7,"inPdt42Fence":true},{"kind":"prose","text":"","line":9,"renderedHtml":"\u003cp>This scan covers the focus arena &quot;Getting apps into use&quot; as it works today, without lernapps.net. Jobs are phrased by their outcome; how they are done today is described in the prose. The picture is based on the platform owner&#39;s own observations and has not yet been validated with other ecosystem representatives.\u003c/p>\n"},{"kind":"prose","text":"This scan covers the focus arena \"Getting apps into use\" as it works today, without lernapps.net. Jobs are phrased by their outcome; how they are done today is described in the prose. The picture is based on the platform owner's own observations and has not yet been validated with other ecosystem representatives.","line":10,"renderedHtml":""},{"kind":"prose","text":"","line":11,"renderedHtml":""},{"kind":"heading","level":2,"text":"Entities","line":12},{"kind":"prose","text":"","line":13,"renderedHtml":"\u003cp>The entities taking part in the focus arena. Their home is this chapter: later steps fill them in here, D1 with their platform roles and D2 with their portraits.\u003c/p>\n\u003cp>Six entity-roles stand in the peer spectrum, one more than PDT recommends. They are kept on purpose: app creators, adopting adults and students form the core, teacher platforms are a channel (E12), AI assistants are what the platform has to design for, and social media is kept although little potential is expected from it. GitHub has no platform role: it is a means of production, part of the platform&#39;s infrastructure (D1).\u003c/p>\n"},{"kind":"prose","text":"The entities taking part in the focus arena. Their home is this chapter: later steps fill them in here, D1 with their platform roles and D2 with their portraits.","line":14,"renderedHtml":""},{"kind":"prose","text":"","line":15,"renderedHtml":""},{"kind":"prose","text":"Six entity-roles stand in the peer spectrum, one more than PDT recommends. They are kept on purpose: app creators, adopting adults and students form the core, teacher platforms are a channel (E12), AI assistants are what the platform has to design for, and social media is kept although little potential is expected from it. GitHub has no platform role: it is a means of production, part of the platform's infrastructure (D1).","line":16,"renderedHtml":""},{"kind":"prose","text":"","line":17,"renderedHtml":""},{"kind":"ignore","ruleCode":"H102","reason":"Six peer roles are kept on purpose, see above (KD-10)","startLine":19,"endLine":19},{"kind":"prose","text":"","line":21,"renderedHtml":""},{"kind":"prose","text":"","line":22,"renderedHtml":""},{"kind":"heading","level":3,"text":"App creators","line":23},{"kind":"prose","text":"","line":24,"renderedHtml":"\u003cp>Engaged people who build small educational apps, typically with AI tools, for a gap they noticed themselves. Ralf D. Müller, co-owner of the GitHub organisation lernapps, is one of them: he builds the Mathe-Karte and does not take part in the platform.\u003c/p>\n\u003cp>Portrait (D2): the lack of feedback, the wish for recognition and knowing the app helped are assumptions of the platform owner, still to be validated with creators. Creators build their apps as personal software anyway; reaching other classrooms is a nice-to-have for them, not what drives them to start. Once their apps are used, though, most engaged creators are strongly motivated by praise and use (D4).\u003c/p>\n"},{"kind":"prose","text":"Engaged people who build small educational apps, typically with AI tools, for a gap they noticed themselves. Ralf D. Müller, co-owner of the GitHub organisation lernapps, is one of them: he builds the Mathe-Karte and does not take part in the platform.","line":25,"renderedHtml":""},{"kind":"prose","text":"","line":26,"renderedHtml":""},{"kind":"prose","text":"Portrait (D2): the lack of feedback, the wish for recognition and knowing the app helped are assumptions of the platform owner, still to be validated with creators. Creators build their apps as personal software anyway; reaching other classrooms is a nice-to-have for them, not what drives them to start. Once their apps are used, though, most engaged creators are strongly motivated by praise and use (D4).","line":27,"renderedHtml":""},{"kind":"prose","text":"","line":28,"renderedHtml":""},{"kind":"block","blockType":"entity","attributes":{"id":"e-creators","title":"App creators","role":"peer-producer","layer":"long-tail","clusters":"","context":"","assets":"","capabilities":"","potential":"","goals":"","pressures":"","convenience-gains":"","reach-gains":"","value-gains":""},"lists":{"clusters":["Teachers","Parents","Engineers"],"context":["Build apps with AI assistants, alongside their actual job","Publish on their own website, GitHub or social media"],"assets":["Their apps","Classroom experience (teachers) or development skills (engineers)"],"capabilities":["Build a working app in a weekend with AI assistance"],"potential":["Build on existing apps instead of starting from scratch","Evolve apps with feedback from use"],"goals":["Close a gap they noticed themselves, for their own class or child"],"pressures":["Little time","The app rots after a single use","No feedback whether the app works elsewhere"],"convenience-gains":["Build and publish with less effort"],"reach-gains":["The app reaches classrooms beyond their own circle"],"value-gains":["Recognition for their work","Knowing the app helped others learn"]},"startLine":30,"endLine":63,"inPdt42Fence":true},{"kind":"prose","text":"","line":65,"renderedHtml":""},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-portrait-creators","canvas":"entity-portrait","of":"e-creators"},"startLine":67,"endLine":71,"inPdt42Fence":true},{"kind":"prose","text":"","line":73,"renderedHtml":""},{"kind":"heading","level":3,"text":"Adopting adults","line":74},{"kind":"prose","text":"","line":75,"renderedHtml":"\u003cp>Adults who come across apps built by others, browse them and show them to their students. Engineers belong here too, as they also look for existing apps to re-use.\u003c/p>\n\u003cp>Portrait (D2): recommending apps to colleagues and the next test as a pressure are assumptions of the platform owner, still to be validated with teachers and parents.\u003c/p>\n"},{"kind":"prose","text":"Adults who come across apps built by others, browse them and show them to their students. Engineers belong here too, as they also look for existing apps to re-use.","line":76,"renderedHtml":""},{"kind":"prose","text":"","line":77,"renderedHtml":""},{"kind":"prose","text":"Portrait (D2): recommending apps to colleagues and the next test as a pressure are assumptions of the platform owner, still to be validated with teachers and parents.","line":78,"renderedHtml":""},{"kind":"prose","text":"","line":79,"renderedHtml":""},{"kind":"block","blockType":"entity","attributes":{"id":"e-adopters","title":"Adopting adults","role":"peer-consumer","layer":"long-tail","clusters":"","context":"","assets":"","potential":"","goals":"","pressures":"","convenience-gains":"","reach-gains":"","value-gains":""},"lists":{"clusters":["Teachers","Parents","Engineers"],"context":["Short of time","Devices exist at school and at home","Find apps by word of mouth, on teacher platforms or on GitHub"],"assets":["Access to students","Devices"],"potential":["Give feedback from classroom use","Recommend apps to colleagues"],"goals":["Teachers: gain free time by keeping students busy, for individual support or preparation","Parents: support their children's learning with little time"],"pressures":["Lack of time","Responsibility for data protection","The next test"],"convenience-gains":["An app usable next week, without installation or sign-up"],"reach-gains":["Active-learning apps beyond the large, passive platforms"],"value-gains":["Certainty that an app may be used","Students actively doing something"]},"startLine":81,"endLine":114,"inPdt42Fence":true},{"kind":"prose","text":"","line":116,"renderedHtml":""},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-portrait-adopters","canvas":"entity-portrait","of":"e-adopters"},"startLine":118,"endLine":122,"inPdt42Fence":true},{"kind":"prose","text":"","line":124,"renderedHtml":""},{"kind":"heading","level":3,"text":"Students","line":125},{"kind":"prose","text":"","line":126,"renderedHtml":"\u003cp>The learners the apps are built for. They usually get to know an app through an adult, and may later return to it on their own.\u003c/p>\n\u003cp>Portrait (D2): recommending apps to classmates and all three gains are assumptions of the platform owner, still to be validated.\u003c/p>\n"},{"kind":"prose","text":"The learners the apps are built for. They usually get to know an app through an adult, and may later return to it on their own.","line":127,"renderedHtml":""},{"kind":"prose","text":"","line":128,"renderedHtml":""},{"kind":"prose","text":"Portrait (D2): recommending apps to classmates and all three gains are assumptions of the platform owner, still to be validated.","line":129,"renderedHtml":""},{"kind":"prose","text":"","line":130,"renderedHtml":""},{"kind":"block","blockType":"entity","attributes":{"id":"e-students","title":"Students","role":"peer-consumer","layer":"long-tail","context":"","potential":"","goals":"","pressures":"","convenience-gains":"","reach-gains":"","value-gains":""},"lists":{"context":["Get to know apps through an adult","Use them on school tablets or at home"],"potential":["Return to apps on their own","Recommend apps to classmates","Build apps themselves"],"goals":["Understand the subject to get good grades"],"pressures":["The next test"],"convenience-gains":["Quick help right before the test"],"reach-gains":["An app for exactly the topic they struggle with"],"value-gains":["Better grades","Understanding the subject"]},"startLine":132,"endLine":155,"inPdt42Fence":true},{"kind":"prose","text":"","line":157,"renderedHtml":""},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-portrait-students","canvas":"entity-portrait","of":"e-students"},"startLine":159,"endLine":163,"inPdt42Fence":true},{"kind":"prose","text":"","line":165,"renderedHtml":""},{"kind":"heading","level":3,"text":"School gatekeepers","line":166},{"kind":"prose","text":"","line":167,"renderedHtml":"\u003cp>People at school whom careful teachers ask before using an app. They act as local trusted advisors. There is typically no data protection officer at school level; the computer science teacher may take that role.\u003c/p>\n"},{"kind":"prose","text":"People at school whom careful teachers ask before using an app. They act as local trusted advisors. There is typically no data protection officer at school level; the computer science teacher may take that role.","line":168,"renderedHtml":""},{"kind":"prose","text":"","line":169,"renderedHtml":""},{"kind":"block","blockType":"entity","attributes":{"id":"e-gatekeepers","title":"School gatekeepers","role":"stakeholder","layer":"aggregator","clusters":""},"lists":{"clusters":["School director","Computer science teacher"]},"startLine":171,"endLine":179,"inPdt42Fence":true},{"kind":"prose","text":"","line":181,"renderedHtml":""},{"kind":"heading","level":3,"text":"Teacher platforms","line":182},{"kind":"prose","text":"","line":183,"renderedHtml":"\u003cp>Platforms where teachers find digital teaching offerings, some commercial, some non-profit. Some came out of government initiatives.\u003c/p>\n\u003cp>Portrait (D2): apart from their reach among teachers, the portrait consists of assumptions of the platform owner, still to be validated. Commercial and non-profit platforms differ here: for commercial ones, free apps are rather unwelcome competition, so the convenience gain mainly applies to non-profit platforms.\u003c/p>\n"},{"kind":"prose","text":"Platforms where teachers find digital teaching offerings, some commercial, some non-profit. Some came out of government initiatives.","line":184,"renderedHtml":""},{"kind":"prose","text":"","line":185,"renderedHtml":""},{"kind":"prose","text":"Portrait (D2): apart from their reach among teachers, the portrait consists of assumptions of the platform owner, still to be validated. Commercial and non-profit platforms differ here: for commercial ones, free apps are rather unwelcome competition, so the convenience gain mainly applies to non-profit platforms.","line":186,"renderedHtml":""},{"kind":"prose","text":"","line":187,"renderedHtml":""},{"kind":"block","blockType":"entity","attributes":{"id":"e-teacher-platforms","title":"Teacher platforms (commercial or non-profit)","role":"partner","layer":"aggregator","clusters":"","context":"","assets":"","goals":"","pressures":"","convenience-gains":"","reach-gains":"","value-gains":""},"lists":{"clusters":["fobizz","Serlo"],"context":["Collect digital teaching offerings","Some commercial, some non-profit, some came out of government initiatives"],"assets":["Reach among teachers"],"goals":["An attractive, trustworthy offering for teachers"],"pressures":["Keeping the offering current and broad"],"convenience-gains":["More offerings without producing them themselves"],"reach-gains":["More teachers"],"value-gains":["Revenue (commercial) or mission impact (non-profit)"]},"startLine":189,"endLine":212,"inPdt42Fence":true},{"kind":"prose","text":"","line":214,"renderedHtml":""},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-portrait-teacher-platforms","canvas":"entity-portrait","of":"e-teacher-platforms"},"startLine":216,"endLine":220,"inPdt42Fence":true},{"kind":"prose","text":"","line":222,"renderedHtml":""},{"kind":"heading","level":3,"text":"Social media","line":223},{"kind":"prose","text":"","line":224,"renderedHtml":"\u003cp>Where creators share their apps and where apps travel by recommendation. It stays a partner, although the platform owner expects little potential from it.\u003c/p>\n\u003cp>Portrait (D2): kept minimal on purpose, as little potential is expected; goal and gain are assumptions.\u003c/p>\n"},{"kind":"prose","text":"Where creators share their apps and where apps travel by recommendation. It stays a partner, although the platform owner expects little potential from it.","line":225,"renderedHtml":""},{"kind":"prose","text":"","line":226,"renderedHtml":""},{"kind":"prose","text":"Portrait (D2): kept minimal on purpose, as little potential is expected; goal and gain are assumptions.","line":227,"renderedHtml":""},{"kind":"prose","text":"","line":228,"renderedHtml":""},{"kind":"block","blockType":"entity","attributes":{"id":"e-social-media","title":"Social media","role":"partner","layer":"aggregator","context":"","potential":"","goals":"","reach-gains":""},"lists":{"context":["Where creators share their apps and apps travel by recommendation"],"potential":["Spread apps by recommendation"],"goals":["Engagement"],"reach-gains":["Content that gets shared"]},"startLine":230,"endLine":243,"inPdt42Fence":true},{"kind":"prose","text":"","line":245,"renderedHtml":""},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-portrait-social-media","canvas":"entity-portrait","of":"e-social-media"},"startLine":247,"endLine":251,"inPdt42Fence":true},{"kind":"prose","text":"","line":253,"renderedHtml":""},{"kind":"heading","level":3,"text":"GitHub","line":254},{"kind":"prose","text":"","line":255,"renderedHtml":"\u003cp>Where many creators publish their apps&#39; code. Engineers search it for apps to re-use, but there is usually little content, and hardly anything that specific.\u003c/p>\n\u003cp>For lernapps.net, GitHub is a means of production rather than a partner: the platform is neither large nor prominent enough to have a relationship with GitHub. It still deliberately builds its own infrastructure on it, such as issue templates, GitHub Actions workflows, and the apps themselves with their labels. So GitHub has no platform role and appears in the platform&#39;s infrastructure instead (D1).\u003c/p>\n"},{"kind":"prose","text":"Where many creators publish their apps' code. Engineers search it for apps to re-use, but there is usually little content, and hardly anything that specific.","line":256,"renderedHtml":""},{"kind":"prose","text":"","line":257,"renderedHtml":""},{"kind":"prose","text":"For lernapps.net, GitHub is a means of production rather than a partner: the platform is neither large nor prominent enough to have a relationship with GitHub. It still deliberately builds its own infrastructure on it, such as issue templates, GitHub Actions workflows, and the apps themselves with their labels. So GitHub has no platform role and appears in the platform's infrastructure instead (D1).","line":258,"renderedHtml":""},{"kind":"prose","text":"","line":259,"renderedHtml":""},{"kind":"ignore","ruleCode":"H101","reason":"GitHub is a means of production, not a platform role (KD-10)","startLine":261,"endLine":261},{"kind":"block","blockType":"entity","attributes":{"id":"e-github","title":"GitHub","layer":"infrastructure"},"startLine":262,"endLine":266,"inPdt42Fence":true},{"kind":"prose","text":"","line":268,"renderedHtml":""},{"kind":"heading","level":3,"text":"AI assistants","line":269},{"kind":"prose","text":"","line":270,"renderedHtml":"\u003cp>The tools creators build their apps with. For engineers they also replace discovery: instead of searching further, they have an assistant build their own app. They are a partner the platform has to design for: whatever lernapps.net offers creators has to work through their AI assistants.\u003c/p>\n\u003cp>Portrait (D2): lernapps.net plans to serve their convenience gain with better instructions and scaffolding (D3, D5). Their potential, goal and pressure are assumptions of the platform owner.\u003c/p>\n"},{"kind":"prose","text":"The tools creators build their apps with. For engineers they also replace discovery: instead of searching further, they have an assistant build their own app. They are a partner the platform has to design for: whatever lernapps.net offers creators has to work through their AI assistants.","line":271,"renderedHtml":""},{"kind":"prose","text":"","line":272,"renderedHtml":""},{"kind":"prose","text":"Portrait (D2): lernapps.net plans to serve their convenience gain with better instructions and scaffolding (D3, D5). Their potential, goal and pressure are assumptions of the platform owner.","line":273,"renderedHtml":""},{"kind":"prose","text":"","line":274,"renderedHtml":""},{"kind":"block","blockType":"entity","attributes":{"id":"e-ai-assistants","title":"AI assistants","role":"partner","layer":"infrastructure","clusters":"","context":"","potential":"","goals":"","pressures":"","convenience-gains":"","value-gains":""},"lists":{"clusters":["Claude"],"context":["Tools creators build apps with","Replace discovery for engineers","Becoming part of every household's basic equipment"],"potential":["Build apps that follow shared guidelines, if they get them as context"],"goals":["Deliver useful results to their users"],"pressures":["Competition between providers"],"convenience-gains":["Reach a working app with fewer iterations and less guessing"],"value-gains":["Build apps that can easily be used"]},"startLine":276,"endLine":297,"inPdt42Fence":true},{"kind":"prose","text":"","line":299,"renderedHtml":""},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-portrait-ai-assistants","canvas":"entity-portrait","of":"e-ai-assistants"},"startLine":301,"endLine":305,"inPdt42Fence":true},{"kind":"prose","text":"","line":307,"renderedHtml":""},{"kind":"heading","level":3,"text":"Platform owner","line":308},{"kind":"prose","text":"","line":309,"renderedHtml":"\u003cp>Oliver Jägle owns and shapes the platform strategy. Creators who bring their own best practices into the guidance can grow into co-owners (D6). Ralf D. Müller builds apps (the Mathe-Karte) and appears among the app creators. What the platform owner is accountable for as an organisation, with its objectives, risks and capabilities, is described in the \u003ca href=\"../about/#ch08-owners.biz42.md:el-owner-platform\">business model\u003c/a> (biz42).\u003c/p>\n"},{"kind":"prose","text":"Oliver Jägle owns and shapes the platform strategy. Creators who bring their own best practices into the guidance can grow into co-owners (D6). Ralf D. Müller builds apps (the Mathe-Karte) and appears among the app creators. What the platform owner is accountable for as an organisation, with its objectives, risks and capabilities, is described in the [business model](../about/#ch08-owners.biz42.md:el-owner-platform) (biz42).","line":310,"renderedHtml":""},{"kind":"prose","text":"","line":311,"renderedHtml":""},{"kind":"block","blockType":"entity","attributes":{"id":"e-platform-owner","title":"Platform owner","role":"owner","clusters":""},"lists":{"clusters":["Oliver Jägle"]},"startLine":313,"endLine":319,"inPdt42Fence":true},{"kind":"prose","text":"","line":321,"renderedHtml":""},{"kind":"heading","level":2,"text":"Jobs in \"Getting apps into use\"","line":322},{"kind":"prose","text":"","line":323,"renderedHtml":""},{"kind":"heading","level":3,"text":"Creators make their app available to others","line":324},{"kind":"prose","text":"","line":325,"renderedHtml":"\u003cp>Today creators put their apps on their own website, on GitHub or on social media, and talk about them with friends, maybe also with a teacher or a school. All of it stays local.\u003c/p>\n"},{"kind":"prose","text":"Today creators put their apps on their own website, on GitHub or on social media, and talk about them with friends, maybe also with a teacher or a school. All of it stays local.","line":326,"renderedHtml":""},{"kind":"prose","text":"","line":327,"renderedHtml":""},{"kind":"block","blockType":"job","attributes":{"id":"j-make-available","title":"Creators make their app available to others","arena":"ar-into-use","entities":"e-creators, e-adopters, e-social-media, e-github"},"startLine":329,"endLine":334,"inPdt42Fence":true},{"kind":"prose","text":"","line":336,"renderedHtml":""},{"kind":"heading","level":3,"text":"Adults find an existing app for re-use","line":337},{"kind":"prose","text":"","line":338,"renderedHtml":"\u003cp>Today adults find apps by word of mouth, on teacher platforms such as fobizz or Serlo, or — engineers in particular — on GitHub. For engineers the search usually fails: they have an AI assistant build their own app instead, which leads into &quot;Building the app&quot; and produces yet another one-off app.\u003c/p>\n"},{"kind":"prose","text":"Today adults find apps by word of mouth, on teacher platforms such as fobizz or Serlo, or — engineers in particular — on GitHub. For engineers the search usually fails: they have an AI assistant build their own app instead, which leads into \"Building the app\" and produces yet another one-off app.","line":339,"renderedHtml":""},{"kind":"prose","text":"","line":340,"renderedHtml":""},{"kind":"block","blockType":"job","attributes":{"id":"j-find-reuse","title":"Adults find an existing app for re-use","arena":"ar-into-use","entities":"e-adopters, e-creators, e-teacher-platforms, e-social-media, e-github","job-step":"locate"},"startLine":342,"endLine":348,"inPdt42Fence":true},{"kind":"prose","text":"","line":350,"renderedHtml":""},{"kind":"heading","level":3,"text":"Adults confirm an app may be used","line":351},{"kind":"prose","text":"","line":352,"renderedHtml":"\u003cp>Whether an app gets checked at all depends on each teacher&#39;s personal risk affinity. Careful teachers ask the school director or the computer science teacher; everyone else decides alone (recorded in the portrait in D1).\u003c/p>\n"},{"kind":"prose","text":"Whether an app gets checked at all depends on each teacher's personal risk affinity. Careful teachers ask the school director or the computer science teacher; everyone else decides alone (recorded in the portrait in D1).","line":353,"renderedHtml":""},{"kind":"prose","text":"","line":354,"renderedHtml":""},{"kind":"block","blockType":"job","attributes":{"id":"j-confirm-use","title":"Adults confirm an app may be used","arena":"ar-into-use","entities":"e-adopters, e-gatekeepers","job-step":"confirm"},"startLine":356,"endLine":362,"inPdt42Fence":true},{"kind":"prose","text":"","line":364,"renderedHtml":""},{"kind":"heading","level":3,"text":"Adults bring the app to students","line":365},{"kind":"prose","text":"","line":366,"renderedHtml":"\u003cp>Adults use every available channel: link, QR code, projector, school tablets.\u003c/p>\n"},{"kind":"prose","text":"Adults use every available channel: link, QR code, projector, school tablets.","line":367,"renderedHtml":""},{"kind":"prose","text":"","line":368,"renderedHtml":""},{"kind":"block","blockType":"job","attributes":{"id":"j-bring-to-students","title":"Adults bring the app to students","arena":"ar-into-use","entities":"e-adopters, e-students","job-step":"execute"},"startLine":370,"endLine":376,"inPdt42Fence":true},{"kind":"prose","text":"","line":378,"renderedHtml":""},{"kind":"heading","level":3,"text":"Students find an app to prepare for the next test","line":379},{"kind":"prose","text":"","line":380,"renderedHtml":"\u003cp>Students look for apps with a different motivation than adults: to survive the next test. They usually know an app because an adult showed it to them. That they also search via social media and AI assistants is an assumption, not an observation — to be validated.\u003c/p>\n"},{"kind":"prose","text":"Students look for apps with a different motivation than adults: to survive the next test. They usually know an app because an adult showed it to them. That they also search via social media and AI assistants is an assumption, not an observation — to be validated.","line":381,"renderedHtml":""},{"kind":"prose","text":"","line":382,"renderedHtml":""},{"kind":"block","blockType":"job","attributes":{"id":"j-students-find","title":"Students find an app to prepare for the next test","arena":"ar-into-use","entities":"e-students, e-adopters, e-creators, e-social-media, e-ai-assistants","job-step":"locate"},"startLine":384,"endLine":390,"inPdt42Fence":true},{"kind":"prose","text":"","line":392,"renderedHtml":""}]},{"filePath":"1-exploration/e3-assets-moats.pdt42.md","title":"Identify leverageable assets and moats","steps":["E3"],"nodes":[{"kind":"heading","level":1,"text":"Identify leverageable assets and moats","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":""},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-vrio","canvas":"vrio"},"startLine":4,"endLine":7,"inPdt42Fence":true},{"kind":"prose","text":"","line":9,"renderedHtml":"\u003cp>\u003cem>The assets are tested in VRIO order: valuable, rare, inimitable, organised; the test stops at the first &quot;no&quot;. The ratings are the platform owner&#39;s own assessment.\u003c/em>\u003c/p>\n\u003cp>None of the assets is inimitable, so none grounds a lasting advantage on its own: they are supporting assets. Together they make a free, low-doubt offering possible, but whatever advantage lernapps.net gains has to come from the platform itself, not from what lernapps.net holds today.\u003c/p>\n"},{"kind":"prose","text":"*The assets are tested in VRIO order: valuable, rare, inimitable, organised; the test stops at the first \"no\". The ratings are the platform owner's own assessment.*","line":10,"renderedHtml":""},{"kind":"prose","text":"","line":11,"renderedHtml":""},{"kind":"prose","text":"None of the assets is inimitable, so none grounds a lasting advantage on its own: they are supporting assets. Together they make a free, low-doubt offering possible, but whatever advantage lernapps.net gains has to come from the platform itself, not from what lernapps.net holds today.","line":12,"renderedHtml":""},{"kind":"prose","text":"","line":13,"renderedHtml":""},{"kind":"heading","level":2,"text":"Assets","line":14},{"kind":"prose","text":"","line":15,"renderedHtml":""},{"kind":"heading","level":3,"text":"Structured modelling DSLs as agent guidance","line":16},{"kind":"prose","text":"","line":17,"renderedHtml":"\u003cp>lernapps.net builds on documentation DSLs: biz42 and pdt42 by the platform owner, and arc42 from docToolchain. They are structured models that both people and AI assistants can read, write and validate. The same approach can turn into the guidelines creators give their agents, so that similar apps get built quickly and efficiently instead of each one following its own principles.\u003c/p>\n\u003cp>Valuable, because agent guidance is what &quot;Building the app&quot; lacks today. Rare, because lernapps.net does not intend to earn money with it: commercial players keep such guidance to themselves, while we can give it away. Not inimitable: the DSLs are open source, and anyone can copy the approach.\u003c/p>\n"},{"kind":"prose","text":"lernapps.net builds on documentation DSLs: biz42 and pdt42 by the platform owner, and arc42 from docToolchain. They are structured models that both people and AI assistants can read, write and validate. The same approach can turn into the guidelines creators give their agents, so that similar apps get built quickly and efficiently instead of each one following its own principles.","line":18,"renderedHtml":""},{"kind":"prose","text":"","line":19,"renderedHtml":""},{"kind":"prose","text":"Valuable, because agent guidance is what \"Building the app\" lacks today. Rare, because lernapps.net does not intend to earn money with it: commercial players keep such guidance to themselves, while we can give it away. Not inimitable: the DSLs are open source, and anyone can copy the approach.","line":20,"renderedHtml":""},{"kind":"prose","text":"","line":21,"renderedHtml":""},{"kind":"ignore","ruleCode":"H002","reason":"No asset is inimitable; the assets are supporting on purpose (KD-04)","startLine":23,"endLine":23},{"kind":"block","blockType":"asset","attributes":{"id":"as-modelling-dsls","title":"Structured modelling DSLs as agent guidance","vrio":"vr","layer":"infrastructure","relates-to":"e-creators, e-ai-assistants"},"startLine":24,"endLine":30,"inPdt42Fence":true},{"kind":"prose","text":"","line":32,"renderedHtml":""},{"kind":"heading","level":3,"text":"Frontend-only architecture","line":33},{"kind":"prose","text":"","line":34,"renderedHtml":"\u003cp>The platform and the apps it recommends run in the browser only: no server, no database, no installation, no sign-up. This removes the main doubts about fitness for use, and it causes no operating costs. Having no server is necessary for data protection, not sufficient: scripts, fonts or embedded content from third parties can still send data, so what an app loads has to be checked.\u003c/p>\n\u003cp>Valuable, because it answers exactly the question adults ask before bringing an app to students. Not rare: many small AI-built apps are static anyway. The advantage only arises once the property is checked and made visible.\u003c/p>\n"},{"kind":"prose","text":"The platform and the apps it recommends run in the browser only: no server, no database, no installation, no sign-up. This removes the main doubts about fitness for use, and it causes no operating costs. Having no server is necessary for data protection, not sufficient: scripts, fonts or embedded content from third parties can still send data, so what an app loads has to be checked.","line":35,"renderedHtml":""},{"kind":"prose","text":"","line":36,"renderedHtml":""},{"kind":"prose","text":"Valuable, because it answers exactly the question adults ask before bringing an app to students. Not rare: many small AI-built apps are static anyway. The advantage only arises once the property is checked and made visible.","line":37,"renderedHtml":""},{"kind":"prose","text":"","line":38,"renderedHtml":""},{"kind":"ignore","ruleCode":"H002","reason":"No asset is inimitable; the assets are supporting on purpose (KD-04)","startLine":40,"endLine":40},{"kind":"block","blockType":"asset","attributes":{"id":"as-frontend-only","title":"Frontend-only architecture","vrio":"v","layer":"infrastructure","relates-to":"j-confirm-use, j-bring-to-students"},"startLine":41,"endLine":47,"inPdt42Fence":true},{"kind":"prose","text":"","line":49,"renderedHtml":""},{"kind":"heading","level":3,"text":"Non-profit at near-zero marginal cost","line":50},{"kind":"prose","text":"","line":51,"renderedHtml":"\u003cp>lernapps.net is planned as a non-profit. This is sustainable because the frontend-only architecture causes no operating costs, and with good guidance the marginal cost of creating an app tends towards zero. So the whole offering can be free as well, without advertising or data collection.\u003c/p>\n\u003cp>Valuable, because it removes commercial doubts for adults and schools. Rare, because commercial teacher platforms cannot do this. Not inimitable: other non-profits such as Serlo show that the model can be copied.\u003c/p>\n"},{"kind":"prose","text":"lernapps.net is planned as a non-profit. This is sustainable because the frontend-only architecture causes no operating costs, and with good guidance the marginal cost of creating an app tends towards zero. So the whole offering can be free as well, without advertising or data collection.","line":52,"renderedHtml":""},{"kind":"prose","text":"","line":53,"renderedHtml":""},{"kind":"prose","text":"Valuable, because it removes commercial doubts for adults and schools. Rare, because commercial teacher platforms cannot do this. Not inimitable: other non-profits such as Serlo show that the model can be copied.","line":54,"renderedHtml":""},{"kind":"prose","text":"","line":55,"renderedHtml":""},{"kind":"ignore","ruleCode":"H002","reason":"No asset is inimitable; the assets are supporting on purpose (KD-04)","startLine":57,"endLine":57},{"kind":"block","blockType":"asset","attributes":{"id":"as-non-profit","title":"Non-profit at near-zero marginal cost","vrio":"vr","relates-to":"e-adopters, e-creators"},"startLine":58,"endLine":63,"inPdt42Fence":true},{"kind":"prose","text":"","line":65,"renderedHtml":""},{"kind":"heading","level":2,"text":"Moats","line":66},{"kind":"prose","text":"","line":67,"renderedHtml":"\u003cp>Only one position in the ecosystem cannot be bypassed. The candidates from the scan were checked for alternative routes to the same value flow:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Teacher platforms\u003c/strong> (fobizz, Serlo) aggregate demand, but they are not the only route: adults also find apps by word of mouth, on social media or on GitHub.\u003c/li>\n\u003cli>\u003cstrong>School gatekeepers\u003c/strong> can be bypassed: an entrepreneurial teacher decides alone, as described in the job &quot;Adults confirm an app may be used&quot;.\u003c/li>\n\u003c/ul>\n"},{"kind":"prose","text":"Only one position in the ecosystem cannot be bypassed. The candidates from the scan were checked for alternative routes to the same value flow:","line":68,"renderedHtml":""},{"kind":"prose","text":"","line":69,"renderedHtml":""},{"kind":"prose","text":"- **Teacher platforms** (fobizz, Serlo) aggregate demand, but they are not the only route: adults also find apps by word of mouth, on social media or on GitHub.","line":70,"renderedHtml":""},{"kind":"prose","text":"- **School gatekeepers** can be bypassed: an entrepreneurial teacher decides alone, as described in the job \"Adults confirm an app may be used\".","line":71,"renderedHtml":""},{"kind":"prose","text":"","line":72,"renderedHtml":""},{"kind":"heading","level":3,"text":"Data protection law and terms of use","line":73},{"kind":"prose","text":"","line":74,"renderedHtml":"\u003cp>The GDPR (DSGVO) and terms of use can completely prevent an app from being used in class; there is no alternative route around them. As the tips suggest, lernapps.net does not try to replace this position. Instead it makes the interaction with it easier, for example through the frontend-only architecture. No holder is recorded: the regulation has no actor in the model.\u003c/p>\n"},{"kind":"prose","text":"The GDPR (DSGVO) and terms of use can completely prevent an app from being used in class; there is no alternative route around them. As the tips suggest, lernapps.net does not try to replace this position. Instead it makes the interaction with it easier, for example through the frontend-only architecture. No holder is recorded: the regulation has no actor in the model.","line":75,"renderedHtml":""},{"kind":"prose","text":"","line":76,"renderedHtml":""},{"kind":"block","blockType":"moat","attributes":{"id":"mo-data-protection","title":"Data protection law and terms of use","kind":"regulated","arena":"ar-into-use"},"startLine":78,"endLine":83,"inPdt42Fence":true},{"kind":"prose","text":"","line":85,"renderedHtml":""}]},{"filePath":"1-exploration/e5-value-chain.pdt42.md","title":"Map the value chain","steps":["E5"],"nodes":[{"kind":"heading","level":1,"text":"Map the value chain","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":""},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-wardley-into-use","canvas":"wardley-map","of":"ar-into-use"},"startLine":4,"endLine":8,"inPdt42Fence":true},{"kind":"prose","text":"","line":10,"renderedHtml":"\u003cp>\u003cem>The value chain of the focus arena &quot;Getting apps into use&quot; as it works today, without lernapps.net. It is based on the platform owner&#39;s own observations.\u003c/em>\u003c/p>\n"},{"kind":"prose","text":"*The value chain of the focus arena \"Getting apps into use\" as it works today, without lernapps.net. It is based on the platform owner's own observations.*","line":11,"renderedHtml":""},{"kind":"prose","text":"","line":12,"renderedHtml":""},{"kind":"heading","level":2,"text":"User needs","line":13},{"kind":"prose","text":"","line":14,"renderedHtml":"\u003cp>There is not one user need but three, one per group that wants an app to be used. All three rest on the same app, but for different reasons.\u003c/p>\n"},{"kind":"prose","text":"There is not one user need but three, one per group that wants an app to be used. All three rest on the same app, but for different reasons.","line":15,"renderedHtml":""},{"kind":"prose","text":"","line":16,"renderedHtml":""},{"kind":"heading","level":3,"text":"Students understand the subject to get good grades","line":17},{"kind":"prose","text":"","line":18,"renderedHtml":"\u003cp>Students want to understand the subject well so that they write good grades. This matches their job &quot;find an app to prepare for the next test&quot;.\u003c/p>\n"},{"kind":"prose","text":"Students want to understand the subject well so that they write good grades. This matches their job \"find an app to prepare for the next test\".","line":19,"renderedHtml":""},{"kind":"prose","text":"","line":20,"renderedHtml":""},{"kind":"block","blockType":"component","attributes":{"id":"c-need-students","title":"Students understand the subject to get good grades","arena":"ar-into-use","visibility":"100","entity":"e-students","needs":"c-app, c-discoverability"},"startLine":22,"endLine":29,"inPdt42Fence":true},{"kind":"prose","text":"","line":31,"renderedHtml":""},{"kind":"heading","level":3,"text":"Parents support their children's learning with little time","line":32},{"kind":"prose","text":"","line":33,"renderedHtml":"\u003cp>Parents want the same as their children, but have little time to take care of it actively. An app that keeps their children learning on their own fills this gap.\u003c/p>\n"},{"kind":"prose","text":"Parents want the same as their children, but have little time to take care of it actively. An app that keeps their children learning on their own fills this gap.","line":34,"renderedHtml":""},{"kind":"prose","text":"","line":35,"renderedHtml":""},{"kind":"block","blockType":"component","attributes":{"id":"c-need-parents","title":"Parents support their children's learning with little time","arena":"ar-into-use","visibility":"95","entity":"e-adopters","needs":"c-app, c-bring-to-students"},"startLine":37,"endLine":44,"inPdt42Fence":true},{"kind":"prose","text":"","line":46,"renderedHtml":""},{"kind":"heading","level":3,"text":"Teachers gain free time by keeping students busy","line":47},{"kind":"prose","text":"","line":48,"renderedHtml":"\u003cp>Teachers want to gain free time by keeping students busy with an app. Their reasons differ: time for individual support, time to prepare other things, and more.\u003c/p>\n"},{"kind":"prose","text":"Teachers want to gain free time by keeping students busy with an app. Their reasons differ: time for individual support, time to prepare other things, and more.","line":49,"renderedHtml":""},{"kind":"prose","text":"","line":50,"renderedHtml":""},{"kind":"block","blockType":"component","attributes":{"id":"c-need-teachers","title":"Teachers gain free time by keeping students busy","arena":"ar-into-use","visibility":"90","entity":"e-adopters","needs":"c-app, c-bring-to-students"},"startLine":52,"endLine":59,"inPdt42Fence":true},{"kind":"prose","text":"","line":61,"renderedHtml":""},{"kind":"heading","level":2,"text":"Components","line":62},{"kind":"prose","text":"","line":63,"renderedHtml":""},{"kind":"heading","level":3,"text":"The app","line":64},{"kind":"prose","text":"","line":65,"renderedHtml":"\u003cp>The small educational app itself: the part students see and work with.\u003c/p>\n"},{"kind":"prose","text":"The small educational app itself: the part students see and work with.","line":66,"renderedHtml":""},{"kind":"prose","text":"","line":67,"renderedHtml":""},{"kind":"block","blockType":"component","attributes":{"id":"c-app","title":"Small educational app","arena":"ar-into-use","visibility":"80","evolution":"custom","target":"product","needs":"c-hosting, c-devices, c-ai-assistants"},"startLine":69,"endLine":77,"inPdt42Fence":true},{"kind":"prose","text":"","line":79,"renderedHtml":""},{"kind":"heading","level":3,"text":"Bringing the app to students","line":80},{"kind":"prose","text":"","line":81,"renderedHtml":"\u003cp>Adults use every available channel to get an app in front of their students: link, QR code, projector, school tablets.\u003c/p>\n"},{"kind":"prose","text":"Adults use every available channel to get an app in front of their students: link, QR code, projector, school tablets.","line":82,"renderedHtml":""},{"kind":"prose","text":"","line":83,"renderedHtml":""},{"kind":"block","blockType":"component","attributes":{"id":"c-bring-to-students","title":"Bringing the app to students","arena":"ar-into-use","visibility":"70","evolution":"product","needs":"c-discoverability, c-fitness-signal, c-devices"},"startLine":85,"endLine":92,"inPdt42Fence":true},{"kind":"prose","text":"","line":94,"renderedHtml":""},{"kind":"heading","level":3,"text":"Discoverability","line":95},{"kind":"prose","text":"","line":96,"renderedHtml":"\u003cp>How an app is found: by word of mouth, on teacher platforms, on social media or on GitHub. Students also look for apps themselves.\u003c/p>\n"},{"kind":"prose","text":"How an app is found: by word of mouth, on teacher platforms, on social media or on GitHub. Students also look for apps themselves.","line":97,"renderedHtml":""},{"kind":"prose","text":"","line":98,"renderedHtml":""},{"kind":"block","blockType":"component","attributes":{"id":"c-discoverability","title":"Discoverability of apps","arena":"ar-into-use","visibility":"60","evolution":"custom","target":"product"},"startLine":100,"endLine":107,"inPdt42Fence":true},{"kind":"prose","text":"","line":109,"renderedHtml":""},{"kind":"heading","level":3,"text":"Signal of fitness for use","line":110},{"kind":"prose","text":"","line":111,"renderedHtml":"\u003cp>What tells an adult that an app may be used: above all privacy, and the lowest possible barriers (no installation, no sign-up). Today each teacher judges this alone or asks a gatekeeper.\u003c/p>\n"},{"kind":"prose","text":"What tells an adult that an app may be used: above all privacy, and the lowest possible barriers (no installation, no sign-up). Today each teacher judges this alone or asks a gatekeeper.","line":112,"renderedHtml":""},{"kind":"prose","text":"","line":113,"renderedHtml":""},{"kind":"block","blockType":"component","attributes":{"id":"c-fitness-signal","title":"Signal of fitness for use","arena":"ar-into-use","visibility":"55","evolution":"genesis","target":"product"},"startLine":115,"endLine":122,"inPdt42Fence":true},{"kind":"prose","text":"","line":124,"renderedHtml":""},{"kind":"heading","level":3,"text":"Hosting","line":125},{"kind":"prose","text":"","line":126,"renderedHtml":"\u003cp>Where the app runs, for example GitHub Pages. It is a pure convenience: available to anyone, for free.\u003c/p>\n"},{"kind":"prose","text":"Where the app runs, for example GitHub Pages. It is a pure convenience: available to anyone, for free.","line":127,"renderedHtml":""},{"kind":"prose","text":"","line":128,"renderedHtml":""},{"kind":"block","blockType":"component","attributes":{"id":"c-hosting","title":"Hosting","arena":"ar-into-use","visibility":"25","evolution":"commodity"},"startLine":130,"endLine":136,"inPdt42Fence":true},{"kind":"prose","text":"","line":138,"renderedHtml":""},{"kind":"heading","level":3,"text":"AI assistants","line":139},{"kind":"prose","text":"","line":140,"renderedHtml":"\u003cp>The tools apps are built with, and a way students find apps. There are many of them, but they are currently becoming part of every household&#39;s basic equipment.\u003c/p>\n"},{"kind":"prose","text":"The tools apps are built with, and a way students find apps. There are many of them, but they are currently becoming part of every household's basic equipment.","line":141,"renderedHtml":""},{"kind":"prose","text":"","line":142,"renderedHtml":""},{"kind":"block","blockType":"component","attributes":{"id":"c-ai-assistants","title":"AI assistants","arena":"ar-into-use","visibility":"20","evolution":"commodity","entity":"e-ai-assistants"},"startLine":144,"endLine":151,"inPdt42Fence":true},{"kind":"prose","text":"","line":153,"renderedHtml":""},{"kind":"heading","level":3,"text":"Devices and connectivity","line":154},{"kind":"prose","text":"","line":155,"renderedHtml":"\u003cp>The devices and the network the app runs on, at school and at home.\u003c/p>\n"},{"kind":"prose","text":"The devices and the network the app runs on, at school and at home.","line":156,"renderedHtml":""},{"kind":"prose","text":"","line":157,"renderedHtml":""},{"kind":"block","blockType":"component","attributes":{"id":"c-devices","title":"Devices and connectivity","arena":"ar-into-use","visibility":"15","evolution":"commodity"},"startLine":159,"endLine":165,"inPdt42Fence":true},{"kind":"prose","text":"","line":167,"renderedHtml":""}]},{"filePath":"1-exploration/e6-plays.pdt42.md","title":"Apply the six Platform Plays","steps":["E6"],"nodes":[{"kind":"heading","level":1,"text":"Apply the six Platform Plays","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":""},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-platform-plays","canvas":"platform-plays"},"startLine":4,"endLine":7,"inPdt42Fence":true},{"kind":"prose","text":"","line":9,"renderedHtml":"\u003cp>\u003cem>The plays are applied to the value chain of &quot;Getting apps into use&quot; (E5). The to-be evolution of each moved component is recorded as its target on the Wardley Map.\u003c/em>\u003c/p>\n\u003cp>The scarce resource in this arena is attention for contributed apps. Building an app has become cheap; getting anyone beyond its creator to notice it has not. This makes bringing producers on top of the value chain (PP2) the most important play. The other plays serve it: they standardise how an app is offered, make its fitness for use visible, bundle the scattered offering, and tailor what each visitor sees.\u003c/p>\n"},{"kind":"prose","text":"*The plays are applied to the value chain of \"Getting apps into use\" (E5). The to-be evolution of each moved component is recorded as its target on the Wardley Map.*","line":10,"renderedHtml":""},{"kind":"prose","text":"","line":11,"renderedHtml":""},{"kind":"prose","text":"The scarce resource in this arena is attention for contributed apps. Building an app has become cheap; getting anyone beyond its creator to notice it has not. This makes bringing producers on top of the value chain (PP2) the most important play. The other plays serve it: they standardise how an app is offered, make its fitness for use visible, bundle the scattered offering, and tailor what each visitor sees.","line":12,"renderedHtml":""},{"kind":"prose","text":"","line":13,"renderedHtml":""},{"kind":"heading","level":2,"text":"PP1 · Personalise without accounts","line":14},{"kind":"prose","text":"","line":15,"renderedHtml":"\u003cp>The platform website tailors what it shows to each visitor without the apps knowing anything about it. Two means keep it frontend-only and free of operating costs: the browser remembers the visitor&#39;s role (student, parent, teacher), grades, subjects and favourites in local storage, and teachers assemble collections of apps for their class that are carried entirely in a link or QR code. An optional backend for the website only, never for the apps and never with student accounts, stays an option for later: it could sync favourites and collections across devices and collect &quot;used in class&quot; feedback, at the price of operating costs and data protection duties.\u003c/p>\n"},{"kind":"prose","text":"The platform website tailors what it shows to each visitor without the apps knowing anything about it. Two means keep it frontend-only and free of operating costs: the browser remembers the visitor's role (student, parent, teacher), grades, subjects and favourites in local storage, and teachers assemble collections of apps for their class that are carried entirely in a link or QR code. An optional backend for the website only, never for the apps and never with student accounts, stays an option for later: it could sync favourites and collections across devices and collect \"used in class\" feedback, at the price of operating costs and data protection duties.","line":16,"renderedHtml":""},{"kind":"prose","text":"","line":17,"renderedHtml":""},{"kind":"block","blockType":"play","attributes":{"id":"pl-personalise","play":"pp1","arena":"ar-into-use","affects":"c-discoverability, c-bring-to-students","insight":"Personalise on the website only, via local storage and collections carried in a link or QR code; an optional website backend without student accounts is left for later"},"startLine":19,"endLine":25,"inPdt42Fence":true},{"kind":"prose","text":"","line":27,"renderedHtml":""},{"kind":"heading","level":2,"text":"PP2 · Bring creators on top","line":28},{"kind":"prose","text":"","line":29,"renderedHtml":"\u003cp>Today creators are hidden: their apps reach only their own circle and then rot. Attention for contributed apps is the scarce resource, so the platform has to put creators and their apps in front of the adults and students looking for them.\u003c/p>\n"},{"kind":"prose","text":"Today creators are hidden: their apps reach only their own circle and then rot. Attention for contributed apps is the scarce resource, so the platform has to put creators and their apps in front of the adults and students looking for them.","line":30,"renderedHtml":""},{"kind":"prose","text":"","line":31,"renderedHtml":""},{"kind":"block","blockType":"play","attributes":{"id":"pl-creators-up","play":"pp2","arena":"ar-into-use","affects":"c-app, c-discoverability","insight":"Attention for contributed apps is the scarce resource; the platform exists to direct it to creators and their apps"},"startLine":33,"endLine":39,"inPdt42Fence":true},{"kind":"prose","text":"","line":41,"renderedHtml":""},{"kind":"heading","level":2,"text":"PP3 · Standardise making an app available","line":42},{"kind":"prose","text":"","line":43,"renderedHtml":"\u003cp>Every creator publishes differently today: own website, GitHub, social media. A uniform listing (what the app does, for whom, with a link and a QR code) makes apps comparable and easy to pass on.\u003c/p>\n"},{"kind":"prose","text":"Every creator publishes differently today: own website, GitHub, social media. A uniform listing (what the app does, for whom, with a link and a QR code) makes apps comparable and easy to pass on.","line":44,"renderedHtml":""},{"kind":"prose","text":"","line":45,"renderedHtml":""},{"kind":"block","blockType":"play","attributes":{"id":"pl-standard-listing","play":"pp3","arena":"ar-into-use","affects":"c-discoverability, c-bring-to-students","insight":"Standardise the listing of an app, so apps become comparable and can be passed on by link or QR code"},"startLine":47,"endLine":53,"inPdt42Fence":true},{"kind":"prose","text":"","line":55,"renderedHtml":""},{"kind":"heading","level":2,"text":"PP4 · Embed building in agent guidance","line":56},{"kind":"prose","text":"","line":57,"renderedHtml":"\u003cp>Guidelines for AI assistants turn building an app into a guided process, so apps follow shared principles instead of each its own. The play acts mainly in the arena &quot;Building the app&quot;, but it changes what reaches this arena: apps become alike enough to be compared and trusted.\u003c/p>\n"},{"kind":"prose","text":"Guidelines for AI assistants turn building an app into a guided process, so apps follow shared principles instead of each its own. The play acts mainly in the arena \"Building the app\", but it changes what reaches this arena: apps become alike enough to be compared and trusted.","line":58,"renderedHtml":""},{"kind":"prose","text":"","line":59,"renderedHtml":""},{"kind":"block","blockType":"play","attributes":{"id":"pl-guided-building","play":"pp4","arena":"ar-into-use","affects":"c-app","insight":"Agent guidance makes apps follow shared principles; it acts in \"Building the app\", but turns the app into a comparable product here"},"startLine":61,"endLine":67,"inPdt42Fence":true},{"kind":"prose","text":"","line":69,"renderedHtml":""},{"kind":"heading","level":2,"text":"PP5 · Make fitness for use visible","line":70},{"kind":"prose","text":"","line":71,"renderedHtml":"\u003cp>Today each teacher judges alone whether an app may be used, or asks a gatekeeper. A visible signal, such as a frontend-only badge and feedback from classroom use, answers the question up front. It eases the interaction with the moat of data protection law instead of fighting it.\u003c/p>\n"},{"kind":"prose","text":"Today each teacher judges alone whether an app may be used, or asks a gatekeeper. A visible signal, such as a frontend-only badge and feedback from classroom use, answers the question up front. It eases the interaction with the moat of data protection law instead of fighting it.","line":72,"renderedHtml":""},{"kind":"prose","text":"","line":73,"renderedHtml":""},{"kind":"block","blockType":"play","attributes":{"id":"pl-fitness-trust","play":"pp5","arena":"ar-into-use","affects":"c-fitness-signal","insight":"A visible signal of fitness for use, such as a frontend-only badge and classroom feedback, eases the interaction with data protection law"},"startLine":75,"endLine":81,"inPdt42Fence":true},{"kind":"prose","text":"","line":83,"renderedHtml":""},{"kind":"heading","level":2,"text":"PP6 · Aggregate the scattered offering","line":84},{"kind":"prose","text":"","line":85,"renderedHtml":"\u003cp>Apps are spread over websites, GitHub and social media, and the people looking for them search in just as many places. One overview bundles the supply of apps and the demand of adults and students.\u003c/p>\n"},{"kind":"prose","text":"Apps are spread over websites, GitHub and social media, and the people looking for them search in just as many places. One overview bundles the supply of apps and the demand of adults and students.","line":86,"renderedHtml":""},{"kind":"prose","text":"","line":87,"renderedHtml":""},{"kind":"block","blockType":"play","attributes":{"id":"pl-aggregate","play":"pp6","arena":"ar-into-use","affects":"c-discoverability","insight":"Bundle scattered apps and the people looking for them in one overview"},"startLine":89,"endLine":95,"inPdt42Fence":true},{"kind":"prose","text":"","line":97,"renderedHtml":""}]},{"filePath":"1-exploration/e7-brief.pdt42.md","title":"Identify the platformization space and consolidate the brief","steps":["E7"],"nodes":[{"kind":"heading","level":1,"text":"Identify the platformization space and consolidate the brief","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":""},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-brief-consolidation","canvas":"brief-consolidation"},"startLine":4,"endLine":7,"inPdt42Fence":true},{"kind":"prose","text":"","line":9,"renderedHtml":"\u003cp>\u003cem>Only the Pattern Cards whose signal is visible in the landscape of E1–E6 are played. Weaker candidates were left out: climbing to higher-level ecosystems (E7) rests on collections that do not exist yet, and a new profession (E4) is not visible today. Aggregating shared infrastructure (E9) acts mainly in &quot;Building the app&quot;.\u003c/em>\u003c/p>\n"},{"kind":"prose","text":"*Only the Pattern Cards whose signal is visible in the landscape of E1–E6 are played. Weaker candidates were left out: climbing to higher-level ecosystems (E7) rests on collections that do not exist yet, and a new profession (E4) is not visible today. Aggregating shared infrastructure (E9) acts mainly in \"Building the app\".*","line":10,"renderedHtml":""},{"kind":"prose","text":"","line":11,"renderedHtml":""},{"kind":"heading","level":2,"text":"WHAT-IF scenarios","line":12},{"kind":"prose","text":"","line":13,"renderedHtml":""},{"kind":"heading","level":3,"text":"The one app for the one gap is found","line":14},{"kind":"prose","text":"","line":15,"renderedHtml":"\u003cp>Every app teaches one aspect, and demand is just as fine-grained: a teacher looks for something on exactly one topic for exactly one grade. Today these niches never meet.\u003c/p>\n"},{"kind":"prose","text":"Every app teaches one aspect, and demand is just as fine-grained: a teacher looks for something on exactly one topic for exactly one grade. Today these niches never meet.","line":16,"renderedHtml":""},{"kind":"prose","text":"","line":17,"renderedHtml":""},{"kind":"block","blockType":"scenario","attributes":{"id":"sc-niches-meet","title":"The one app for the one gap is found","pattern":"e3","arena":"ar-into-use","impact":"A teacher looking for one topic in one grade finds the app someone built for exactly that gap"},"startLine":19,"endLine":25,"inPdt42Fence":true},{"kind":"prose","text":"","line":27,"renderedHtml":""},{"kind":"heading","level":3,"text":"Apps that work in class rise","line":28},{"kind":"prose","text":"","line":29,"renderedHtml":"\u003cp>Many apps are built and used once. As attention for contributed apps is the scarce resource, it has to go to the apps that work: feedback from classroom use and forks show which ones do.\u003c/p>\n"},{"kind":"prose","text":"Many apps are built and used once. As attention for contributed apps is the scarce resource, it has to go to the apps that work: feedback from classroom use and forks show which ones do.","line":30,"renderedHtml":""},{"kind":"prose","text":"","line":31,"renderedHtml":""},{"kind":"block","blockType":"scenario","attributes":{"id":"sc-best-emerge","title":"Apps that work in class rise","pattern":"e8","arena":"ar-into-use","impact":"Feedback from classroom use and forks direct the scarce attention to the apps that work"},"startLine":33,"endLine":39,"inPdt42Fence":true},{"kind":"prose","text":"","line":41,"renderedHtml":""},{"kind":"heading","level":3,"text":"Teacher platforms show apps from lernapps.net","line":42},{"kind":"prose","text":"","line":43,"renderedHtml":"\u003cp>Adults already find apps on teacher platforms such as fobizz or Serlo. Instead of competing with them, lernapps.net lets them show its apps, so the platforms become a channel for contributed apps. This is likely limited to non-profit platforms such as Serlo: for commercial ones, free apps are rather unwelcome competition (D3).\u003c/p>\n"},{"kind":"prose","text":"Adults already find apps on teacher platforms such as fobizz or Serlo. Instead of competing with them, lernapps.net lets them show its apps, so the platforms become a channel for contributed apps. This is likely limited to non-profit platforms such as Serlo: for commercial ones, free apps are rather unwelcome competition (D3).","line":44,"renderedHtml":""},{"kind":"prose","text":"","line":45,"renderedHtml":""},{"kind":"block","blockType":"scenario","attributes":{"id":"sc-platforms-as-channels","title":"Teacher platforms show apps from lernapps.net","pattern":"e12","arena":"ar-into-use","impact":"Non-profit teacher platforms become a channel for contributed apps instead of a competing offering"},"startLine":47,"endLine":53,"inPdt42Fence":true},{"kind":"prose","text":"","line":55,"renderedHtml":""},{"kind":"heading","level":2,"text":"Attention for small learning apps","line":56},{"kind":"prose","text":"","line":57,"renderedHtml":"\u003cp>The platformization space is the focus arena &quot;Getting apps into use&quot;. The core relationship is between app creators and the adults who bring apps into use; students play an ancillary role, as they usually get to know an app through an adult. The brief collects what E3 to E6 found: the transactions to standardise, the traits of the product side, and the moat to reckon with.\u003c/p>\n"},{"kind":"prose","text":"The platformization space is the focus arena \"Getting apps into use\". The core relationship is between app creators and the adults who bring apps into use; students play an ancillary role, as they usually get to know an app through an adult. The brief collects what E3 to E6 found: the transactions to standardise, the traits of the product side, and the moat to reckon with.","line":58,"renderedHtml":""},{"kind":"prose","text":"","line":59,"renderedHtml":""},{"kind":"block","blockType":"brief","attributes":{"id":"br-attention","title":"Attention for small learning apps","arena":"ar-into-use","entities":"e-creators, e-adopters, e-students","standardize":"","product-side":"","moats":"mo-data-protection"},"lists":{"standardize":["Listing an app (what it does, for whom)","Passing an app on by link or QR code","Signalling fitness for use"],"product-side":["Guidance for AI assistants","Starter templates","Frontend-only hosting","Personalisation without accounts"]},"startLine":61,"endLine":76,"inPdt42Fence":true},{"kind":"prose","text":"","line":78,"renderedHtml":""}]},{"filePath":"2-design/d1-ecosystem.pdt42.md","title":"Map the ecosystem","steps":["D1","D2"],"nodes":[{"kind":"heading","level":1,"text":"Map the ecosystem","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":"\u003cp>\u003cem>The platform design describes the product: who takes part, what they exchange, and the experiences. The organisation that runs it, with its objectives, risks and capabilities, is described in the \u003ca href=\"../about/\">business model\u003c/a> (biz42).\u003c/em>\u003c/p>\n"},{"kind":"prose","text":"*The platform design describes the product: who takes part, what they exchange, and the experiences. The organisation that runs it, with its objectives, risks and capabilities, is described in the [business model](../about/) (biz42).*","line":3,"renderedHtml":""},{"kind":"prose","text":"","line":4,"renderedHtml":""},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-ecosystem","canvas":"ecosystem"},"startLine":6,"endLine":9,"inPdt42Fence":true},{"kind":"prose","text":"","line":11,"renderedHtml":"\u003cp>\u003cem>The entity-roles live in their home chapter, the ecosystem scan (E2): this step gave each one its platform role there, and D2 added their portraits. The ecosystem canvas below draws them with the platform and its owner, which this chapter adds. The platform starts from the brief &quot;Attention for small learning apps&quot; (E7).\u003c/em>\u003c/p>\n"},{"kind":"prose","text":"*The entity-roles live in their home chapter, the ecosystem scan (E2): this step gave each one its platform role there, and D2 added their portraits. The ecosystem canvas below draws them with the platform and its owner, which this chapter adds. The platform starts from the brief \"Attention for small learning apps\" (E7).*","line":12,"renderedHtml":""},{"kind":"prose","text":"","line":13,"renderedHtml":""},{"kind":"heading","level":2,"text":"lernapps.net","line":14},{"kind":"prose","text":"","line":15,"renderedHtml":"\u003cp>The platform for the ecosystem of small, active-learning educational apps. The owner runs its infrastructure on GitHub, the platform&#39;s means of production: the website with the app overview, the agent guidance and starter templates, and the issue templates and GitHub Actions workflows contributions go through. Its core entity, chosen in D4, is the adopting adults.\u003c/p>\n\u003cp>The platform is free to use, and it lives on thanks. Every adult, student and creator should understand that a thank-you is how they keep it alive: it is what keeps creators contributing, and it costs nothing. The guidance through the platform makes this clear without being pushy.\u003c/p>\n"},{"kind":"prose","text":"The platform for the ecosystem of small, active-learning educational apps. The owner runs its infrastructure on GitHub, the platform's means of production: the website with the app overview, the agent guidance and starter templates, and the issue templates and GitHub Actions workflows contributions go through. Its core entity, chosen in D4, is the adopting adults.","line":16,"renderedHtml":""},{"kind":"prose","text":"","line":17,"renderedHtml":""},{"kind":"prose","text":"The platform is free to use, and it lives on thanks. Every adult, student and creator should understand that a thank-you is how they keep it alive: it is what keeps creators contributing, and it costs nothing. The guidance through the platform makes this clear without being pushy.","line":18,"renderedHtml":""},{"kind":"prose","text":"","line":19,"renderedHtml":""},{"kind":"block","blockType":"platform","attributes":{"id":"platform-lernapps","title":"lernapps.net","ecosystem":"eco-edu-apps","brief":"br-attention","owners":"e-platform-owner","core-entity":"e-adopters","narrative":"Free to use, kept alive by thanks. Adults and students find an active-learning app they can use right away, without doubt about whether it may be used; creators list theirs with almost no effort and hear when it helped. A thank-you, free and anonymous, is what keeps the platform alive.","infrastructure":""},"lists":{"infrastructure":["Website with the app overview","Agent guidance and starter templates","GitHub as the means of production: issue templates, GitHub Actions workflows, apps with their labels"]},"startLine":21,"endLine":33,"inPdt42Fence":true},{"kind":"prose","text":"","line":35,"renderedHtml":""}]},{"filePath":"2-design/d3-motivations.pdt42.md","title":"Analyse the motivations to exchange value","steps":["D3"],"nodes":[{"kind":"heading","level":1,"text":"Analyse the motivations to exchange value","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":""},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-motivations","canvas":"motivations-matrix"},"startLine":4,"endLine":7,"inPdt42Fence":true},{"kind":"prose","text":"","line":9,"renderedHtml":"\
