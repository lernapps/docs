 x-app-in-minutes","base":"","implementation":"Concierge: the owner invites the creators personally and helps with the first listing; listing, overview, referral links and the anonymous thanks are built for real, in their simplest form; the thanks is explained to no one, the platform has to make it self-evident","status":"planned"},"lists":{"base":["5 to 10 potential creators from the platform owner's network","Teachers reached through the owner's contacts, who forward a referral link","The Mathe-Karte as a first app","The docs site and the GitHub organisation lernapps with its workflows"]},"startLine":20,"endLine":31,"inPdt42Fence":true},{"kind":"prose","text":"","line":33,"renderedHtml":""},{"kind":"heading","level":3,"text":"Assumptions","line":34},{"kind":"prose","text":"","line":35,"renderedHtml":""},{"kind":"heading","level":4,"text":"Creators list an app when it costs minutes","line":36},{"kind":"prose","text":"","line":37,"renderedHtml":"\u003cp>Reach is no reason for creators to start (D4), so the first listing has to cost almost nothing. If they do not list even when invited personally, there is nothing to test the rest with.\u003c/p>\n"},{"kind":"prose","text":"Reach is no reason for creators to start (D4), so the first listing has to cost almost nothing. If they do not list even when invited personally, there is nothing to test the rest with.","line":38,"renderedHtml":""},{"kind":"prose","text":"","line":39,"renderedHtml":""},{"kind":"block","blockType":"assumption","attributes":{"id":"a-creators-list","title":"Creators list an app when it costs minutes","mvp":"mvp-first-draft","kind":"attraction","riskiest":"yes","test":"Invite the 5 to 10 creators personally and help with the first listing","criteria":"At least 5 creators list an app within 2 weeks","status":"open"},"startLine":41,"endLine":50,"inPdt42Fence":true},{"kind":"prose","text":"","line":52,"renderedHtml":""},{"kind":"heading","level":4,"text":"The platform convinces teachers on its own","line":53},{"kind":"prose","text":"","line":54,"renderedHtml":"\u003cp>Trust is tested at the moment of decision: does the platform&#39;s own address convince a teacher to use an app? Warm contacts would say yes for the owner&#39;s sake, so the owner&#39;s contacts forward a referral link to subject-matching colleagues the owner does not know. Only an action counts, not a promise. The referral code is one per wave, never per person: with numbers this small, totals per person would reveal individual behaviour.\u003c/p>\n"},{"kind":"prose","text":"Trust is tested at the moment of decision: does the platform's own address convince a teacher to use an app? Warm contacts would say yes for the owner's sake, so the owner's contacts forward a referral link to subject-matching colleagues the owner does not know. Only an action counts, not a promise. The referral code is one per wave, never per person: with numbers this small, totals per person would reveal individual behaviour.","line":55,"renderedHtml":""},{"kind":"prose","text":"","line":56,"renderedHtml":""},{"kind":"block","blockType":"assumption","attributes":{"id":"a-platform-convinces","title":"The platform convinces teachers on its own","mvp":"mvp-first-draft","kind":"trust","riskiest":"yes","test":"The owner's contacts forward a referral link of one wave to subject-matching colleagues; count \"I'll have a look\" and \"used in class\" clicks of that wave","criteria":"At least 3 teachers from the forwarded wave use an app and report it with a click","status":"open"},"startLine":58,"endLine":67,"inPdt42Fence":true},{"kind":"prose","text":"","line":69,"renderedHtml":""},{"kind":"heading","level":4,"text":"Thanks arrive without being explained","line":70},{"kind":"prose","text":"","line":71,"renderedHtml":"\u003cp>The platform is free and lives on thanks (KD-17). Already in the first draft, thanks should arrive, without the owner explaining the thanks to anyone: the platform has to make it self-evident. With few users, the test can only say whether thanks arrive at all.\u003c/p>\n"},{"kind":"prose","text":"The platform is free and lives on thanks (KD-17). Already in the first draft, thanks should arrive, without the owner explaining the thanks to anyone: the platform has to make it self-evident. With few users, the test can only say whether thanks arrive at all.","line":72,"renderedHtml":""},{"kind":"prose","text":"","line":73,"renderedHtml":""},{"kind":"block","blockType":"assumption","attributes":{"id":"a-thanks-arrive-unexplained","title":"Thanks arrive without being explained","mvp":"mvp-first-draft","kind":"business-model","riskiest":"yes","test":"Count the anonymous thanks per listed app; the owner explains the thanks to no one","criteria":"Thanks arrive for at least 3 listed apps within 4 weeks","status":"open"},"startLine":75,"endLine":84,"inPdt42Fence":true},{"kind":"prose","text":"","line":86,"renderedHtml":""},{"kind":"heading","level":4,"text":"Creators contribute without payment","line":87},{"kind":"prose","text":"","line":88,"renderedHtml":"\u003cp>The platform pays no one. Creators list their apps because they get guidance for building and thanks when their app helps (D4, D6), not money. This is the core of the free model.\u003c/p>\n"},{"kind":"prose","text":"The platform pays no one. Creators list their apps because they get guidance for building and thanks when their app helps (D4, D6), not money. This is the core of the free model.","line":89,"renderedHtml":""},{"kind":"prose","text":"","line":90,"renderedHtml":""},{"kind":"block","blockType":"assumption","attributes":{"id":"a-creators-unpaid","title":"Creators contribute without payment","mvp":"mvp-first-draft","kind":"business-model","riskiest":"yes","test":"Talk to each creator after listing and again after 4 weeks","criteria":"No creator asks for payment, and most name the guidance or the thanks as reason enough","status":"open"},"startLine":92,"endLine":101,"inPdt42Fence":true},{"kind":"prose","text":"","line":103,"renderedHtml":""},{"kind":"heading","level":4,"text":"The anonymous thanks works, also from school networks","line":104},{"kind":"prose","text":"","line":105,"renderedHtml":"\u003cp>The thanks has to reach the platform from school networks, which often filter, and has to step aside quietly where it cannot. Without tracking, the origin of a thank-you is unknown, so creators who teach try it once from their school and report. It is good enough if it works at most of their schools.\u003c/p>\n"},{"kind":"prose","text":"The thanks has to reach the platform from school networks, which often filter, and has to step aside quietly where it cannot. Without tracking, the origin of a thank-you is unknown, so creators who teach try it once from their school and report. It is good enough if it works at most of their schools.","line":106,"renderedHtml":""},{"kind":"prose","text":"","line":107,"renderedHtml":""},{"kind":"block","blockType":"assumption","attributes":{"id":"a-school-filters","title":"The anonymous thanks works, also from school networks","mvp":"mvp-first-draft","kind":"other","riskiest":"no","test":"Creators who teach send one thank-you from their school network and say whether it worked","criteria":"It works at most of the schools of the creators who teach","status":"open"},"startLine":109,"endLine":118,"inPdt42Fence":true},{"kind":"prose","text":"","line":120,"renderedHtml":""},{"kind":"heading","level":2,"text":"First apps, first thanks","line":121},{"kind":"prose","text":"","line":122,"renderedHtml":"\u003cp>The real MVP, once the first draft holds. All three experiences take part. Teachers are reached through referral links that the platform owner&#39;s contacts forward, with the platform itself as the pitch and a short letter to go with it. Thanks and feedback run through the real anonymous click; users are not accompanied or observed.\u003c/p>\n"},{"kind":"prose","text":"The real MVP, once the first draft holds. All three experiences take part. Teachers are reached through referral links that the platform owner's contacts forward, with the platform itself as the pitch and a short letter to go with it. Thanks and feedback run through the real anonymous click; users are not accompanied or observed.","line":123,"renderedHtml":""},{"kind":"prose","text":"","line":124,"renderedHtml":""},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-mvp-first-thanks","canvas":"mvp","of":"mvp-first-thanks"},"startLine":126,"endLine":130,"inPdt42Fence":true},{"kind":"prose","text":"","line":132,"renderedHtml":""},{"kind":"block","blockType":"mvp","attributes":{"id":"mvp-first-thanks","title":"First apps, first thanks","experiences":"x-app-in-minutes, x-practice-tonight, x-list-and-hear-back","base":"","implementation":"Concierge: the owner's contacts forward referral links per wave; thanks and structured feedback run through the real anonymous click; users are not accompanied or observed","status":"planned"},"lists":{"base":["The apps listed in the first draft","Referral links and a short letter for the owner's contacts to forward","About 10 teachers, still to be reached through forwarding"]},"startLine":134,"endLine":144,"inPdt42Fence":true},{"kind":"prose","text":"","line":146,"renderedHtml":""},{"kind":"heading","level":3,"text":"Assumptions","line":147},{"kind":"prose","text":"","line":148,"renderedHtml":""},{"kind":"heading","level":4,"text":"The platform reaches enough teachers through forwarding","line":149},{"kind":"prose","text":"","line":150,"renderedHtml":"\u003cp>Without teachers, none of the demand-side assumptions can be tested. Reaching them is not a given: it depends on contacts forwarding the platform, and on the platform convincing on its own (tested in the first draft).\u003c/p>\n"},{"kind":"prose","text":"Without teachers, none of the demand-side assumptions can be tested. Reaching them is not a given: it depends on contacts forwarding the platform, and on the platform convincing on its own (tested in the first draft).","line":151,"renderedHtml":""},{"kind":"prose","text":"","line":152,"renderedHtml":""},{"kind":"block","blockType":"assumption","attributes":{"id":"a-teachers-reached","title":"The platform reaches enough teachers through forwarding","mvp":"mvp-first-thanks","kind":"attraction","riskiest":"yes","test":"Forwarding waves through the owner's contacts, counted per wave","criteria":"At least 10 teachers from forwarded waves use an app and report it with a click","status":"open"},"startLine":154,"endLine":163,"inPdt42Fence":true},{"kind":"prose","text":"","line":165,"renderedHtml":""},{"kind":"heading","level":4,"text":"Thanks arrive","line":166},{"kind":"prose","text":"","line":167,"renderedHtml":"\u003cp>The platform is free and lives on thanks (KD-17). Without tracking, the test cannot say how many users do not thank; it can only say whether thanks reach the creators at all.\u003c/p>\n"},{"kind":"prose","text":"The platform is free and lives on thanks (KD-17). Without tracking, the test cannot say how many users do not thank; it can only say whether thanks reach the creators at all.","line":168,"renderedHtml":""},{"kind":"prose","text":"","line":169,"renderedHtml":""},{"kind":"block","blockType":"assumption","attributes":{"id":"a-thanks-arrive","title":"Thanks arrive","mvp":"mvp-first-thanks","kind":"business-model","riskiest":"yes","test":"Count the anonymous thanks per listed app","criteria":"At least half of the listed apps receive at least one thank-you within 4 weeks","status":"open"},"startLine":171,"endLine":180,"inPdt42Fence":true},{"kind":"prose","text":"","line":182,"renderedHtml":""},{"kind":"heading","level":4,"text":"Thanks keep creators","line":183},{"kind":"prose","text":"","line":184,"renderedHtml":"\u003cp>Once their apps are used, praise and use should keep creators (D4). This decides whether thanks works as the currency.\u003c/p>\n"},{"kind":"prose","text":"Once their apps are used, praise and use should keep creators (D4). This decides whether thanks works as the currency.","line":185,"renderedHtml":""},{"kind":"prose","text":"","line":186,"renderedHtml":""},{"kind":"block","blockType":"assumption","attributes":{"id":"a-thanks-keep-creators","title":"Thanks keep creators","mvp":"mvp-first-thanks","kind":"business-model","riskiest":"yes","test":"Watch the creators' repositories for updates and new apps; talk to each creator after 6 weeks","criteria":"At least 3 creators who received thanks update their app or list another within 6 weeks, and say the thanks mattered","status":"open"},"startLine":188,"endLine":197,"inPdt42Fence":true},{"kind":"prose","text":"","line":199,"renderedHtml":""},{"kind":"heading","level":4,"text":"Teachers use an app without checking it themselves","line":200},{"kind":"prose","text":"","line":201,"renderedHtml":"\u003cp>Trust is built in rather than checked (KD-17): only apps that meet the fitness criteria are listed. The structured feedback after use carries the question, so no one is observed.\u003c/p>\n"},{"kind":"prose","text":"Trust is built in rather than checked (KD-17): only apps that meet the fitness criteria are listed. The structured feedback after use carries the question, so no one is observed.","line":202,"renderedHtml":""},{"kind":"prose","text":"","line":203,"renderedHtml":""},{"kind":"block","blockType":"assumption","attributes":{"id":"a-trust-built-in","title":"Teachers use an app without checking it themselves","mvp":"mvp-first-thanks","kind":"trust","riskiest":"yes","test":"Offer \"I was unsure whether I may use it\" as an answer in the structured feedback","criteria":"Chosen in fewer than 1 in 5 feedbacks","status":"open"},"startLine":205,"endLine":214,"inPdt42Fence":true},{"kind":"prose","text":"","line":216,"renderedHtml":""},{"kind":"heading","level":4,"text":"An app runs in class within minutes","line":217},{"kind":"prose","text":"","line":218,"renderedHtml":"\u003cp>The value proposition for teachers in an acute moment, measured through an answer in the structured feedback.\u003c/p>\n"},{"kind":"prose","text":"The value proposition for teachers in an acute moment, measured through an answer in the structured feedback.","line":219,"renderedHtml":""},{"kind":"prose","text":"","line":220,"renderedHtml":""},{"kind":"block","blockType":"assumption","attributes":{"id":"a-running-in-minutes","title":"An app runs in class within minutes","mvp":"mvp-first-thanks","kind":"attraction","riskiest":"no","test":"Offer \"It took too long to get it running\" as an answer in the structured feedback","criteria":"Chosen in fewer than 1 in 5 feedbacks","status":"open"},"startLine":222,"endLine":231,"inPdt42Fence":true},{"kind":"prose","text":"","line":233,"renderedHtml":""},{"kind":"heading","level":4,"text":"Parents find the platform the evening before a test","line":234},{"kind":"prose","text":"","line":235,"renderedHtml":"\u003cp>Parents are not in the base yet. This is tested on purpose only once the riskiest assumptions hold, so it has no test yet.\u003c/p>\n"},{"kind":"prose","text":"Parents are not in the base yet. This is tested on purpose only once the riskiest assumptions hold, so it has no test yet.","line":236,"renderedHtml":""},{"kind":"prose","text":"","line":237,"renderedHtml":""},{"kind":"ignore","ruleCode":"H115","reason":"Tested only after the riskiest assumptions hold, once parents are reached (KD-19)","startLine":239,"endLine":239},{"kind":"block","blockType":"assumption","attributes":{"id":"a-parents-find","title":"Parents find the platform the evening before a test","mvp":"mvp-first-thanks","kind":"attraction","riskiest":"no","status":"open"},"startLine":240,"endLine":247,"inPdt42Fence":true},{"kind":"prose","text":"","line":249,"renderedHtml":""}]}],"elements":[{"id":"eco-edu-apps","title":"Small, active-learning educational apps","context":"ecosystem-mobilization","kind":"ecosystem","loc":{"file":"1-exploration/e1-arenas.pdt42.md","line":23,"heading":"Small, active-learning educational apps","prose":"\nThe ecosystem consists of apps that are not only pedagogically valuable but have an explicit educational focus and promote active engagement by students. Many platforms are rather passive (e.g. Serlo) or focus on learning paths (e.g. Khan Academy). This ecosystem centres on small apps, each focused on teaching one aspect or a few closely related ones.\n\nValue is created bottom-up today, but it does not compound. A teacher or parent notices a gap they want to close with an app — whether it is a real gap or existing solutions just don't fit does not matter. This engaged person builds an app with AI tools. It usually looks very individual: every tool follows its own principles, frameworks and so on. Then the app is used exactly once and rots afterwards.\n\nThe ecosystem already exists, but it has so far been shaped mostly top-down: ministries set up funding programmes, commission agencies or companies, receive the results and distribute them to schools — where they get stuck, because implementing large solutions in schools is hard. **We deliberately leave ministries, funding programmes and commissioned agencies out as actors of this design**: involving them would slow everything down. The top-down chain is the reason the ecosystem under-performs, not a route we act on.\n\nWe want creators to recognise existing solutions and gaps, build similar apps quickly and efficiently using guidelines for their agents, make them easily available to third parties who can use them without doubt about their fitness for use, and suggest extensions or contribute easily.\n"}},{"id":"ar-spotting","title":"Spotting a need","outcome":"Existing solutions and gaps are recognisable","after":[],"enables":[],"focus":false,"steps":[],"kind":"arena","loc":{"file":"1-exploration/e1-arenas.pdt42.md","line":35,"heading":"Spotting a need","prose":"\nA teacher or parent notices a gap they want to close with an app. Gaps are usually whole apps, not feature requests for an existing one. Today, whether a gap is real or existing solutions just don't fit remains unclear; we want existing solutions and gaps to be recognisable.\n"}},{"id":"ar-building","title":"Building the app","outcome":"Similar apps are built quickly and efficiently using agent guidelines","after":["ar-spotting"],"enables":[],"focus":false,"steps":[],"kind":"arena","loc":{"file":"1-exploration/e1-arenas.pdt42.md","line":48,"heading":"Building the app","prose":"\nToday every app is built individually, following its own principles and frameworks. With guidelines for their agents, creators should be able to build similar apps quickly and efficiently.\n"}},{"id":"ar-into-use","title":"Getting apps into use","outcome":"An app is used without doubt about its fitness for use, beyond the person who built it","after":["ar-building"],"enables":[],"focus":true,"steps":["Make the app available","Adults come across the offering and browse it","Judge fitness for use (privacy, no installation, no sign-up)","Show the app to students","Students return and look for content themselves"],"kind":"arena","loc":{"file":"1-exploration/e1-arenas.pdt42.md","line":62,"heading":"Getting apps into use","prose":"\nThe core we tackle first. Making an app available and using it are considered one arena: the outcome — an app reaching a classroom it was not built for — only exists jointly, and the entities involved overlap almost completely. Third parties are mostly other adults who come across the offering, browse it and show the apps to their students; students who know an app may return and look for content themselves. Fitness for use mainly means privacy, but also the lowest possible barriers to use: no installation, no sign-up.\n"}},{"id":"ar-evolving","title":"Evolving the app","outcome":"Users and creators suggest extensions or contribute, so the app does not rot","after":["ar-into-use"],"enables":[],"focus":false,"steps":[],"kind":"arena","loc":{"file":"1-exploration/e1-arenas.pdt42.md","line":82,"heading":"Evolving the app","prose":"\nInstead of rotting after a single use, apps are developed further: both users and other creators suggest extensions or contribute. The sequence is deliberately linear — evolving an app does not feed back into spotting a need, because gaps are usually whole apps rather than feature requests.\n"}},{"id":"e-creators","title":"App creators","role":"peer-producer","layer":"long-tail","clusters":["Teachers","Parents","Engineers"],"context":["Build apps with AI assistants, alongside their actual job","Publish on their own website, GitHub or social media"],"assets":["Their apps","Classroom experience (teachers) or development skills (engineers)"],"capabilities":["Build a working app in a weekend with AI assistance"],"potential":["Build on existing apps instead of starting from scratch","Evolve apps with feedback from use"],"goals":["Close a gap they noticed themselves, for their own class or child"],"pressures":["Little time","The app rots after a single use","No feedback whether the app works elsewhere"],"convenience-gains":["Build and publish with less effort"],"reach-gains":["The app reaches classrooms beyond their own circle"],"value-gains":["Recognition for their work","Knowing the app helped others learn"],"kind":"entity","loc":{"file":"1-exploration/e2-scan.pdt42.md","line":30,"heading":"App creators","prose":"\nEngaged people who build small educational apps, typically with AI tools, for a gap they noticed themselves. Ralf D. Müller, co-owner of the GitHub organisation lernapps, is one of them: he builds the Mathe-Karte and does not take part in the platform.\n\nPortrait (D2): the lack of feedback, the wish for recognition and knowing the app helped are assumptions of the platform owner, still to be validated with creators. Creators build their apps as personal software anyway; reaching other classrooms is a nice-to-have for them, not what drives them to start. Once their apps are used, though, most engaged creators are strongly motivated by praise and use (D4).\n"}},{"id":"e-adopters","title":"Adopting adults","role":"peer-consumer","layer":"long-tail","clusters":["Teachers","Parents","Engineers"],"context":["Short of time","Devices exist at school and at home","Find apps by word of mouth, on teacher platforms or on GitHub"],"assets":["Access to students","Devices"],"capabilities":[],"potential":["Give feedback from classroom use","Recommend apps to colleagues"],"goals":["Teachers: gain free time by keeping students busy, for individual support or preparation","Parents: support their children's learning with little time"],"pressures":["Lack of time","Responsibility for data protection","The next test"],"convenience-gains":["An app usable next week, without installation or sign-up"],"reach-gains":["Active-learning apps beyond the large, passive platforms"],"value-gains":["Certainty that an app may be used","Students actively doing something"],"kind":"entity","loc":{"file":"1-exploration/e2-scan.pdt42.md","line":81,"heading":"Adopting adults","prose":"\nAdults who come across apps built by others, browse them and show them to their students. Engineers belong here too, as they also look for existing apps to re-use.\n\nPortrait (D2): recommending apps to colleagues and the next test as a pressure are assumptions of the platform owner, still to be validated with teachers and parents.\n"}},{"id":"e-students","title":"Students","role":"peer-consumer","layer":"long-tail","clusters":[],"context":["Get to know apps through an adult","Use them on school tablets or at home"],"assets":[],"capabilities":[],"potential":["Return to apps on their own","Recommend apps to classmates","Build apps themselves"],"goals":["Understand the subject to get good grades"],"pressures":["The next test"],"convenience-gains":["Quick help right before the test"],"reach-gains":["An app for exactly the topic they struggle with"],"value-gains":["Better grades","Understanding the subject"],"kind":"entity","loc":{"file":"1-exploration/e2-scan.pdt42.md","line":132,"heading":"Students","prose":"\nThe learners the apps are built for. They usually get to know an app through an adult, and may later return to it on their own.\n\nPortrait (D2): recommending apps to classmates and all three gains are assumptions of the platform owner, still to be validated.\n"}},{"id":"e-gatekeepers","title":"School gatekeepers","role":"stakeholder","layer":"aggregator","clusters":["School director","Computer science teacher"],"context":[],"assets":[],"capabilities":[],"potential":[],"goals":[],"pressures":[],"convenience-gains":[],"reach-gains":[],"value-gains":[],"kind":"entity","loc":{"file":"1-exploration/e2-scan.pdt42.md","line":171,"heading":"School gatekeepers","prose":"\nPeople at school whom careful teachers ask before using an app. They act as local trusted advisors. There is typically no data protection officer at school level; the computer science teacher may take that role.\n"}},{"id":"e-teacher-platforms","title":"Teacher platforms (commercial or non-profit)","role":"partner","layer":"aggregator","clusters":["fobizz","Serlo"],"context":["Collect digital teaching offerings","Some commercial, some non-profit, some came out of government initiatives"],"assets":["Reach among teachers"],"capabilities":[],"potential":[],"goals":["An attractive, trustworthy offering for teachers"],"pressures":["Keeping the offering current and broad"],"convenience-gains":["More offerings without producing them themselves"],"reach-gains":["More teachers"],"value-gains":["Revenue (commercial) or mission impact (non-profit)"],"kind":"entity","loc":{"file":"1-exploration/e2-scan.pdt42.md","line":189,"heading":"Teacher platforms","prose":"\nPlatforms where teachers find digital teaching offerings, some commercial, some non-profit. Some came out of government initiatives.\n\nPortrait (D2): apart from their reach among teachers, the portrait consists of assumptions of the platform owner, still to be validated. Commercial and non-profit platforms differ here: for commercial ones, free apps are rather unwelcome competition, so the convenience gain mainly applies to non-profit platforms.\n"}},{"id":"e-social-media","title":"Social media","role":"partner","layer":"aggregator","clusters":[],"context":["Where creators share their apps and apps travel by recommendation"],"assets":[],"capabilities":[],"potential":["Spread apps by recommendation"],"goals":["Engagement"],"pressures":[],"convenience-gains":[],"reach-gains":["Content that gets shared"],"value-gains":[],"kind":"entity","loc":{"file":"1-exploration/e2-scan.pdt42.md","line":230,"heading":"Social media","prose":"\nWhere creators share their apps and where apps travel by recommendation. It stays a partner, although the platform owner expects little potential from it.\n\nPortrait (D2): kept minimal on purpose, as little potential is expected; goal and gain are assumptions.\n"}},{"id":"e-github","title":"GitHub","layer":"infrastructure","clusters":[],"context":[],"assets":[],"capabilities":[],"potential":[],"goals":[],"pressures":[],"convenience-gains":[],"reach-gains":[],"value-gains":[],"kind":"entity","loc":{"file":"1-exploration/e2-scan.pdt42.md","line":262,"heading":"GitHub","prose":"\nWhere many creators publish their apps' code. Engineers search it for apps to re-use, but there is usually little content, and hardly anything that specific.\n\nFor lernapps.net, GitHub is a means of production rather than a partner: the platform is neither large nor prominent enough to have a relationship with GitHub. It still deliberately builds its own infrastructure on it, such as issue templates, GitHub Actions workflows, and the apps themselves with their labels. So GitHub has no platform role and appears in the platform's infrastructure instead (D1).\n"}},{"id":"e-ai-assistants","title":"AI assistants","role":"partner","layer":"infrastructure","clusters":["Claude"],"context":["Tools creators build apps with","Replace discovery for engineers","Becoming part of every household's basic equipment"],"assets":[],"capabilities":[],"potential":["Build apps that follow shared guidelines, if they get them as context"],"goals":["Deliver useful results to their users"],"pressures":["Competition between providers"],"convenience-gains":["Reach a working app with fewer iterations and less guessing"],"reach-gains":[],"value-gains":["Build apps that can easily be used"],"kind":"entity","loc":{"file":"1-exploration/e2-scan.pdt42.md","line":276,"heading":"AI assistants","prose":"\nThe tools creators build their apps with. For engineers they also replace discovery: instead of searching further, they have an assistant build their own app. They are a partner the platform has to design for: whatever lernapps.net offers creators has to work through their AI assistants.\n\nPortrait (D2): lernapps.net plans to serve their convenience gain with better instructions and scaffolding (D3, D5). Their potential, goal and pressure are assumptions of the platform owner.\n"}},{"id":"e-platform-owner","title":"Platform owner","role":"owner","clusters":["Oliver Jägle"],"context":[],"assets":[],"capabilities":[],"potential":[],"goals":[],"pressures":[],"convenience-gains":[],"reach-gains":[],"value-gains":[],"kind":"entity","loc":{"file":"1-exploration/e2-scan.pdt42.md","line":313,"heading":"Platform owner","prose":"\nOliver Jägle owns and shapes the platform strategy. Creators who bring their own best practices into the guidance can grow into co-owners (D6). Ralf D. Müller builds apps (the Mathe-Karte) and appears among the app creators. What the platform owner is accountable for as an organisation, with its objectives, risks and capabilities, is described in the [business model](../about/#ch08-owners.biz42.md:el-owner-platform) (biz42).\n"}},{"id":"j-make-available","title":"Creators make their app available to others","arena":"ar-into-use","entities":["e-creators","e-adopters","e-social-media","e-github"],"kind":"job","loc":{"file":"1-exploration/e2-scan.pdt42.md","line":329,"heading":"Creators make their app available to others","prose":"\nToday creators put their apps on their own website, on GitHub or on social media, and talk about them with friends, maybe also with a teacher or a school. All of it stays local.\n"}},{"id":"j-find-reuse","title":"Adults find an existing app for re-use","arena":"ar-into-use","entities":["e-adopters","e-creators","e-teacher-platforms","e-social-media","e-github"],"job-step":"locate","kind":"job","loc":{"file":"1-exploration/e2-scan.pdt42.md","line":342,"heading":"Adults find an existing app for re-use","prose":"\nToday adults find apps by word of mouth, on teacher platforms such as fobizz or Serlo, or — engineers in particular — on GitHub. For engineers the search usually fails: they have an AI assistant build their own app instead, which leads into \"Building the app\" and produces yet another one-off app.\n"}},{"id":"j-confirm-use","title":"Adults confirm an app may be used","arena":"ar-into-use","entities":["e-adopters","e-gatekeepers"],"job-step":"confirm","kind":"job","loc":{"file":"1-exploration/e2-scan.pdt42.md","line":356,"heading":"Adults confirm an app may be used","prose":"\nWhether an app gets checked at all depends on each teacher's personal risk affinity. Careful teachers ask the school director or the computer science teacher; everyone else decides alone (recorded in the portrait in D1).\n"}},{"id":"j-bring-to-students","title":"Adults bring the app to students","arena":"ar-into-use","entities":["e-adopters","e-students"],"job-step":"execute","kind":"job","loc":{"file":"1-exploration/e2-scan.pdt42.md","line":370,"heading":"Adults bring the app to students","prose":"\nAdults use every available channel: link, QR code, projector, school tablets.\n"}},{"id":"j-students-find","title":"Students find an app to prepare for the next test","arena":"ar-into-use","entities":["e-students","e-adopters","e-creators","e-social-media","e-ai-assistants"],"job-step":"locate","kind":"job","loc":{"file":"1-exploration/e2-scan.pdt42.md","line":384,"heading":"Students find an app to prepare for the next test","prose":"\nStudents look for apps with a different motivation than adults: to survive the next test. They usually know an app because an adult showed it to them. That they also search via social media and AI assistants is an assumption, not an observation — to be validated.\n"}},{"id":"as-modelling-dsls","title":"Structured modelling DSLs as agent guidance","vrio":"vr","layer":"infrastructure","relates-to":["e-creators","e-ai-assistants"],"kind":"asset","loc":{"file":"1-exploration/e3-assets-moats.pdt42.md","line":24,"heading":"Structured modelling DSLs as agent guidance","prose":"\nlernapps.net builds on documentation DSLs: biz42 and pdt42 by the platform owner, and arc42 from docToolchain. They are structured models that both people and AI assistants can read, write and validate. The same approach can turn into the guidelines creators give their agents, so that similar apps get built quickly and efficiently instead of each one following its own principles.\n\nValuable, because agent guidance is what \"Building the app\" lacks today. Rare, because lernapps.net does not intend to earn money with it: commercial players keep such guidance to themselves, while we can give it away. Not inimitable: the DSLs are open source, and anyone can copy the approach.\n"}},{"id":"as-frontend-only","title":"Frontend-only architecture","vrio":"v","layer":"infrastructure","relates-to":["j-confirm-use","j-bring-to-students"],"kind":"asset","loc":{"file":"1-exploration/e3-assets-moats.pdt42.md","line":41,"heading":"Frontend-only architecture","prose":"\nThe platform and the apps it recommends run in the browser only: no server, no database, no installation, no sign-up. This removes the main doubts about fitness for use, and it causes no operating costs. Having no server is necessary for data protection, not sufficient: scripts, fonts or embedded content from third parties can still send data, so what an app loads has to be checked.\n\nValuable, because it answers exactly the question adults ask before bringing an app to students. Not rare: many small AI-built apps are static anyway. The advantage only arises once the property is checked and made visible.\n"}},{"id":"as-non-profit","title":"Non-profit at near-zero marginal cost","vrio":"vr","relates-to":["e-adopters","e-creators"],"kind":"asset","loc":{"file":"1-exploration/e3-assets-moats.pdt42.md","line":58,"heading":"Non-profit at near-zero marginal cost","prose":"\nlernapps.net is planned as a non-profit. This is sustainable because the frontend-only architecture causes no operating costs, and with good guidance the marginal cost of creating an app tends towards zero. So the whole offering can be free as well, without advertising or data collection.\n\nValuable, because it removes commercial doubts for adults and schools. Rare, because commercial teacher platforms cannot do this. Not inimitable: other non-profits such as Serlo show that the model can be copied.\n"}},{"id":"mo-data-protection","title":"Data protection law and terms of use","arena":"ar-into-use","category":"regulated","kind":"moat","loc":{"file":"1-exploration/e3-assets-moats.pdt42.md","line":78,"heading":"Data protection law and terms of use","prose":"\nThe GDPR (DSGVO) and terms of use can completely prevent an app from being used in class; there is no alternative route around them. As the tips suggest, lernapps.net does not try to replace this position. Instead it makes the interaction with it easier, for example through the frontend-only architecture. No holder is recorded: the regulation has no actor in the model.\n"}},{"id":"c-need-students","title":"Students understand the subject to get good grades","arena":"ar-into-use","visibility":100,"needs":["c-app","c-discoverability"],"entity":"e-students","kind":"component","loc":{"file":"1-exploration/e5-value-chain.pdt42.md","line":22,"heading":"Students understand the subject to get good grades","prose":"\nStudents want to understand the subject well so that they write good grades. This matches their job \"find an app to prepare for the next test\".\n"}},{"id":"c-need-parents","title":"Parents support their children's learning with little time","arena":"ar-into-use","visibility":95,"needs":["c-app","c-bring-to-students"],"entity":"e-adopters","kind":"component","loc":{"file":"1-exploration/e5-value-chain.pdt42.md","line":37,"heading":"Parents support their children's learning with little time","prose":"\nParents want the same as their children, but have little time to take care of it actively. An app that keeps their children learning on their own fills this gap.\n"}},{"id":"c-need-teachers","title":"Teachers gain free time by keeping students busy","arena":"ar-into-use","visibility":90,"needs":["c-app","c-bring-to-students"],"entity":"e-adopters","kind":"component","loc":{"file":"1-exploration/e5-value-chain.pdt42.md","line":52,"heading":"Teachers gain free time by keeping students busy","prose":"\nTeachers want to gain free time by keeping students busy with an app. Their reasons differ: time for individual support, time to prepare other things, and more.\n"}},{"id":"c-app","title":"Small educational app","arena":"ar-into-use","visibility":80,"evolution":"custom","target":"product","needs":["c-hosting","c-devices","c-ai-assistants"],"kind":"component","loc":{"file":"1-exploration/e5-value-chain.pdt42.md","line":69,"heading":"The app","prose":"\nThe small educational app itself: the part students see and work with.\n"}},{"id":"c-bring-to-students","title":"Bringing the app to students","arena":"ar-into-use","visibility":70,"evolution":"product","needs":["c-discoverability","c-fitness-signal","c-devices"],"kind":"component","loc":{"file":"1-exploration/e5-value-chain.pdt42.md","line":85,"heading":"Bringing the app to students","prose":"\nAdults use every available channel to get an app in front of their students: link, QR code, projector, school tablets.\n"}},{"id":"c-discoverability","title":"Discoverability of apps","arena":"ar-into-use","visibility":60,"evolution":"custom","target":"product","needs":[],"kind":"component","loc":{"file":"1-exploration/e5-value-chain.pdt42.md","line":100,"heading":"Discoverability","prose":"\nHow an app is found: by word of mouth, on teacher platforms, on social media or on GitHub. Students also look for apps themselves.\n"}},{"id":"c-fitness-signal","title":"Signal of fitness for use","arena":"ar-into-use","visibility":55,"evolution":"genesis","target":"product","needs":[],"kind":"component","loc":{"file":"1-exploration/e5-value-chain.pdt42.md","line":115,"heading":"Signal of fitness for use","prose":"\nWhat tells an adult that an app may be used: above all privacy, and the lowest possible barriers (no installation, no sign-up). Today each teacher judges this alone or asks a gatekeeper.\n"}},{"id":"c-hosting","title":"Hosting","arena":"ar-into-use","visibility":25,"evolution":"commodity","needs":[],"kind":"component","loc":{"file":"1-exploration/e5-value-chain.pdt42.md","line":130,"heading":"Hosting","prose":"\nWhere the app runs, for example GitHub Pages. It is a pure convenience: available to anyone, for free.\n"}},{"id":"c-ai-assistants","title":"AI assistants","arena":"ar-into-use","visibility":20,"evolution":"commodity","needs":[],"entity":"e-ai-assistants","kind":"component","loc":{"file":"1-exploration/e5-value-chain.pdt42.md","line":144,"heading":"AI assistants","prose":"\nThe tools apps are built with, and a way students find apps. There are many of them, but they are currently becoming part of every household's basic equipment.\n"}},{"id":"c-devices","title":"Devices and connectivity","arena":"ar-into-use","visibility":15,"evolution":"commodity","needs":[],"kind":"component","loc":{"file":"1-exploration/e5-value-chain.pdt42.md","line":159,"heading":"Devices and connectivity","prose":"\nThe devices and the network the app runs on, at school and at home.\n"}},{"id":"pl-personalise","play":"pp1","arena":"ar-into-use","affects":["c-discoverability","c-bring-to-students"],"insight":"Personalise on the website only, via local storage and collections carried in a link or QR code; an optional website backend without student accounts is left for later","kind":"play","loc":{"file":"1-exploration/e6-plays.pdt42.md","line":19,"heading":"PP1 · Personalise without accounts","prose":"\nThe platform website tailors what it shows to each visitor without the apps knowing anything about it. Two means keep it frontend-only and free of operating costs: the browser remembers the visitor's role (student, parent, teacher), grades, subjects and favourites in local storage, and teachers assemble collections of apps for their class that are carried entirely in a link or QR code. An optional backend for the website only, never for the apps and never with student accounts, stays an option for later: it could sync favourites and collections across devices and collect \"used in class\" feedback, at the price of operating costs and data protection duties.\n"}},{"id":"pl-creators-up","play":"pp2","arena":"ar-into-use","affects":["c-app","c-discoverability"],"insight":"Attention for contributed apps is the scarce resource; the platform exists to direct it to creators and their apps","kind":"play","loc":{"file":"1-exploration/e6-plays.pdt42.md","line":33,"heading":"PP2 · Bring creators on top","prose":"\nToday creators are hidden: their apps reach only their own circle and then rot. Attention for contributed apps is the scarce resource, so the platform has to put creators and their apps in front of the adults and students looking for them.\n"}},{"id":"pl-standard-listing","play":"pp3","arena":"ar-into-use","affects":["c-discoverability","c-bring-to-students"],"insight":"Standardise the listing of an app, so apps become comparable and can be passed on by link or QR code","kind":"play","loc":{"file":"1-exploration/e6-plays.pdt42.md","line":47,"heading":"PP3 · Standardise making an app available","prose":"\nEvery creator publishes differently today: own website, GitHub, social media. A uniform listing (what the app does, for whom, with a link and a QR code) makes apps comparable and easy to pass on.\n"}},{"id":"pl-guided-building","play":"pp4","arena":"ar-into-use","affects":["c-app"],"insight":"Agent guidance makes apps follow shared principles; it acts in \"Building the app\", but turns the app into a comparable product here","kind":"play","loc":{"file":"1-exploration/e6-plays.pdt42.md","line":61,"heading":"PP4 · Embed building in agent guidance","prose":"\nGuidelines for AI assistants turn building an app into a guided process, so apps follow shared principles instead of each its own. The play acts mainly in the arena \"Building the app\", but it changes what reaches this arena: apps become alike enough to be compared and trusted.\n"}},{"id":"pl-fitness-trust","play":"pp5","arena":"ar-into-use","affects":["c-fitness-signal"],"insight":"A visible signal of fitness for use, such as a frontend-only badge and classroom feedback, eases the interaction with data protection law","kind":"play","loc":{"file":"1-exploration/e6-plays.pdt42.md","line":75,"heading":"PP5 · Make fitness for use visible","prose":"\nToday each teacher judges alone whether an app may be used, or asks a gatekeeper. A visible signal, such as a frontend-only badge and feedback from classroom use, answers the question up front. It eases the interaction with the moat of data protection law instead of fighting it.\n"}},{"id":"pl-aggregate","play":"pp6","arena":"ar-into-use","affects":["c-discoverability"],"insight":"Bundle scattered apps and the people looking for them in one overview","kind":"play","loc":{"file":"1-exploration/e6-plays.pdt42.md","line":89,"heading":"PP6 · Aggregate the scattered offering","prose":"\nApps are spread over websites, GitHub and social media, and the people looking for them search in just as many places. One overview bundles the supply of apps and the demand of adults and students.\n"}},{"id":"sc-niches-meet","title":"The one app for the one gap is found","pattern":"e3","arena":"ar-into-use","impact":"A teacher looking for one topic in one grade finds the app someone built for exactly that gap","kind":"scenario","loc":{"file":"1-exploration/e7-brief.pdt42.md","line":19,"heading":"The one app for the one gap is found","prose":"\nEvery app teaches one aspect, and demand is just as fine-grained: a teacher looks for something on exactly one topic for exactly one grade. Today these niches never meet.\n"}},{"id":"sc-best-emerge","title":"Apps that work in class rise","pattern":"e8","arena":"ar-into-use","impact":"Feedback from classroom use and forks direct the scarce attention to the apps that work","kind":"scenario","loc":{"file":"1-exploration/e7-brief.pdt42.md","line":33,"heading":"Apps that work in class rise","prose":"\nMany apps are built and used once. As attention for contributed apps is the scarce resource, it has to go to the apps that work: feedback from classroom use and forks show which ones do.\n"}},{"id":"sc-platforms-as-channels","title":"Teacher platforms show apps from lernapps.net","pattern":"e12","arena":"ar-into-use","impact":"Non-profit teacher platforms become a channel for contributed apps instead of a competing offering","kind":"scenario","loc":{"file":"1-exploration/e7-brief.pdt42.md","line":47,"heading":"Teacher platforms show apps from lernapps.net","prose":"\nAdults already find apps on teacher platforms such as fobizz or Serlo. Instead of competing with them, lernapps.net lets them show its apps, so the platforms become a channel for contributed apps. This is likely limited to non-profit platforms such as Serlo: for commercial ones, free apps are rather unwelcome competition (D3).\n"}},{"id":"br-attention","title":"Attention for small learning apps","arena":"ar-into-use","entities":["e-creators","e-adopters","e-students"],"standardize":["Listing an app (what it does, for whom)","Passing an app on by link or QR code","Signalling fitness for use"],"product-side":["Guidance for AI assistants","Starter templates","Frontend-only hosting","Personalisation without accounts"],"moats":["mo-data-protection"],"kind":"brief","loc":{"file":"1-exploration/e7-brief.pdt42.md","line":61,"heading":"Attention for small learning apps","prose":"\nThe platformization space is the focus arena \"Getting apps into use\". The core relationship is between app creators and the adults who bring apps into use; students play an ancillary role, as they usually get to know an app through an adult. The brief collects what E3 to E6 found: the transactions to standardise, the traits of the product side, and the moat to reckon with.\n"}},{"id":"platform-lernapps","title":"lernapps.net","ecosystem":"eco-edu-apps","brief":"br-attention","narrative":"Free to use, kept alive by thanks. Adults and students find an active-learning app they can use right away, without doubt about whether it may be used; creators list theirs with almost no effort and hear when it helped. A thank-you, free and anonymous, is what keeps the platform alive.","owners":["e-platform-owner"],"core-entity":"e-adopters","ancillary-values":[],"infrastructure":["Website with the app overview","Agent guidance and starter templates","GitHub as the means of production: issue templates, GitHub Actions workflows, apps with their labels"],"kind":"platform","loc":{"file":"2-design/d1-ecosystem.pdt42.md","line":21,"heading":"lernapps.net","prose":"\nThe platform for the ecosystem of small, active-learning educational apps. The owner runs its infrastructure on GitHub, the platform's means of production: the website with the app overview, the agent guidance and starter templates, and the issue templates and GitHub Actions workflows contributions go through. Its core entity, chosen in D4, is the adopting adults.\n\nThe platform is free to use, and it lives on thanks. Every adult, student and creator should understand that a thank-you is how they keep it alive: it is what keeps creators contributing, and it costs nothing. The guidance through the platform makes this clear without being pushy.\n"}},{"id":"m-creators-adopters","from":"e-creators","to":"e-adopters","gives":"Apps for their class or child","status":"current","category":"goods","kind":"motivation","loc":{"file":"2-design/d3-motivations.pdt42.md","line":19,"heading":"Apps for their class or child","prose":"\nCreators give adults apps for their class or child. Today this stays within their own circle.\n"}},{"id":"m-adopters-creators-attention","from":"e-adopters","to":"e-creators","gives":"Attention: they put the app into use","status":"current","category":"attention","kind":"motivation","loc":{"file":"2-design/d3-motivations.pdt42.md","line":34,"heading":"Attention: they put the app into use","prose":"\nAdults give creators attention by putting their app into use, again only locally today. Attention for contributed apps is the scarce resource (E6).\n"}},{"id":"m-adopters-creators-feedback","from":"e-adopters","to":"e-creators","gives":"Feedback from classroom use","status":"potential","category":"feedback","kind":"motivation","loc":{"file":"2-design/d3-motivations.pdt42.md","line":49,"heading":"Feedback from classroom use","prose":"\nFeedback from classroom use hardly reaches creators today; its lack is one of their pressures (D2).\n"}},{"id":"m-adopters-creators-reputation","from":"e-adopters","to":"e-creators","gives":"Recognition by recommending the app","status":"potential","category":"reputation","kind":"motivation","loc":{"file":"2-design/d3-motivations.pdt42.md","line":64,"heading":"Recognition by recommending the app","prose":"\nRecommending an app would give its creator recognition, which creators seek (D2).\n"}},{"id":"m-creators-students","from":"e-creators","to":"e-students","gives":"Apps to understand the subject","status":"current","category":"goods","kind":"motivation","loc":{"file":"2-design/d3-motivations.pdt42.md","line":79,"heading":"Apps to understand the subject","prose":"\nThe apps are built for students, to help them understand the subject.\n"}},{"id":"m-students-creators","from":"e-students","to":"e-creators","gives":"Attention: they return to the app on their own","status":"current","category":"attention","kind":"motivation","loc":{"file":"2-design/d3-motivations.pdt42.md","line":94,"heading":"Attention: they return to the app on their own","prose":"\nStudents who know an app may return to it on their own.\n"}},{"id":"m-students-creators-gratitude","from":"e-students","to":"e-creators","gives":"Gratitude for an app that helped","status":"potential","category":"reputation","kind":"motivation","loc":{"file":"2-design/d3-motivations.pdt42.md","line":113,"heading":"Gratitude for an app that helped","prose":"\nStudents who were helped by an app could show some gratitude to its creator. This recognition comes from the people the app was built for.\n"}},{"id":"m-students-adopters-gratitude","from":"e-students","to":"e-adopters","gives":"Gratitude for bringing the app to them","status":"potential","category":"reputation","kind":"motivation","loc":{"file":"2-design/d3-motivations.pdt42.md","line":128,"heading":"Gratitude for bringing the app to them","prose":"\nStudents could be grateful to the adult who showed them an app that helped.\n"}},{"id":"m-adopters-creators-gratitude","from":"e-adopters","to":"e-creators","gives":"Gratitude for an app that worked in class","status":"potential","category":"reputation","kind":"motivation","loc":{"file":"2-design/d3-motivations.pdt42.md","line":143,"heading":"Gratitude for an app that worked in class","prose":"\nAdults could thank a creator for an app that worked in their class, beyond recommending it.\n"}},{"id":"m-creators-adopters-gratitude","from":"e-creators","to":"e-adopters","gives":"Gratitude for putting the app into use","status":"potential","category":"reputation","kind":"motivation","loc":{"file":"2-design/d3-motivations.pdt42.md","line":158,"heading":"Gratitude for putting the app into use","prose":"\nCreators could be grateful to adults who put their app into use and give feedback.\n"}},{"id":"m-creators-students-gratitude","from":"e-creators","to":"e-students","gives":"Gratitude for using the app","status":"potential","category":"reputation","kind":"motivation","loc":{"file":"2-design/d3-motivations.pdt42.md","line":173,"heading":"Gratitude for using the app","prose":"\nCreators could be grateful to students who use their app and come back to it.\n"}},{"id":"m-adopters-students-gratitude","from":"e-adopters","to":"e-students","gives":"Gratitude for working on their own","status":"potential","category":"reputation","kind":"motivation","loc":{"file":"2-design/d3-motivations.pdt42.md","line":188,"heading":"Gratitude for working on their own","prose":"\nTeachers and parents could be grateful to students who work on their own with an app.\n"}},{"id":"m-adopters-students","from":"e-adopters","to":"e-students","gives":"Access to the app by link, QR code or projector","status":"current","category":"access","kind":"motivation","loc":{"file":"2-design/d3-motivations.pdt42.md","line":203,"heading":"Access to the app by link, QR code or projector","prose":"\nStudents usually get to know an app through an adult, who uses every available channel.\n"}},{"id":"m-students-adopters","from":"e-students","to":"e-adopters","gives":"Free time while they work on their own","status":"current","category":"other","kind":"motivation","loc":{"file":"2-design/d3-motivations.pdt42.md","line":218,"heading":"Free time while they work on their own","prose":"\nWhile students work with an app on their own, teachers gain free time, for individual support or preparation.\n"}},{"id":"m-ai-creators","from":"e-ai-assistants","to":"e-creators","gives":"They build the app","status":"current","category":"services","kind":"motivation","loc":{"file":"2-design/d3-motivations.pdt42.md","line":233,"heading":"They build the app","prose":"\nCreators build their apps with AI assistants.\n"}},{"id":"m-platforms-adopters","from":"e-teacher-platforms","to":"e-adopters","gives":"An offering of teaching materials","status":"current","category":"services","kind":"motivation","loc":{"file":"2-design/d3-motivations.pdt42.md","line":248,"heading":"An offering of teaching materials","prose":"\nTeacher platforms are one place where adults find digital teaching offerings.\n"}},{"id":"m-adopters-platforms","from":"e-adopters","to":"e-teacher-platforms","gives":"Money for commercial platforms","status":"current","category":"money","kind":"motivation","loc":{"file":"2-design/d3-motivations.pdt42.md","line":263,"heading":"Money for commercial platforms","prose":"\nAdults pay commercial teacher platforms. This is the only flow of money in the matrix.\n"}},{"id":"m-platforms-creators","from":"e-teacher-platforms","to":"e-creators","gives":"Reach among teachers (likely only from non-profits)","status":"potential","category":"attention","kind":"motivation","loc":{"file":"2-design/d3-motivations.pdt42.md","line":278,"heading":"Reach among teachers","prose":"\nIf teacher platforms show contributed apps (scenario E12), they give creators reach among teachers. As free apps compete with commercial offerings, this is likely only from non-profit platforms.\n"}},{"id":"m-creators-platforms","from":"e-creators","to":"e-teacher-platforms","gives":"Offerings they don't have to produce themselves (mainly welcome to non-profits)","status":"potential","category":"goods","kind":"motivation","loc":{"file":"2-design/d3-motivations.pdt42.md","line":293,"heading":"Offerings they don't have to produce themselves","prose":"\nIn return, creators give teacher platforms offerings without producing them themselves. The gain is small: for commercial platforms, free apps are rather unwelcome competition, so probably only non-profit platforms appreciate them.\n"}},{"id":"m-media-creators","from":"e-social-media","to":"e-creators","gives":"Reach through recommendations","status":"current","category":"attention","kind":"motivation","loc":{"file":"2-design/d3-motivations.pdt42.md","line":308,"heading":"Reach through recommendations","prose":"\nApps travel by recommendation on social media.\n"}},{"id":"m-creators-media","from":"e-creators","to":"e-social-media","gives":"Content that gets shared","status":"current","category":"attention","kind":"motivation","loc":{"file":"2-design/d3-motivations.pdt42.md","line":323,"heading":"Content that gets shared","prose":"\nCreators share their apps on social media.\n"}},{"id":"m-creators-creators","from":"e-creators","to":"e-creators","gives":"Apps to build on instead of starting from scratch","status":"potential","category":"knowledge","kind":"motivation","loc":{"file":"2-design/d3-motivations.pdt42.md","line":338,"heading":"Apps to build on instead of starting from scratch","prose":"\nCreators could build on each other's apps instead of starting from scratch (D2).\n"}},{"id":"m-adopters-adopters","from":"e-adopters","to":"e-adopters","gives":"Recommendations to colleagues","status":"potential","category":"attention","kind":"motivation","loc":{"file":"2-design/d3-motivations.pdt42.md","line":353,"heading":"Recommendations to colleagues","prose":"\nAdults could recommend apps to colleagues; an assumption still to be validated.\n"}},{"id":"m-students-students","from":"e-students","to":"e-students","gives":"Recommendations to classmates","status":"potential","category":"attention","kind":"motivation","loc":{"file":"2-design/d3-motivations.pdt42.md","line":368,"heading":"Recommendations to classmates","prose":"\nStudents could recommend apps to classmates; an assumption still to be validated.\n"}},{"id":"r-creators-adults","title":"Creators and adults","between":["e-creators","e-adopters"],"core":true,"kind":"relationship","loc":{"file":"2-design/d4-relationships.pdt42.md","line":16,"heading":"Creators and adults","prose":"\nThe relationship the brief started from. Creators give adults apps; adults give creators attention and could give feedback, recognition and gratitude. These last three are all potential today, and they are what creators lack.\n"}},{"id":"r-adults-students","title":"Adults and students","between":["e-adopters","e-students"],"core":true,"kind":"relationship","loc":{"file":"2-design/d4-relationships.pdt42.md","line":29,"heading":"Adults and students","prose":"\nAdults bring apps to students by link, QR code or projector; students give teachers free time by working on their own. This is how most students get to know an app.\n"}},{"id":"r-creators-students","title":"Creators and students","between":["e-creators","e-students"],"core":true,"kind":"relationship","loc":{"file":"2-design/d4-relationships.pdt42.md","line":42,"heading":"Creators and students","prose":"\nThe apps are built for students, and students return to them on their own. Gratitude could flow in both directions.\n"}},{"id":"t-list-app","title":"List an app","relationship":"r-creators-adults","from":"e-creators","to":"e-adopters","direction":"one-way","value-unit":"An app listing: what it teaches, for whom, a link","happening":true,"channel":"ch-listing","motivation":"m-creators-adopters","job":"j-make-available","category":"goods","kind":"transaction","loc":{"file":"2-design/d5-transactions.pdt42.md","line":22,"heading":"List an app","prose":"\nA creator makes an app available to others. It happens today, but on each creator's own website, GitHub or social media, and in no comparable form.\n"}},{"id":"t-find-app","title":"Find an app for a topic and grade","relationship":"r-creators-adults","from":"e-creators","to":"e-adopters","direction":"one-way","value-unit":"A matching app for one topic and one grade","happening":true,"channel":"ch-app-overview","motivation":"m-creators-adopters","job":"j-find-reuse","category":"goods","kind":"transaction","loc":{"file":"2-design/d5-transactions.pdt42.md","line":43,"heading":"Find an app for a topic and grade","prose":"\nAn adult finds an app that fits their class. Today this depends on word of mouth, teacher platforms or luck.\n"}},{"id":"t-confirm-fitness","title":"Confirm an app may be used","relationship":"r-creators-adults","from":"e-creators","to":"e-adopters","direction":"one-way","value-unit":"A signal of fitness for use: frontend-only, no installation, no sign-up","happening":false,"channel":"ch-fitness-signal","job":"j-confirm-use","category":"knowledge","kind":"transaction","loc":{"file":"2-design/d5-transactions.pdt42.md","line":64,"heading":"Confirm an app may be used","prose":"\nAn adult checks whether an app may be used in class. Today each teacher judges alone or asks a gatekeeper.\n"}},{"id":"t-use-in-class","title":"Use an app in class","relationship":"r-creators-adults","from":"e-adopters","to":"e-creators","direction":"one-way","value-unit":"One use of the app in a class","happening":true,"channel":"ch-feedback","motivation":"m-adopters-creators-attention","category":"attention","kind":"transaction","loc":{"file":"2-design/d5-transactions.pdt42.md","line":84,"heading":"Use an app in class","prose":"\nAn adult puts the app into use. This is the attention creators get today, but it stays invisible to them.\n"}},{"id":"t-give-feedback","title":"Give feedback from classroom use","relationship":"r-creators-adults","from":"e-adopters","to":"e-creators","direction":"one-way","value-unit":"A short feedback note from one class","happening":false,"channel":"ch-feedback","motivation":"m-adopters-creators-feedback","category":"feedback","kind":"transaction","loc":{"file":"2-design/d5-transactions.pdt42.md","line":104,"heading":"Give feedback from classroom use","prose":"\nAn adult tells the creator how the app worked in class. This hardly happens today.\n"}},{"id":"t-recommend-app","title":"Recommend an app","relationship":"r-creators-adults","from":"e-adopters","to":"e-creators","direction":"one-way","value-unit":"A recommendation credited to the creator","happening":false,"channel":"ch-feedback","motivation":"m-adopters-creators-reputation","category":"reputation","kind":"transaction","loc":{"file":"2-design/d5-transactions.pdt42.md","line":124,"heading":"Recommend an app","prose":"\nAn adult recommends an app, and the recommendation is credited to its creator.\n"}},{"id":"t-thank-creator-adult","title":"Thank the creator","relationship":"r-creators-adults","from":"e-adopters","to":"e-creators","direction":"one-way","value-unit":"A thank-you to the creator","happening":false,"channel":"ch-feedback","motivation":"m-adopters-creators-gratitude","category":"reputation","kind":"transaction","loc":{"file":"2-design/d5-transactions.pdt42.md","line":144,"heading":"Thank the creator","prose":"\nAn adult thanks the creator for an app that worked in class.\n"}},{"id":"t-bring-app","title":"Bring an app to students","relationship":"r-adults-students","from":"e-adopters","to":"e-students","direction":"one-way","value-unit":"Access to one app or a collection","happening":true,"channel":"ch-collections","motivation":"m-adopters-students","job":"j-bring-to-students","category":"access","kind":"transaction","loc":{"file":"2-design/d5-transactions.pdt42.md","line":174,"heading":"Bring an app to students","prose":"\nAn adult gets an app in front of students. Today adults use every available channel: links, QR codes, the projector, school tablets.\n"}},{"id":"t-work-alone","title":"Work on their own with an app","relationship":"r-adults-students","from":"e-students","to":"e-adopters","direction":"one-way","value-unit":"A stretch of lesson time the teacher can use otherwise","happening":true,"motivation":"m-students-adopters","category":"other","kind":"transaction","loc":{"file":"2-design/d5-transactions.pdt42.md","line":196,"heading":"Work on their own with an app","prose":"\nStudents work with the app on their own, which gives the teacher free time.\n"}},{"id":"t-thank-adult","title":"Thank for bringing the app","relationship":"r-adults-students","from":"e-students","to":"e-adopters","direction":"one-way","value-unit":"A thank-you to the adult","happening":false,"motivation":"m-students-adopters-gratitude","category":"reputation","kind":"transaction","loc":{"file":"2-design/d5-transactions.pdt42.md","line":216,"heading":"Thank for bringing the app","prose":"\nStudents thank the adult who showed them an app that helped.\n"}},{"id":"t-learn-with-app","title":"Learn with an app","relationship":"r-creators-students","from":"e-creators","to":"e-students","direction":"one-way","value-unit":"A learning session on one topic","happening":true,"motivation":"m-creators-students","category":"goods","kind":"transaction","loc":{"file":"2-design/d5-transactions.pdt42.md","line":246,"heading":"Learn with an app","prose":"\nStudents use the app to understand the subject.\n"}},{"id":"t-return-to-app","title":"Return to an app","relationship":"r-creators-students","from":"e-students","to":"e-creators","direction":"one-way","value-unit":"A return visit before a test","happening":true,"channel":"ch-app-overview","motivation":"m-students-creators","job":"j-students-find","category":"attention","kind":"transaction","loc":{"file":"2-design/d5-transactions.pdt42.md","line":265,"heading":"Return to an app","prose":"\nStudents come back to an app on their own, for instance before the next test.\n"}},{"id":"t-thank-creator-student","title":"Thank the creator","relationship":"r-creators-students","from":"e-students","to":"e-creators","direction":"one-way","value-unit":"A thank-you to the creator","happening":false,"channel":"ch-feedback","motivation":"m-students-creators-gratitude","category":"reputation","kind":"transaction","loc":{"file":"2-design/d5-transactions.pdt42.md","line":286,"heading":"Thank the creator","prose":"\nStudents thank the creator for an app that helped them.\n"}},{"id":"ch-listing","title":"Effortless listing","medium":"digital","components":["A few fields: what the app teaches, for whom, where to find it","Automatic check and publication","Help from the creator's AI assistant"],"improvement":"Contributing an app takes minutes, without an own website or post","kind":"channel","loc":{"file":"2-design/d5-transactions.pdt42.md","line":310,"heading":"Effortless listing","prose":"\nCreators describe their app in a few fields and the platform turns it into a listing. The first contribution has to cost almost nothing, because reach is only a nice-to-have for creators (D4).\n"}},{"id":"ch-app-overview","title":"One place to find apps","medium":"digital","components":["Listings in one comparable format","Finding by topic and grade","Tailored to the visitor without accounts","Entry through referral links, with an explicit first step to have a look"],"improvement":"Finding an app no longer depends on word of mouth or luck","kind":"channel","loc":{"file":"2-design/d5-transactions.pdt42.md","line":327,"heading":"One place to find apps","prose":"\nAdults and students find apps in one place instead of by word of mouth. Referral links let people recommend the platform; who follows one takes an explicit first step (\"I'll have a look\"), which is counted openly per referral wave, never per person.\n"}},{"id":"ch-fitness-signal","title":"Visible fitness for use","medium":"digital","components":["Whether the app sends anything to third parties, checked rather than declared","Whether installation or sign-up is needed"],"improvement":"Adults no longer judge fitness for use alone or wait for a gatekeeper","kind":"channel","loc":{"file":"2-design/d5-transactions.pdt42.md","line":345,"heading":"Visible fitness for use","prose":"\nEvery listing answers the question adults ask before using an app. Having no server is not enough for that: what an app sends to third parties is checked, not taken from what its entry declares (lernapps/docs#11).\n"}},{"id":"ch-collections","title":"Passing apps on to a class","medium":"digital","components":["Several apps bundled for one class","Works on the devices a class already uses","No accounts for students"],"improvement":"Several apps reach a class in one step","kind":"channel","loc":{"file":"2-design/d5-transactions.pdt42.md","line":361,"heading":"Passing apps on to a class","prose":"\nAdults bring one app or several to their class in one step.\n"}},{"id":"ch-feedback","title":"Returning use and praise to creators","medium":"digital","components":["Thanks and structured feedback with one click, after use","Optionally inside the app, if its creator includes it","Counted openly: only explicit clicks and totals, no accounts or free text","Steps aside quietly when it cannot be reached"],"improvement":"Use and praise reach the creator instead of staying invisible, and every user knows that thanking keeps the free platform alive","kind":"channel","loc":{"file":"2-design/d5-transactions.pdt42.md","line":380,"heading":"Returning use and praise to creators","prose":"\nMakes use, feedback, recommendations and thanks visible to the creator, so the reputation flow keeps them (D4). Thanks is the currency of the free platform: every user should understand that a thank-you is how they keep it alive, without the platform being pushy about it.\n\nThere is no hidden data collection. Single interactions are counted openly, to learn whether valuable use happens: only explicit clicks, only totals, no cookies or browser storage, no personal data kept, and explained right where the click happens. Thanks and feedback are anonymous and structured (no free text), and they never identify a student. The apps themselves collect nothing. Creators can include the same thanks in their app; where it cannot be reached, it quietly steps aside.\n"}},{"id":"le-creators","entity":"e-creators","entry":["An app built for their own class or child","Guidance for building apps with their AI assistant"],"onboarding":["List the first app with almost no effort"],"getting-better":["Learn whether and how the app is used","Improve the app with feedback from classes"],"new-opportunity":["Let others build on the app and build on theirs","Bring their own best practices into the guidance and co-own the platform"],"evolves-to":["e-platform-owner"],"kind":"learning-engine","loc":{"file":"2-design/d6-learning-engine.pdt42.md","line":21,"heading":"App creators","prose":"\nCreators arrive with an app they built for their own class or child. Their hurdle is the first listing; after that, what keeps them is learning that and how their app is used. Experienced creators may want to bring their own best practices into the guidance, and so grow into co-owners of the platform.\n"}},{"id":"le-adults","entity":"e-adopters","entry":["Looking for an app for one topic and grade","A recommendation from a colleague"],"onboarding":["Find a fitting app and trust that it may be used"],"getting-better":["Assemble apps for their class","Give feedback, recommendations and thanks"],"new-opportunity":["Adapt an app or build their own"],"evolves-to":["e-creators"],"kind":"learning-engine","loc":{"file":"2-design/d6-learning-engine.pdt42.md","line":44,"heading":"Adopting adults","prose":"\nAdults arrive looking for an app for one topic and grade, or through a colleague's recommendation. Once they trust the platform, they can pass apps on, give back, and eventually adapt apps themselves.\n"}},{"id":"le-students","entity":"e-students","entry":["An adult shows them an app"],"onboarding":["Start an app without installation or sign-up"],"getting-better":["Return to apps and find new ones for their topic before a test","Thank the creator"],"new-opportunity":["Build their own app"],"evolves-to":["e-creators"],"kind":"learning-engine","loc":{"file":"2-design/d6-learning-engine.pdt42.md","line":66,"heading":"Students","prose":"\nStudents arrive through an adult. They get better at using apps on their own, for instance before a test. Some can become creators themselves, building an app for a topic they struggled with.\n"}},{"id":"s-building-guidance","title":"Guidance for building apps","for":["e-creators"],"stage":"onboarding","supports":[],"category":"empowering","kind":"service","loc":{"file":"2-design/d6-learning-engine.pdt42.md","line":89,"heading":"Guidance for building apps","prose":"\nHelps creators build apps with their AI assistant that are easy to use and fit the platform. It is the benefit that does not depend on reach (D4), and the same guidance lets adults start building.\n"}},{"id":"s-listing-help","title":"Help to list an app","for":["e-creators"],"stage":"onboarding","supports":["t-list-app"],"channel":"ch-listing","category":"empowering","kind":"service","loc":{"file":"2-design/d6-learning-engine.pdt42.md","line":103,"heading":"Help to list an app","prose":"\nTakes the effort out of the first listing, the hurdle for creators (D4).\n"}},{"id":"s-use-insight","title":"Insight into use and feedback","for":["e-creators"],"stage":"getting-better","supports":["t-use-in-class","t-give-feedback","t-recommend-app"],"channel":"ch-feedback","category":"empowering","kind":"service","loc":{"file":"2-design/d6-learning-engine.pdt42.md","line":119,"heading":"Insight into use and feedback","prose":"\nShows creators that and how their app is used, with feedback and thanks. This is the reputation flow that keeps them (D4).\n"}},{"id":"s-build-on-apps","title":"Building on existing apps","for":["e-creators"],"stage":"new-opportunity","supports":[],"category":"empowering","kind":"service","loc":{"file":"2-design/d6-learning-engine.pdt42.md","line":135,"heading":"Building on existing apps","prose":"\nLets creators start from an existing app instead of from scratch, and lets others build on theirs.\n"}},{"id":"s-contribute-practices","title":"Contributing best practices to the guidance","for":["e-creators"],"stage":"new-opportunity","supports":[],"category":"empowering","kind":"service","loc":{"file":"2-design/d6-learning-engine.pdt42.md","line":149,"heading":"Contributing best practices to the guidance","prose":"\nLets experienced creators bring their own best practices into the guidance for building apps. Whoever shapes the guidance shapes the platform, so this is the path from creator to co-owner.\n"}},{"id":"s-finding","title":"Finding apps by topic and grade","for":["e-adopters"],"stage":"onboarding","supports":["t-find-app"],"channel":"ch-app-overview","category":"other","kind":"service","loc":{"file":"2-design/d6-learning-engine.pdt42.md","line":163,"heading":"Finding apps by topic and grade","prose":"\nHelps adults find a fitting app in one place.\n"}},{"id":"s-start-right-away","title":"Starting an app right away","for":["e-students"],"stage":"onboarding","supports":["t-bring-app"],"channel":"ch-collections","category":"other","kind":"service","loc":{"file":"2-design/d6-learning-engine.pdt42.md","line":179,"heading":"Starting an app right away","prose":"\nStudents open an app an adult brought to them and start right away, without installation or sign-up.\n"}},{"id":"s-student-finding","title":"Finding apps before a test","for":["e-students"],"stage":"getting-better","supports":["t-return-to-app"],"channel":"ch-app-overview","category":"other","kind":"service","loc":{"file":"2-design/d6-learning-engine.pdt42.md","line":195,"heading":"Finding apps before a test","prose":"\nHelps students return to apps and find new ones for their topic on their own, for instance before a test.\n"}},{"id":"s-fitness-clarity","title":"Clarity on fitness for use","for":["e-adopters"],"stage":"onboarding","supports":["t-confirm-fitness"],"channel":"ch-fitness-signal","category":"other","kind":"service","loc":{"file":"2-design/d6-learning-engine.pdt42.md","line":211,"heading":"Clarity on fitness for use","prose":"\nAnswers whether an app may be used, before an adult brings it to class.\n"}},{"id":"s-class-sets","title":"Assembling apps for a class","for":["e-adopters"],"stage":"getting-better","supports":["t-bring-app"],"channel":"ch-collections","category":"other","kind":"service","loc":{"file":"2-design/d6-learning-engine.pdt42.md","line":227,"heading":"Assembling apps for a class","prose":"\nLets adults bundle apps for one class and bring them to students in one step, so students start without installation or sign-up.\n"}},{"id":"s-giving-back","title":"Giving feedback and thanks","for":["e-adopters","e-students"],"stage":"getting-better","supports":["t-give-feedback","t-recommend-app","t-thank-creator-adult","t-thank-creator-student"],"channel":"ch-feedback","category":"other","kind":"service","loc":{"file":"2-design/d6-learning-engine.pdt42.md","line":243,"heading":"Giving feedback and thanks","prose":"\nMakes it easy for adults and students to give feedback, recommendations and thanks, without accounts and without identifying students. It explains, without being pushy, that a thank-you is what keeps the free platform alive.\n"}},{"id":"s-adapt-apps","title":"From using to adapting apps","for":["e-adopters","e-students"],"stage":"new-opportunity","supports":[],"category":"other","kind":"service","loc":{"file":"2-design/d6-learning-engine.pdt42.md","line":259,"heading":"From using to adapting apps","prose":"\nOpens the path from the consumption to the production side: adults and students adapt an app or build their own, using the guidance for building apps.\n"}},{"id":"x-app-in-minutes","title":"An app in class within minutes","core-entity":"e-adopters","roles":["e-creators","e-students"],"relationship":"r-creators-adults","value-proposition":"The right active-learning app for this topic and grade, running in class within minutes, safe to use without checking it yourself","steps":["s-finding","t-find-app","s-fitness-clarity","t-confirm-fitness","t-bring-app","t-use-in-class","s-giving-back","t-thank-creator-adult","t-give-feedback"],"activities":["Keeping listings comparable and current","Listing only apps that meet the fitness criteria, so trust is built in"],"resources":["The listings","The signal of fitness for use"],"costs":["The platform owner's time","Near-zero operating costs, as the apps run in the browser"],"revenues":["No money: the platform is free","Thanks and feedback, which keep creators contributing and the platform alive"],"kind":"experience","loc":{"file":"2-design/d7-experiences.pdt42.md","line":22,"heading":"An app in class within minutes","prose":"\nThe journey of a teacher a few minutes before a lesson: find an app for this topic and grade, see at a glance that it may be used, put it on the projector or the class's devices, and say thanks afterwards.\n\n"}},{"id":"x-practice-tonight","title":"Practice tonight, before the test","core-entity":"e-adopters","roles":["e-students","e-creators"],"relationship":"r-adults-students","value-proposition":"Tonight, before tomorrow's test: an app your child can start right away","steps":["s-finding","t-find-app","t-bring-app","s-start-right-away","t-learn-with-app","s-giving-back","t-thank-creator-adult"],"activities":["Keeping listings findable by topic and grade","Keeping apps startable without installation or sign-up"],"resources":["The listings","The apps themselves, contributed by creators"],"costs":["The platform owner's time","Near-zero operating costs"],"revenues":["No money: the platform is free","Thanks, which keep creators contributing and the platform alive"],"kind":"experience","loc":{"file":"2-design/d7-experiences.pdt42.md","line":58,"heading":"Practice tonight, before the test","prose":"\nThe journey of a parent the evening before a test: find an app the child can start right away for the topic of tomorrow's test, let the child practise, and say thanks afterwards. The setting is the kitchen table, not the classroom, and the goal is the next test, like the students' own.\n\n"}},{"id":"x-list-and-hear-back","title":"List an app and hear it is used","core-entity":"e-creators","roles":["e-adopters"],"relationship":"r-creators-adults","value-proposition":"Build your app faster with good guidance, list it in minutes, and hear with
