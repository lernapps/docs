# Generation metadata of the overview (scripts/overview.mjs, served at /docs/overview/). Everything the page says
# about the platform and the system comes from the models: the platform design (pdt42) and the architecture
# (arc42). This file holds only the frame around it: headings and the texts that lead into each part, with
# placeholders in braces that the script fills from the models. It names no element of a model, so it cannot
# contradict one, and like the models it describes the target state, without counts or progress.

title: How lernapps.net works
eyebrow: lernapps.net · Docs
lead: >-
  For engineers and tech leads who work on the platform or want to understand it before they read its two models. The
  platform design says who takes part and what they give each other; the architecture says how the system is
  built.

guide:
  heading: "On this page:"

# The vision on top: a short claim in two colours, a paragraph and the link. It sums up docs/vision.md.
vision:
  de:
    label: Die Vision
    claim: ["Viele kleine Lösungen.", "Eine große Veränderung."]
    text: >-
      KI macht es leicht, genau die Lern-App zu bauen, die gerade gebraucht wird. Meist bleibt sie dort, wo sie
      entstanden ist. lernapps.net macht aus diesen Einzelstücken eine Veränderung für viele: auffindbar, frei nutzbar
      und so gebaut, dass sich niemand Sorgen machen muss.
    link: Zur Vision (Englisch)
  en:
    label: The vision
    claim: ["Many small solutions.", "One real change."]
    text: >-
      AI makes it easy to build exactly the learning app that is needed right now. Mostly it stays where it was made.
      lernapps.net turns these one-offs into a change for many: easy to find, free to use and built so that no one
      has to worry.
    link: To the vision

