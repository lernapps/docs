name: Pages

# Builds the docs (biz42, pdt42, vision, index) on every push and PR; deploys main to
# https://lernapps.github.io/docs/. In a PR, the built site, including the platform
# design's changes since the merge base (platform-design-diff/), is uploaded as the
# artifact site-preview, the change page also unzipped so it opens in the browser,
# and a comment on the PR (updated in place on every push) links to both and lists
# the changes — as pdt42's and biz42's own review workflows do.
# Actions are pinned to full commit SHAs (org rule).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the diff of a PR needs origin/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: ./scripts/build.sh
        env:
          PDT42_DIFF_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          name: site-preview
          path: _site
          if-no-files-found: error
      # Unzipped, the single-file page opens directly in the browser; the artifact is
      # named after the file.
      - if: github.event_name == 'pull_request'
        run: cp _site/platform-design-diff/index.html platform-design-review.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          path: platform-design-review.html
          archive: false
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  # Comments the platform design review on the PR; the only job that may write to it.
  review-comment:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read # the comment links to this run's artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-preview
          path: _site
      - run: node scripts/pdt42-review-summary.mjs _site/platform-design-diff/changes.json "origin/${{ github.base_ref }}" > summary.md
      - name: Report in the job summary and on the pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- lernapps-docs-platform-design-review -->";
            const { owner, repo } = context.repo;

            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id: context.runId, per_page: 100,
            });
            const urlOf = (name) => {
              const artifact = artifacts.find((candidate) => candidate.name === name);
              if (!artifact) throw new Error(`No artifact ${name} in run ${context.runId}`);
              return `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}/artifacts/${artifact.id}`;
            };
            let body = fs.readFileSync("summary.md", "utf8");
            if (body.includes("{{PAGE_URL}}")) {
              body = body.replaceAll("{{PAGE_URL}}", () => urlOf("platform-design-review.html"));
            }
            body = body.replaceAll("{{ARTIFACT_URL}}", () => urlOf("site-preview"));
            await core.summary.addRaw(body).write();

            // Pull requests from forks get a read-only token: the job summary has to do.
            const pullRequest = context.payload.pull_request;
            if (pullRequest.head.repo.full_name !== `${owner}/${repo}`) {
              core.notice("Pull request from a fork: see the job summary for the platform design review.");
              return;
            }
            const issue_number = pullRequest.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user?.type === "Bot" && comment.body?.includes(marker),
            );
            const changed = !body.includes("No platform design changes");
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else if (changed) {
              // Without platform design changes, only an existing comment is updated.
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
