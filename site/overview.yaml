roles:
  heading: Who takes part
  around: "Around them:"

reading:
  heading: How to read a journey
  intro: >-
    A journey is a sequence of steps people take. Where the platform helps with a step, it offers a service. The
    service reaches people through a channel, such as a page, a link or a template. A part of the system delivers
    the channel through one of its interfaces.
  example: >-
    For example: in the step "{step}", the platform offers the service "{service}". It reaches people through the
    channel "{channel}", which the interface "{iface}" of the part "{part}" delivers.
  gets: "What {role} get:"
  channel: "Channel:"
  consistsOf: "It consists of:"
  deliveredBy: "Delivered by:"
  partialPointer: Partly built; what is missing is described after the journeys.
  seeAbove: (See above.)
  startsFrom: "Building the app:"
  noService: "No service of its own; it reaches {role} through the channel"
  asIn: "As in the journey “{journey}”:"
  insideApp: Happens inside the app, without the platform.

experiences:
  heading: The three journeys
  intro: >-
    The first two journeys bring an app to learners, in class and at home. The third is the creator's: building an
    app, listing it and hearing that it helped.

gaps:
  heading: What is missing
  intro: >-
    The journeys hold up to the point where use and praise should flow back to the creator. These channels are
    delivered only in part: what the interfaces that deliver them do not do yet, and which services that affects.
  affects: "Affects:"

others:
  heading: Planned services
  wouldSupport: "Would support:"
  intro: >-
    The platform design names these services too. The three journeys do not require them, and none is built yet.

blocks:
  heading: "For reference: the parts of the system"
  outsideIntro: "The parts work with these systems outside the system:"
  intro: >-
    One part per repository. Each is described as a whole in the architecture and in detail in its own repository.
    The creators' own app repositories are outside the system; they use the tooling.
  delivering: Parts that deliver the channels
  supporting: Parts that support the others
  supportingIntro: These parts deliver no channel themselves; the platform is designed, decided and kept consistent with them.
  delivers: "Delivers the channel:"
  usedBy: "Used by:"
  outside: "Works with, outside the system:"

closing:
  heading: Where this leaves the platform
  text: >-
    {built} of the {total} services the journeys need are in place. Open are {partial}. Back to the idea at the top:
    these decide whether the platform can live on thanks.

sources:
  heading: Where this comes from
  text: >-
    Generated when the docs are built, from the platform design and the architecture. The build fails when a part of
