name: Pages

# Builds the site into _site/, checks it, and on main publishes it to the gh-pages branch, which GitHub Pages
# serves at https://lernapps.net/docs/. The same for every lernapps.net site: the steps are the shared
# actions in lernapps/tooling (npm ci, npm run build, npm run check; deploy to gh-pages without touching
# the previews). Renovate bumps the pinned commits.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check: # required status check
    runs-on: ubuntu-latest
    steps:
      - uses: lernapps/tooling/actions/site-check@3a97735bef1e524a766b6517037bbb8ceaeaee87 # main

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lernapps/tooling/actions/site-deploy@3a97735bef1e524a766b6517037bbb8ceaeaee87 # main
