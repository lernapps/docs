# Generation metadata of the overview (scripts/overview.mjs, served at /docs/overview/). Everything the page says
# about the platform and the system comes from the models: the platform design (pdt42) and the architecture
# (arc42). This file holds only the frame around it: headings and the texts that lead into each part, with
# placeholders in braces that the script fills from the models. It names no element of a model, so it cannot
# contradict one, and like the models it describes the target state, without counts or progress.

title: How lernapps.net works
eyebrow: lernapps.net · Docs
lead: >-
  Why the platform exists, which parts it is built from, what job each part does, and how people use them. For
  engineers and tech leads who work on the platform or want to understand it before they read its two models. The
  platform design says who takes part and what they give each other; the architecture says how the system is
  built.

guide:
  heading: "On this page:"

narrativeLabel: "The goal, in the platform design's words:"

roles:
  heading: Who takes part
  why: "the people the platform is for and the systems it relies on; the journeys are told from their views."
  intro: >-
    The platform exists for these people. The journeys below are told from their views, so knowing them tells you
    whose problem a part solves.
  outsideIntro: "The system relies on these systems outside it:"

parts:
  heading: The parts and where they live
  why: "the site map: each part's address, repository and job; the rest of the page names them."
  intro: >-
    This page calls them parts. Below is the site map: where you find each part and the job it does. The journeys and flows below name these
    parts, so this is the list to come back to.
  address: "Address:"
  repo: "Repository:"
  noAddress: No page of its own; it lives in its repository.

reading:
  heading: How to read a journey
  why: "how a step, a service and a part connect; read this once before the journeys."
  intro: >-
    The journeys connect the people above to the parts above. A journey is a sequence of steps people take. Where the platform helps with a step, it offers a service, and a
    part of the system provides it through one of its interfaces: the pages, links, templates or commands people
    actually use. Below each journey, a diagram shows how the parts work together behind it; every arrow carries the
    order to the part it points at.
  example: >-
    For example: in the step "{step}", the platform offers the service "{service}", which the interface "{iface}" of
    the part "{part}" provides.
  deliveredBy: "Delivered by:"
  seeAbove: (See above.)
  startsFrom: "Building the app:"
  asIn: "As in the journey “{journey}”:"
  insideApp: Happens inside the app, without the platform.
  getsBack: "What {role} get back from the other journeys:"

notYet:
  label: "Not yet:"
  explained: A dashed block marks where a part does not yet deliver what the journey needs, and says what is missing; where that leaves a step to a person, the risk it carries is named.
  risk: "Risk until then:"

experiences:
  heading: The journeys
  why: "the platform from its users' view, step by step, with the part that helps at each step and the parts working together behind it."
  behind: "Behind this journey: how the parts work together"
  intro: >-
    This is why the parts exist: each journey shows a person with a problem and the parts that help them solve it.

together:
  heading: How the parts work together
  why: "the flows behind the journeys that no user sees, for those who run or change the system."
  intro: >-
    The journeys show what users see. Behind them the parts pass work to each other in flows that no user sees.
    Read this if you run or change the system.

ideas:
  heading: Ideas
  why: "services the platform could offer later, each with an issue to discuss it."
  intro: >-
    Services the platform design names but no journey needs. They show where the platform could grow; each is
    discussed in its own issue, which is the place to take part.
  wouldSupport: "Would support:"
  issue: "Issue:"

blocks:
  heading: "For reference: the parts of the system"
  why: "every part with its interfaces, for looking something up."
  intro: >-
    Each part with the interfaces it offers, the services they serve and the parts that use them. Look things up
    here; each part is described as a whole in the architecture and in detail in its own repository.
  delivering: Parts that deliver what the journeys need
  supporting: Parts that support the others
  supportingIntro: These parts provide no service to a journey, but they take part in the flows behind them.
  delivers: "Serves:"
  usedBy: "Used by:"
  outside: "Works with, outside the system:"

readOn:
  heading: Read on
  intro: >-
    This page is the way in. Everything on it comes from the documents below; follow them for the full picture, in
    the depth each one has.
  items:
    - { title: Vision, href: vision/, text: "Why lernapps.net exists: the problem, what it does, its principles and what it is not." }
    - { title: Platform design, href: platform-design/, text: "Who takes part and what they give each other: roles, transactions, services, journeys and the MVP, as a pdt42 model." }
    - { title: Organisation, href: about/, text: "Who carries lernapps.net and what for: objectives, risks, capabilities and products of an undertaking no one earns money with, as a biz42 model." }
    - { title: Architecture, href: architecture/, text: "How the system is built: quality goals, building blocks, flows, deployment, decisions and risks, as an arc42 model." }
    - { title: llms.txt, href: llms.txt, text: "For AI assistants: where everything is and how to read the models with their CLIs, element by element." }

sources:
  text: >-
    Generated when the docs are built, from the platform design and the architecture. The build fails when a part of
    one names something the other does not have, so this page cannot drift from the two models.
