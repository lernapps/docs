name: Preview

# A preview of the docs for every pull request, at https://lernapps.net/docs/pr-preview/pr-<number>/,
# updated on every push and removed when the pull request is closed (shared action in lernapps/tooling).
# It contains the changes of the platform design (platform-design-diff/) and of the organisation
# (about-diff/) since the merge base, each as one page. One comment on the pull request, updated in place,
# links them and lists the changed elements (scripts/docs-review-summary.mjs).
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    # Pull requests from forks get a read-only token and cannot push to gh-pages.
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      PDT42_DIFF_BASE: origin/${{ github.base_ref }} # the build renders the changes since the merge base
    steps:
      - id: preview
        uses: lernapps/tooling/actions/site-preview@f1a5a5ec08e57f8a94ab80949deaecd0cf0ff2dd # main
        with:
          site: /docs/
          fetch-depth: 0 # the diff needs the base branch
          comment: false # the comment below lists the changes
      - if: github.event.action != 'closed'
        run: node scripts/docs-review-summary.mjs "origin/${{ github.base_ref }}" > summary.md
      - name: Comment on the pull request
        if: github.event.action != 'closed'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- lernapps-docs-platform-design-review -->";
            const { owner, repo } = context.repo;
            const site = process.env.PREVIEW_URL;
            const body = fs.readFileSync("summary.md", "utf8")
              .replaceAll("{{SITE_URL}}", site)
              + "\n<sub>The preview is ready once the GitHub Pages deployment of `gh-pages` has finished.</sub>\n";
            await core.summary.addRaw(body).write();
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.user?.type === "Bot" && c.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
