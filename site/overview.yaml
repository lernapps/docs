  partial: Partly built
  missing: Not built yet

roles:
  heading: Who takes part
parts:
  heading: The system in six parts
  intro: >-
    The platform is built from one part per repository. The journeys and flows below name them where they help; a
    fuller description of each follows at the end.

together:
  heading: How the parts work together
  intro: >-
    Behind the journeys: how a creator's app gets into the catalog, and how the system keeps itself current. The
    architecture describes these flows step by step.
  parts: "Parts involved:"

reading:
  heading: How to read a journey
  intro: >-
    A journey is a sequence of steps people take. Where the platform helps with a step, it offers a service, and a
    part of the system provides it through one of its interfaces: the pages, links, templates or commands people
    actually use. The way a service reaches people is called its channel; the gaps further down are listed by
    channel.
  example: >-
    For example: in the step "{step}", the platform offers the service "{service}", which the interface "{iface}" of
    the part "{part}" provides.
  gets: "What {role} get:"
  channel: "Channel:"
  consistsOf: "It consists of:"
  deliveredBy: "Delivered by:"
  partialPointer: Partly built; what is missing is described after the journeys.
  seeAbove: (See above.)
  startsFrom: "Building the app:"
  asIn: "As in the journey “{journey}”:"
  insideApp: Happens inside the app, without the platform.
  noService: No service of the platform at this step.

experiences:
  heading: The three journeys
  intro: >-
    The first two journeys bring an app to learners, in class and at home. The third is the creator's: building an
    app, listing it and hearing that it helped.

gaps:
  heading: What is missing
  intro: >-
    The journeys hold up to the point where use and praise should flow back to the creator. Below, for each of the
    two ways back that are only partly built, what the parts do not do yet and which services that affects.
  affects: "Affects:"

others:
  heading: Planned services
  wouldSupport: "Would support:"
  intro: >-
    The platform design names these services too. The three journeys do not require them, and none is built yet.

blocks:
  heading: "For reference: the parts of the system"
  outsideIntro: "The parts work with these systems outside the system:"
  intro: >-
    One part per repository. Each is described as a whole in the architecture and in detail in its own repository.
    The creators' own app repositories are outside the system; they use the tooling.
  delivering: Parts that deliver the channels
  supporting: Parts that support the others
  supportingIntro: These parts deliver no channel themselves; the platform is designed, decided and kept consistent with them.
  delivers: "Delivers the channel:"
  usedBy: "Used by:"
  outside: "Works with, outside the system:"

closing:
  heading: Where this leaves the platform
  text: >-
    Back to the idea at the top: until {partial} are complete, the platform cannot yet live on thanks.

sources:
