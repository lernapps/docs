name: Preview

# A preview of the docs for every pull request, at https://lernapps.net/docs/pr-preview/pr-<number>/,
# updated on every push and removed when the pull request is closed (shared action in lernapps/tooling).
# It contains the changes of the platform design (platform-design-diff/) and of the organisation
# (about-diff/) since the merge base, each as one page. One comment on the pull request, updated in place,
# links them and lists the changed elements (scripts/docs-review-summary.mjs).
# The change scope (lernapps/tooling changes.yml) gates it: no preview for a change of only the plan (.vibe/**);
# closing a pull request always removes its preview. The job `preview` always runs and reports the result, the
# check that never stays "Pending".
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    uses: lernapps/tooling/.github/workflows/changes.yml@e0865370e5ab26e7370b630159db93cad35a37c8 # main
    with:
      tooling-ref: e0865370e5ab26e7370b630159db93cad35a37c8 # the classifier of the same commit
    permissions:
      contents: read

  build:
    needs: changes
    runs-on: ubuntu-latest
    # Pull requests from forks get a read-only token and cannot push to gh-pages.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' || needs.changes.outputs.site == 'true')
    env:
      PDT42_DIFF_BASE: origin/${{ github.base_ref }} # the build renders the changes since the merge base
    steps:
      - id: preview
        uses: lernapps/tooling/actions/site-preview@e0865370e5ab26e7370b630159db93cad35a37c8 # main
        with:
          site: /docs/
          fetch-depth: 0 # the diff needs the base branch
          comment: false # the comment below lists the changes
      - if: github.event.action != 'closed'
        run: node scripts/docs-review-summary.mjs "origin/${{ github.base_ref }}" > summary.md
      - name: Comment on the pull request
        if: github.event.action != 'closed'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- lernapps-docs-platform-design-review -->";
            const { owner, repo } = context.repo;
            const site = process.env.PREVIEW_URL;
            const body = fs.readFileSync("summary.md", "utf8")
              .replaceAll("{{SITE_URL}}", site)
              + "\n<sub>The preview is ready once the GitHub Pages deployment of `gh-pages` has finished.</sub>\n";
            await core.summary.addRaw(body).write();
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.user?.type === "Bot" && c.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  preview: # always runs, fails when a job above failed or was cancelled
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "the jobs ended: $RESULTS"
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac
