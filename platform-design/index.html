 every thank-you when it helped a class beyond your own","steps":["s-building-guidance","s-listing-help","t-list-app","t-use-in-class","s-use-insight","t-thank-creator-adult","t-give-feedback","t-recommend-app"],"activities":["Maintaining the guidance for building apps","Checking and publishing listings","Returning thanks and feedback to creators"],"resources":["The guidance for building apps","The listings","The thanks and feedback, counted anonymously"],"costs":["The platform owner's time, later shared with co-owners (D6)","A small service for anonymous thanks, without tracking"],"revenues":["No money: the platform is free","Thanks as the currency that keeps creators contributing"],"kind":"experience","loc":{"file":"2-design/d7-experiences.pdt42.md","line":94,"heading":"List an app and hear it is used","prose":"\nThe journey of the supply side: a creator who built an app for their own class lists it with almost no effort and then hears that and how it helped elsewhere. Reach is no reason to start, but use and praise keep creators (D4). The thanks they receive is the same click every user is asked for.\n\n"}},{"id":"mvp-first-draft","title":"First draft: first apps","experiences":["x-list-and-hear-back","x-app-in-minutes"],"base":["5 to 10 potential creators from the platform owner's network","Teachers reached through the owner's contacts, who forward a referral link","The Mathe-Karte as a first app","The docs site and the GitHub organisation lernapps with its workflows"],"implementation":"Concierge: the owner invites the creators personally and helps with the first listing; listing, overview, referral links and the anonymous thanks are built for real, in their simplest form; the thanks is explained to no one, the platform has to make it self-evident","status":"planned","kind":"mvp","loc":{"file":"2-design/d8-mvp.pdt42.md","line":20,"heading":"First draft: first apps","prose":"\nStarts now, with the creators the platform owner knows. It tests the supply side, whether the anonymous thanks works at all, also from school networks, and whether the platform convinces teachers on its own. For the last, the owner's contacts forward a referral link to colleagues the owner does not know: the platform itself is the pitch. The thanks is part of the first draft too, and nobody is told about it: if thanks arrive, the platform made them self-evident.\n\n"}},{"id":"a-creators-list","title":"Creators list an app when it costs minutes","mvp":"mvp-first-draft","riskiest":true,"test":"Invite the 5 to 10 creators personally and help with the first listing","criteria":"At least 5 creators list an app within 2 weeks","status":"open","category":"attraction","kind":"assumption","loc":{"file":"2-design/d8-mvp.pdt42.md","line":41,"heading":"Creators list an app when it costs minutes","prose":"\nReach is no reason for creators to start (D4), so the first listing has to cost almost nothing. If they do not list even when invited personally, there is nothing to test the rest with.\n"}},{"id":"a-platform-convinces","title":"The platform convinces teachers on its own","mvp":"mvp-first-draft","riskiest":true,"test":"The owner's contacts forward a referral link of one wave to subject-matching colleagues; count \"I'll have a look\" and \"used in class\" clicks of that wave","criteria":"At least 3 teachers from the forwarded wave use an app and report it with a click","status":"open","category":"trust","kind":"assumption","loc":{"file":"2-design/d8-mvp.pdt42.md","line":58,"heading":"The platform convinces teachers on its own","prose":"\nTrust is tested at the moment of decision: does the platform's own address convince a teacher to use an app? Warm contacts would say yes for the owner's sake, so the owner's contacts forward a referral link to subject-matching colleagues the owner does not know. Only an action counts, not a promise. The referral code is one per wave, never per person: with numbers this small, totals per person would reveal individual behaviour.\n"}},{"id":"a-thanks-arrive-unexplained","title":"Thanks arrive without being explained","mvp":"mvp-first-draft","riskiest":true,"test":"Count the anonymous thanks per listed app; the owner explains the thanks to no one","criteria":"Thanks arrive for at least 3 listed apps within 4 weeks","status":"open","category":"business-model","kind":"assumption","loc":{"file":"2-design/d8-mvp.pdt42.md","line":75,"heading":"Thanks arrive without being explained","prose":"\nThe platform is free and lives on thanks (KD-17). Already in the first draft, thanks should arrive, without the owner explaining the thanks to anyone: the platform has to make it self-evident. With few users, the test can only say whether thanks arrive at all.\n"}},{"id":"a-creators-unpaid","title":"Creators contribute without payment","mvp":"mvp-first-draft","riskiest":true,"test":"Talk to each creator after listing and again after 4 weeks","criteria":"No creator asks for payment, and most name the guidance or the thanks as reason enough","status":"open","category":"business-model","kind":"assumption","loc":{"file":"2-design/d8-mvp.pdt42.md","line":92,"heading":"Creators contribute without payment","prose":"\nThe platform pays no one. Creators list their apps because they get guidance for building and thanks when their app helps (D4, D6), not money. This is the core of the free model.\n"}},{"id":"a-school-filters","title":"The anonymous thanks works, also from school networks","mvp":"mvp-first-draft","riskiest":false,"test":"Creators who teach send one thank-you from their school network and say whether it worked","criteria":"It works at most of the schools of the creators who teach","status":"open","category":"other","kind":"assumption","loc":{"file":"2-design/d8-mvp.pdt42.md","line":109,"heading":"The anonymous thanks works, also from school networks","prose":"\nThe thanks has to reach the platform from school networks, which often filter, and has to step aside quietly where it cannot. Without tracking, the origin of a thank-you is unknown, so creators who teach try it once from their school and report. It is good enough if it works at most of their schools.\n"}},{"id":"mvp-first-thanks","title":"First apps, first thanks","experiences":["x-app-in-minutes","x-practice-tonight","x-list-and-hear-back"],"base":["The apps listed in the first draft","Referral links and a short letter for the owner's contacts to forward","About 10 teachers, still to be reached through forwarding"],"implementation":"Concierge: the owner's contacts forward referral links per wave; thanks and structured feedback run through the real anonymous click; users are not accompanied or observed","status":"planned","kind":"mvp","loc":{"file":"2-design/d8-mvp.pdt42.md","line":134,"heading":"First apps, first thanks","prose":"\nThe real MVP, once the first draft holds. All three experiences take part. Teachers are reached through referral links that the platform owner's contacts forward, with the platform itself as the pitch and a short letter to go with it. Thanks and feedback run through the real anonymous click; users are not accompanied or observed.\n\n"}},{"id":"a-teachers-reached","title":"The platform reaches enough teachers through forwarding","mvp":"mvp-first-thanks","riskiest":true,"test":"Forwarding waves through the owner's contacts, counted per wave","criteria":"At least 10 teachers from forwarded waves use an app and report it with a click","status":"open","category":"attraction","kind":"assumption","loc":{"file":"2-design/d8-mvp.pdt42.md","line":154,"heading":"The platform reaches enough teachers through forwarding","prose":"\nWithout teachers, none of the demand-side assumptions can be tested. Reaching them is not a given: it depends on contacts forwarding the platform, and on the platform convincing on its own (tested in the first draft).\n"}},{"id":"a-thanks-arrive","title":"Thanks arrive","mvp":"mvp-first-thanks","riskiest":true,"test":"Count the anonymous thanks per listed app","criteria":"At least half of the listed apps receive at least one thank-you within 4 weeks","status":"open","category":"business-model","kind":"assumption","loc":{"file":"2-design/d8-mvp.pdt42.md","line":171,"heading":"Thanks arrive","prose":"\nThe platform is free and lives on thanks (KD-17). Without tracking, the test cannot say how many users do not thank; it can only say whether thanks reach the creators at all.\n"}},{"id":"a-thanks-keep-creators","title":"Thanks keep creators","mvp":"mvp-first-thanks","riskiest":true,"test":"Watch the creators' repositories for updates and new apps; talk to each creator after 6 weeks","criteria":"At least 3 creators who received thanks update their app or list another within 6 weeks, and say the thanks mattered","status":"open","category":"business-model","kind":"assumption","loc":{"file":"2-design/d8-mvp.pdt42.md","line":188,"heading":"Thanks keep creators","prose":"\nOnce their apps are used, praise and use should keep creators (D4). This decides whether thanks works as the currency.\n"}},{"id":"a-trust-built-in","title":"Teachers use an app without checking it themselves","mvp":"mvp-first-thanks","riskiest":true,"test":"Offer \"I was unsure whether I may use it\" as an answer in the structured feedback","criteria":"Chosen in fewer than 1 in 5 feedbacks","status":"open","category":"trust","kind":"assumption","loc":{"file":"2-design/d8-mvp.pdt42.md","line":205,"heading":"Teachers use an app without checking it themselves","prose":"\nTrust is built in rather than checked (KD-17): only apps that meet the fitness criteria are listed. The structured feedback after use carries the question, so no one is observed.\n"}},{"id":"a-running-in-minutes","title":"An app runs in class within minutes","mvp":"mvp-first-thanks","riskiest":false,"test":"Offer \"It took too long to get it running\" as an answer in the structured feedback","criteria":"Chosen in fewer than 1 in 5 feedbacks","status":"open","category":"attraction","kind":"assumption","loc":{"file":"2-design/d8-mvp.pdt42.md","line":222,"heading":"An app runs in class within minutes","prose":"\nThe value proposition for teachers in an acute moment, measured through an answer in the structured feedback.\n"}},{"id":"a-parents-find","title":"Parents find the platform the evening before a test","mvp":"mvp-first-thanks","riskiest":false,"status":"open","category":"attraction","kind":"assumption","loc":{"file":"2-design/d8-mvp.pdt42.md","line":240,"heading":"Parents find the platform the evening before a test","prose":"\nParents are not in the base yet. This is tested on purpose only once the riskiest assumptions hold, so it has no test yet.\n"}}],"edges":[{"from":"ar-building","to":"ar-spotting","relation":"after"},{"from":"ar-into-use","to":"ar-building","relation":"after"},{"from":"ar-evolving","to":"ar-into-use","relation":"after"},{"from":"j-make-available","to":"ar-into-use","relation":"arena"},{"from":"j-make-available","to":"e-creators","relation":"entities"},{"from":"j-make-available","to":"e-adopters","relation":"entities"},{"from":"j-make-available","to":"e-social-media","relation":"entities"},{"from":"j-make-available","to":"e-github","relation":"entities"},{"from":"j-find-reuse","to":"ar-into-use","relation":"arena"},{"from":"j-find-reuse","to":"e-adopters","relation":"entities"},{"from":"j-find-reuse","to":"e-creators","relation":"entities"},{"from":"j-find-reuse","to":"e-teacher-platforms","relation":"entities"},{"from":"j-find-reuse","to":"e-social-media","relation":"entities"},{"from":"j-find-reuse","to":"e-github","relation":"entities"},{"from":"j-confirm-use","to":"ar-into-use","relation":"arena"},{"from":"j-confirm-use","to":"e-adopters","relation":"entities"},{"from":"j-confirm-use","to":"e-gatekeepers","relation":"entities"},{"from":"j-bring-to-students","to":"ar-into-use","relation":"arena"},{"from":"j-bring-to-students","to":"e-adopters","relation":"entities"},{"from":"j-bring-to-students","to":"e-students","relation":"entities"},{"
